version: 1
default_owner: unknown

owners:
  - olav
  - olav-netops
  - olav-ent
  - olav-doc
  - olav-web
  - olav-collector

classes:
  - platform
  - netops
  - enterprise
  - docs
  - website
  - collector
  - runtime-workspace
  - testing
  - build
  - generated
  - legacy

statuses:
  - authoritative
  - transitional
  - externalized
  - misplaced
  - generated

# git: track | ignore | secret
#   track   — committed to this repo
#   ignore  — on disk for dev but NOT committed (non-release content, generated, sub-repos)
#   secret  — NEVER committed (credentials, env files)
#
# .gitignore is generated from this manifest via:
#   uv run python scripts/gen_gitignore.py

# file-type patterns that don't map to ownership paths
# (kept here so the generator can emit them into .gitignore)
gitignore_file_patterns:
  python:
    - "__pycache__/"
    - "*.py[cod]"
    - "*.so"
    - "*.egg-info/"
    - "*.egg"
    - "build/"
    - "sdist/"
    - "wheels/"
    - "MANIFEST"
  venv:
    - "venv/"
    - "env/"
  ide:
    - ".idea/"
    - "*.swp"
    - "*.swo"
    - "*~"
    - ".DS_Store"
  lint_cache:
    - "htmlcov/"
    - ".tox/"
    - ".hypothesis/"
    - ".mypy_cache/"
    - ".pyright_cache/"
    - "MagicMock/"
  misc:
    - "*.log"
    - "logs/"
    - "agent_outputs/"
    - "node_modules/"
  root_artifacts:
    - "_graph.html"
    - "backup-summary.json"
    - "export_*.json"
    - "r*_links.json"
    - "r*_analysis.json"
    - "*_analysis.json"
  temp_scripts:
    - "demo_*.py"
    - "parse_test.py"
    - "fix_openconfig_closure.py"
    - "test_playwright.py"
    - "test_watermark_integration.py"
    - "WATERMARK_IMPLEMENTATION_REPORT.md"
    - "TRAINING_DATA_*.md"

# Rules are evaluated top-to-bottom, last match wins.
# More specific rules MUST appear after broader ones.

rules:
  # ── Platform core (tracked — released) ─────────────────────────
  - pattern: src/*
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track

  - pattern: src/olav/**
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track

  # references/ dirs under workspace sub-agents are runtime-generated by
  # `olav registry register` — API reference markdown for registered services.
  # Override the src/olav/** track rule (last-match-wins).
  - pattern: src/olav/data/workspace/*/*/references/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: pyproject.toml
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track

  - pattern: uv.lock
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: ignore
    notes: lockfile — reproducible from pyproject.toml

  - pattern: README.md
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track

  - pattern: LICENSE
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track

  - pattern: ownership_manifest.yaml
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: ignore

  - pattern: CLAUDE.md
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: ignore

  - pattern: .gitignore
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track

  - pattern: langgraph.json
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track
    notes: langgraph dev server graph config — points at src/olav/server/graph_factory.py:graph

  - pattern: CHANGELOG.md
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track

  - pattern: PARTNERS.md
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: ignore

  - pattern: .dockerignore
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: ignore

  - pattern: dev_docs/**
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: ignore

  - pattern: docs/adr/**
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track

  - pattern: olav_kb/**
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: track
    notes: Global knowledge base (ADR-0015) — any-format documents loaded via `olav kb import-kb`

  - pattern: scripts/**
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: ignore

  - pattern: tools/**
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: ignore
    notes: root-level dev/benchmark tooling (e.g. compare_bench.py) — not part of release surface, parallels scripts/**

  - pattern: tests/**
    owner: olav
    class: testing
    status: authoritative
    enforced: true
    git: ignore

  # Demo DB Parquet fixtures — tracked for e2e CI (38.8 MB, zstd compressed)
  - pattern: tests/fixtures/demo_db/**
    owner: olav
    class: testing
    status: authoritative
    enforced: false
    git: track

  - pattern: run/**
    owner: olav
    class: platform
    status: authoritative
    enforced: true
    git: ignore

  # ── Lab artifacts ────────────────────────────────────────────────
  - pattern: labs/**
    owner: olav-netops
    class: netops
    status: transitional
    enforced: false
    git: ignore
    notes: lab topology files and device configs — local dev artifacts, not committed

  # ── Platform generated / ephemeral ─────────────────────────────
  - pattern: dist/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: exports/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: tmp/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: .coverage
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: .pytest_cache/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: .ruff_cache/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: .venv/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: .agent/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore
    notes: containerlab session files

  - pattern: .langgraph_api/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore
    notes: langgraph dev server runtime checkpoints (*.pckl, store) — never committed

  - pattern: olav-post/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore
    notes: local-only content archive — never publish to any remote

  - pattern: .github/workflows/**
    owner: olav
    class: platform
    status: authoritative
    enforced: false
    git: track
    notes: CI/CD GitHub Actions workflows

  - pattern: .github/copilot-instructions.md
    owner: olav
    class: platform
    status: authoritative
    enforced: false
    git: ignore
    notes: internal agent instructions — not for public repos

  - pattern: .github/skills/**
    owner: olav
    class: platform
    status: authoritative
    enforced: false
    git: track
    notes: VS Code agent skills (content-writer, social-poster)

  # ── Platform config / tooling ──────────────────────────────────
  - pattern: .vscode/**
    owner: olav
    class: platform
    status: authoritative
    enforced: false
    git: ignore

  - pattern: .claude/**
    owner: olav
    class: platform
    status: authoritative
    enforced: false
    git: ignore

  # ── Secrets (NEVER committed) ──────────────────────────────────
  - pattern: .env
    owner: olav
    class: platform
    status: authoritative
    enforced: false
    git: secret

  - pattern: .pypirc
    owner: olav
    class: platform
    status: authoritative
    enforced: false
    git: secret

  - pattern: .pypirc_test
    owner: olav
    class: platform
    status: authoritative
    enforced: false
    git: secret

  # ── Legacy ─────────────────────────────────────────────────────
  - pattern: _legacy_archived/**
    owner: olav
    class: legacy
    status: externalized
    enforced: false
    git: ignore
    notes: archived code — kept for reference only

  # ── Sub-repos (co-located but separate projects) ───────────────
  - pattern: olav-netops/**
    owner: olav-netops
    class: netops
    status: authoritative
    enforced: true
    git: ignore

  - pattern: olav-netops/exports/**
    owner: olav-netops
    class: generated
    status: generated
    enforced: false
    git: ignore

  # 2026-05-15 (dev_docs/79): kb_audit/ is the git-trackable audit
  # chain for every R102 commit + ``olav kb remove`` action.  It MUST
  # be tracked even though the parent olav-netops/ tree is gitignored
  # — losing kb_audit rows defeats the entire enterprise lifecycle
  # point of the source_tier + remove design.  Explicit per-path rule
  # overrides the ``olav-netops/**`` rule above because the gitignore
  # generator emits more-specific patterns later (negation rules).
  - pattern: olav-netops/.olav/workspace/kb_audit/**
    owner: olav-netops
    class: audit
    status: authoritative
    enforced: true
    git: track
    notes: |
      Per-action audit YAML rows (commit / remove). One file per
      action, named `<iso-ts>_<verb>_<intent>.yaml`. Git history is
      the canonical change record for KB mutations.

  # 2026-05-16: netops workspace authoritative source — SKILL.md /
  # prompts/ / references/ / tools/ for every sub-agent (analyze,
  # analyzer, collect, ingest, explorer, investigate, learner,
  # netops_init, sim, topology, export_netbox_csv).  Without tracking,
  # changes like the explorer system.md (dev_docs/83) only live on
  # disk and never propagate.  scripts/sync_netops_workspace.py keeps
  # the root mirror at ``.olav/workspace/netops/`` in sync.
  - pattern: olav-netops/.olav/workspace/netops/**
    owner: olav-netops
    class: netops
    status: authoritative
    enforced: true
    git: track
    notes: |
      Sub-agent definitions live here. The root ``.olav/workspace/
      netops/`` is a dev mirror per the matching rule below; this is
      the authoritative copy.

  # 2026-05-16 (parallel to netops/** above): audit workspace ships
  # bundled with olav-netops via `olav skill install` (see
  # olav-netops/workspace.yaml — the `workspaces:` list pulls audit
  # alongside netops + devops).  Author SKILL.md + runner tools (incl.
  # render_report.py with the Priority 2b builder) live here as the
  # authoritative copy.
  - pattern: olav-netops/.olav/workspace/audit/**
    owner: olav-netops
    class: netops
    status: authoritative
    enforced: true
    git: track
    notes: |
      Audit sub-agent definitions + profiles. Ships bundled with the
      netops workspace via `olav skill install <olav-netops-git-url>`.
      Authority lives here; the OLAV core wheel's
      ``src/olav/data/workspace/audit/`` is a dev fallback used by
      ``olav init`` when no skill pack is installed yet.

  # ADR-0014 Phase B (2026-06-02): devops MOVED to the platform wheel
  # (src/olav/data/workspace/devops/). netops now ships only netops + audit.
  # The olav-netops copy is retired; files removed. Rule kept as git: ignore
  # so any on-disk residue is not committed.  TODO: the infra/ network
  # reference docs (netbox_*/influxdb_*) are domain knowledge that rode along
  # into the platform wheel — extract them back to the netops skill pack
  # (overlay on install) so the platform devops ships generic.
  - pattern: olav-netops/.olav/workspace/devops/**
    owner: olav-netops
    class: netops
    status: externalized
    enforced: false
    git: ignore

  # SECRET — Nornir SSH credential file. The .example sibling stays
  # tracked; the real defaults.yaml has plaintext lab passwords and
  # MUST never be committed.  Lives inside the tracked netops tree
  # above; rule below takes precedence because secret_rules are
  # emitted after negations in scripts/gen_gitignore.py.
  - pattern: olav-netops/.olav/workspace/netops/collect/config/nornir/defaults.yaml
    owner: olav-netops
    class: netops
    status: authoritative
    enforced: true
    git: secret
    notes: |
      Real Nornir credentials (CLAB lab default cisco/<redacted-lab-password> etc).
      Copy from defaults.yaml.example, chmod 600, never commit.

  - pattern: olav-ent/**
    owner: olav-ent
    class: enterprise
    status: authoritative
    enforced: true
    git: ignore

  - pattern: olav-doc/**
    owner: olav-doc
    class: docs
    status: authoritative
    enforced: true
    git: ignore

  - pattern: olav-doc/site/**
    owner: olav-doc
    class: generated
    status: generated
    enforced: false
    git: ignore

  # ── olav-web (website + edge application) ────────────────────────
  - pattern: olav-web/**
    owner: olav-web
    class: website
    status: authoritative
    enforced: true
    git: ignore

  - pattern: olav-web/dist/**
    owner: olav-web
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: olav-web/node_modules/**
    owner: olav-web
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: olav-web/.wrangler/**
    owner: olav-web
    class: generated
    status: generated
    enforced: false
    git: ignore

  # ── olav-collector (standalone collector repo) ───────────────────
  # Co-located separate repository — offline-deployable network
  # collector (nornir + netmiko, bundled wheels, Dockerfile). Not part
  # of the olav release surface; never committed to this repo. Contains
  # credentials.env (lab SSH creds) covered by this ignore rule.
  - pattern: olav-collector/**
    owner: olav-collector
    class: collector
    status: authoritative
    enforced: true
    git: ignore
    notes: standalone co-located collector repo — never committed here

  # ── Workspace control plane ────────────────────────────────────
  - pattern: .olav/**
    owner: olav
    class: runtime-workspace
    status: authoritative
    enforced: true
    git: ignore
    notes: .olav/ uses whitelist model — default ignore, selective track via .gitignore negation

  - pattern: .olav/automations/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore
    notes: User-created automation scripts generated by devops/infra agent. Persistent across sessions, not platform code.

  - pattern: .olav/databases/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  - pattern: .olav/logs/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  # R-AGENT-HIERARCHY Phase A (2026-05-09): workspace consolidation
  # 6→3 user-facing orchestrators.  netops/ contains former ops/,
  # topology/, command_learner/, and ops-lab/ as sub-agents.
  # devops/ contains former devops/ + infra/ as sub-agents.
  # WORKSPACE-DUAL-COPY-DEBT Phase 3 COMPLETE (2026-06-03): GENERATED mirror,
  # git:ignore. Authoritative source = olav-netops/.olav/workspace/netops/;
  # `olav skill install olav-netops` deploys it (CI runs init + skill install).
  # The 4 netops cross-domain tools have a deliberate @tool↔script dual-version
  # split (netops/tools/X = @tool wrapper, netops/scripts/X = CLI script) — both
  # wrap olav_netops.core.* impl; allowlisted in test_tool_dedup_phase2.
  - pattern: .olav/workspace/netops/**
    owner: olav-netops
    class: generated
    status: generated
    target_repo: olav-netops
    reason: generated-mirror-deployed-by-olav-skill-install
    enforced: false
    git: ignore

  # ADR-0014 Phase C / Decision 5: `ops` is RETIRED as an agent — it has no
  # AGENT.md/SKILL.md, only netops_init runtime state snapshots
  # (netops_init/state/*.json). Formalized as generated/ignore. The
  # ops→netops config-dir rename tail (_DOMAIN_WORKSPACE_MAP["netops"]=="ops"
  # in src/olav/core/config.py + netops_init's state-path) is deferred — it
  # touches netops runtime state-path resolution and is gated on the e2e suite.
  - pattern: .olav/workspace/ops/**
    owner: olav-netops
    class: generated
    status: generated
    enforced: false
    git: ignore

  # WORKSPACE-DUAL-COPY-DEBT Phase 3 (2026-06-02): GENERATED mirror, git:ignore.
  # Authoritative source = src/olav/data/workspace/devops/ (wheel); `olav init`
  # deploys it (CI runs init — test.yml). Eliminates the runtime-vs-src dup.
  - pattern: .olav/workspace/devops/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  # WORKSPACE-DUAL-COPY-DEBT Phase 3 (2026-06-02): the CI-init fix landed, so
  # this GENERATED mirror is now git:ignore. Authoritative source =
  # src/olav/data/workspace/audit/ (wheel); `olav init` deploys it (byte-exact,
  # editable install). CI (test.yml) runs `olav init` before tests so they can
  # read it from a plain checkout.
  - pattern: .olav/workspace/audit/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  # ── .olav/ whitelist (tracked paths — negations) ───────────────
  - pattern: .olav/config/*.example
    owner: olav
    class: runtime-workspace
    status: authoritative
    enforced: true
    git: track

  - pattern: .olav/config/schemas/**
    owner: olav
    class: runtime-workspace
    status: authoritative
    enforced: true
    git: track

  # Live config files (non-example). These are instance-local runtime state
  # and frequently contain credentials (API keys, service passwords). Never
  # commit — keep the *.example templates as the tracked SSOT.
  - pattern: .olav/config/api.json
    owner: olav
    class: runtime-workspace
    status: authoritative
    enforced: true
    git: secret
    reason: contains-llm-api-keys

  - pattern: .olav/config/services.yaml
    owner: olav
    class: runtime-workspace
    status: authoritative
    enforced: true
    git: secret
    reason: service-registry-may-contain-credentials

  - pattern: .olav/config/approval_rules.yaml
    owner: olav
    class: runtime-workspace
    status: authoritative
    enforced: true
    git: ignore
    reason: per-install-approval-policy

  # Nornir inventory (config/defaults/groups). defaults.yaml carries device
  # login credentials (username/password) — NEVER commit.  Per-install runtime.
  - pattern: .olav/config/nornir/**
    owner: olav
    class: runtime-workspace
    status: authoritative
    enforced: true
    git: secret
    reason: contains-device-credentials

  # Runtime-discovered unsupported-command map (per platform/device). Generated
  # by the collection pipeline; instance-local state, not source.
  - pattern: .olav/config/unsupported.json
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore
    reason: runtime-generated-unsupported-command-data

  # Phase 3: GENERATED mirror (git:ignore). Authoritative = src/olav/data/
  # workspace/core/; `olav init` deploys it (byte-exact, editable install).
  - pattern: .olav/workspace/core/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  # ADR-0014: services is a platform-core top-level agent (service lifecycle).
  # Phase 3: GENERATED mirror (git:ignore). Authoritative = src/olav/data/
  # workspace/services/; `olav init` deploys it.
  - pattern: .olav/workspace/services/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore

  # admin is a platform top-level agent (ADR-0012) — platform self-management
  # (ops/installer/editor). Authoritative source = src/olav/data/workspace/admin/.
  # Phase 3: GENERATED mirror (git:ignore); `olav init` deploys it.
  - pattern: .olav/workspace/admin/**
    owner: olav
    class: generated
    status: generated
    enforced: false
    git: ignore
