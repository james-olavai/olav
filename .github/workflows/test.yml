name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Nightly at 02:00 UTC — runs E2E suite (requires secrets)
    - cron: "0 2 * * *"

# ── Embed configuration ──────────────────────────────────────────
# GitHub-hosted runners are on the public internet and cannot reach OLAV's
# internal embedding endpoint (192.168.8.12:11433) — unlike the gitea runner,
# which .gitea/workflows/ci.yml points at it directly.  So this forge stays on
# the on-CPU embedder, which `uv sync --all-extras` still installs because
# sentence-transformers lives in the `[local-embed]` extra.
#
# This was previously implicit: `EmbeddingConfig.mode` defaulted to "local" and
# no workflow said so.  That default flipped to "api" on 2026-08-04 (every doc
# had claimed "api" for releases), so the mode must now be stated here or these
# jobs would silently switch to an API endpoint they have no base_url for and
# degrade to no embeddings at all.
env:
  OLAV_EMBEDDING_MODE: local

jobs:
  # ─────────────────────────────────────────────────────────────
  # Unit tests — always run, no external dependencies
  # ─────────────────────────────────────────────────────────────
  unit:
    name: Unit tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite:
          - root        # src/olav + tests/unit/
          - netops      # olav-netops + olav-netops/tests/unit/
          - presales    # olav-presales + olav-presales/tests/
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-extras

      # WORKSPACE-DUAL-COPY-DEBT Phase 3: platform agent runtime
      # (.olav/workspace/{core,audit,admin,devops,services}) is no longer
      # tracked — it's the generated mirror of src/olav/data/workspace/.
      # `olav init` deploys it from the (editable-installed) wheel source so
      # tests can read it. Reproduction is byte-exact under editable install.
      - name: Bootstrap platform workspace (olav init)
        run: uv run olav init

      # netops runtime (.olav/workspace/netops) is also a generated mirror
      # (of olav-netops/.olav/workspace/netops) — deploy it via skill install
      # so tests/runtime can read it from a plain checkout.
      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      - name: Run unit tests — root
        if: matrix.suite == 'root'
        run: uv run pytest tests/unit/ -q --tb=short

      - name: Run unit tests — netops
        if: matrix.suite == 'netops'
        run: uv run pytest olav-netops/tests/unit/ -q --tb=short
        continue-on-error: true  # netops unit dir may not exist yet

      # olav-presales depends on olav-netops (link_id reuse + topology shape).
      - name: Install olav-presales as Python package
        if: matrix.suite == 'presales'
        run: |
          uv pip install -e "olav-netops/[sim]"
          uv pip install -e olav-presales

      - name: Run unit tests — presales
        if: matrix.suite == 'presales'
        run: uv run pytest olav-presales/tests/ -q --tb=short

  # ─────────────────────────────────────────────────────────────
  # Gate tests — always run; auto-skip if DB absent
  # ─────────────────────────────────────────────────────────────
  gates:
    name: Gate tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite:
          - root        # tests/gates/
          - netops      # olav-netops/tests/gates/
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-extras

      # WORKSPACE-DUAL-COPY-DEBT Phase 3: platform agent runtime
      # (.olav/workspace/{core,audit,admin,devops,services}) is no longer
      # tracked — it's the generated mirror of src/olav/data/workspace/.
      # `olav init` deploys it from the (editable-installed) wheel source so
      # tests can read it. Reproduction is byte-exact under editable install.
      - name: Bootstrap platform workspace (olav init)
        run: uv run olav init

      # netops runtime (.olav/workspace/netops) is also a generated mirror
      # (of olav-netops/.olav/workspace/netops) — deploy it via skill install
      # so tests/runtime can read it from a plain checkout.
      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      - name: Run gate tests — root
        if: matrix.suite == 'root'
        run: uv run pytest tests/gates/ -q --tb=short

      - name: Run gate tests — netops
        if: matrix.suite == 'netops'
        run: uv run pytest olav-netops/tests/gates/ -q --tb=short

  # ─────────────────────────────────────────────────────────────
  # Governance tests — always run; split by delivery unit
  #   platform:    tests/governance/ -m "not netops"  (~771 tests, ~10s)
  #   netops:      tests/governance/ -m netops         (~306 tests,  ~6s)
  #   integration: included in both runs via -m filter  (389 tests)
  #
  # Markers are auto-applied by tests/conftest.py at collection time;
  # no individual test files need manual @pytest.mark decoration.
  # ─────────────────────────────────────────────────────────────
  governance:
    name: Governance (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - platform   # -m "not netops": platform + integration + generic
          - netops     # -m netops: netops + integration
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Bootstrap platform workspace (olav init)
        run: uv run olav init

      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      # presales is the 7th top-level agent (ADR-0017) — test_v018_compliance
      # asserts the runtime .olav/workspace/ dir set, so the presales workspace
      # must be deployed before the platform governance suite runs.
      - name: Install presales skill pack
        run: |
          uv pip install -e olav-presales
          uv run olav skill install olav-presales

      - name: Run governance — platform (not netops)
        if: matrix.suite == 'platform'
        run: uv run pytest tests/governance/ -q --tb=short -m "not netops"

      - name: Run governance — netops
        if: matrix.suite == 'netops'
        run: uv run pytest tests/governance/ -q --tb=short -m netops

  # ─────────────────────────────────────────────────────────────
  # Layer 2 E2E — always run, no LLM / no external infra needed
  #
  # These 8 test files (50 tests, ~65s) exercise platform and netops
  # behaviours without requiring an LLM API, demo DB, CLAB, or Netmiko.
  # They were previously hidden in the nightly e2e job and never ran on PR.
  #
  # Excluded from this job (nightly-only, need real infra):
  #   test_lab_e2e_minimal.py    — PROBE_E2E_ENABLED + CLAB host
  #   test_cab_digital_twin_e2e  — CLAB_API_TOKEN + live containerlab
  #   test_diff_netmiko_e2e      — DIFF_E2E_ENABLED + SSH devices
  #   test_ingest_clab_roundtrip — INGEST_E2E_ENABLED + CLAB lab
  #   test_m4_l4_e2e             — L4_WEB_E2E_ENABLED + running server
  #   test_web_ui_multi_agent_browser — playwright + browser
  #   all *_LLM_SKIP gated tests — require LLM API key
  # ─────────────────────────────────────────────────────────────
  e2e-fast:
    name: E2E fast (no-LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Bootstrap platform workspace (olav init)
        run: uv run olav init

      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      - name: Run no-LLM e2e tests
        env:
          OLAV_AUTH_MODE: none
        run: |
          uv run pytest \
            tests/e2e/test_m1_platform_e2e.py \
            tests/e2e/test_phase1_collection.py \
            tests/e2e/test_phase2_normalization.py \
            tests/e2e/test_phase3_topology.py \
            tests/e2e/test_phase4_nl_acceptance.py \
            tests/e2e/test_uks_cli.py \
            tests/e2e/test_uks_e2e_full.py \
            tests/e2e/test_uks_recall.py \
            -q --tb=short

  # ─────────────────────────────────────────────────────────────
  # E2E tests — nightly only, requires PROBE_E2E_ENABLED secret
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E tests (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    env:
      PROBE_E2E_ENABLED: "1"
      DEVOPS_E2E_ENABLED: "1"
      OLAV_CLAB_HOST: ${{ secrets.OLAV_CLAB_HOST }}
      OLAV_LLM_API_KEY: ${{ secrets.OLAV_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-extras

      # WORKSPACE-DUAL-COPY-DEBT Phase 3: platform agent runtime
      # (.olav/workspace/{core,audit,admin,devops,services}) is no longer
      # tracked — it's the generated mirror of src/olav/data/workspace/.
      # `olav init` deploys it from the (editable-installed) wheel source so
      # tests can read it. Reproduction is byte-exact under editable install.
      - name: Bootstrap platform workspace (olav init)
        run: uv run olav init

      # netops runtime (.olav/workspace/netops) is also a generated mirror
      # (of olav-netops/.olav/workspace/netops) — deploy it via skill install
      # so tests/runtime can read it from a plain checkout.
      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      - name: Run root E2E tests
        run: uv run pytest tests/e2e/ -q --tb=short
        continue-on-error: true  # infrastructure failures should not block the run

      - name: Run netops E2E claims
        run: uv run pytest olav-netops/tests/test_claims_e2e.py -q --tb=short
        continue-on-error: true
