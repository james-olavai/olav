# Nornir Inventory - Device Groups

# Environment groups (ARCH-08 Phase 1) — tag devices by deployment stage so
# downstream tooling can scope operations (``--environment lab|prod``).
# Individual devices can also carry ``data.environment`` to override the
# group default.
lab:
  data:
    environment: lab

prod:
  data:
    environment: prod

staging:
  data:
    environment: staging

# Test group - all lab/test devices
test:
  data:
    site: lab
    environment: lab
    role: test

core:
  data:
    site: datacenter
    role: core

border:
  data:
    role: border

distribution:
  data:
    role: distribution

access:
  data:
    role: access

cisco_ios:
  platform: cisco_ios
  connection_options:
    netmiko:
      extras:
        device_type: cisco_ios

juniper_junos:
  platform: juniper_junos
  connection_options:
    netmiko:
      extras:
        device_type: juniper_junos

huawei_vrp:
  platform: huawei_vrp
  connection_options:
    netmiko:
      extras:
        device_type: huawei
