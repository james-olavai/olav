body: |
  ## How to classify a network from the data

  This guide tells the explorer how to **infer the network type** from
  what's in ``netops.*``.  Classification is a hint — it shapes which
  L1-L4 playbook is most useful — but it's never definitive: real
  networks are often hybrids.  When you spot multiple types, audit
  for all of them.

  ## Five canonical types

  ### `campus_access` (incl. campus wireless)

  **Strong signals**:

  - `>40%` of `netops.devices` have model matching
    `WS-C3850-*`, `C9300-*`, `C9400-*`, `WS-C3650-*`, `WS-C2960-*`
  - Wireless controllers present: `C9800-*` model OR hostname
    containing `wlc` OR `airos`
  - Commands captured include `show authentication sessions`,
    `show wireless mobility summary`, `show power inline`
  - CDP `destination_device` field contains AP-like names
    (`-ap`, `ap-`, `aps-`) en masse
  - `cisco_ios` platform dominates

  **Audit priorities**: see ``campus_wireless_l1_l4_issues``.

  ### `dc_fabric`

  **Strong signals**:

  - `>30%` of devices on `cisco_nxos` platform
  - Model includes `N9K-*` / `N7K-*` / `N5K-*`
  - Commands captured include `show vpc`, `show feature`,
    `show l2route`, `show nve peers`
  - `show ip bgp evpn` or `show ip route vrf default` shows
    EVPN address-family

  **Audit priorities**: see ``dc_fabric_l1_l4_issues``.

  ### `isp_edge`

  **Strong signals**:

  - `cisco_xr` or `juniper_mx` or `juniper_mx*` in platform
  - `ASR-*` models in `netops.devices.model`
  - `>100` rows in `netops.v_show_ip_bgp_neighbors_auto`
  - MPLS commands captured (`show mpls ldp neighbor`,
    `show mpls forwarding-table`)
  - eBGP peer count `>20` per device

  **Audit priorities**: see ``isp_edge_l1_l4_issues``.

  ### `sdwan`

  **Strong signals**:

  - `viptela_*` or `velocloud_*` platform strings
  - `vEdge` / `cEdge` model strings
  - Commands captured include `show sdwan*`, `show vmanage`,
    `show app-route stats`
  - Topology has many low-degree leaves (remote sites)

  **Audit priorities**: see ``sdwan_l1_l4_issues``.

  ### `enterprise_branch`

  **Strong signals**:

  - Mix of `ISR-*` routers + `Catalyst 2960/3560` access
  - `>30` distinct sites in `netops.devices.site`
  - VPN commands captured (`show crypto isakmp sa`,
    `show crypto ipsec sa`)
  - WAN-style up/down/jitter from `show ip sla`

  **Audit priorities**: see ``enterprise_branch_l1_l4_issues``.

  ## How to use the classification

  1. Run SURVEY queries against `netops.devices.platform`,
     `netops.devices.model`, `SELECT DISTINCT command FROM
     netops.parsed_outputs`, `netops.topology_links` row counts.
  2. Match those facts against the strong signals above.
  3. State your guess explicitly (e.g., "this is **campus_access**
     with a heavy wireless component").  Allow hybrid classification.
  4. The relevant L1-L4 playbook should autorecall into your context
     based on its keywords; use its issue list as PLAN input.
  5. If no playbook surfaces and your classification is uncertain,
     fall back to first-principles exploration (look at error
     counters, link status flap counts, route-table size outliers).

  ## Anti-patterns

  - Don't force-classify when signals are weak — record the
    classification as a `confidence='hypothesis'` finding, then
    explore both possibilities.
  - Don't apply a `campus_wireless` playbook to a DC fabric just
    because gemma4 saw one wireless command; rebalance based on
    majority of evidence.
  - The classification itself is *not* a finding worth recording
    unless surprising (e.g., "discovered hidden DC inside a campus
    network").
