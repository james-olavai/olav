body: |
  # Batfish vendor support reference (used by ``batfish_capability``)

  Sim can answer a question only when Batfish parses the device's
  config.  Mismatch between snapshot scope and Batfish coverage is
  the #1 source of "Sim returned 4 rows instead of 6" surprises.

  ## Capability tiers

  | Vendor / nornir platform | Capability | Notes |
  |---|---|---|
  | cisco_ios, cisco_iosxe, cisco_nxos, cisco_asa | FULL | production-grade parsers |
  | juniper_junos | FULL | both ``configure``-mode and ``display set`` ingested |
  | arista_eos | FULL | |
  | paloalto_panos | FULL | |
  | f5_bigip | FULL | |
  | aws_vpc | FULL | (cloud configs) |
  | cisco_iosxr | PARTIAL | XR parsing has known gaps in IS-IS / SR / TP |
  | nokia_sros | PARTIAL | partial routing instances |
  | huawei_vrp | PARTIAL | basic L2/L3 only |
  | fortinet_fortios | PARTIAL | firewall objects; routing limited |
  | checkpoint_gaia | PARTIAL | firewall; not routing |
  | nokia_srl / nokia_srlinux | NONE | no Batfish parser as of 2025.7 |
  | h3c / h3c_comware | NONE | |
  | mikrotik_routeros | NONE | |
  | ruijie | NONE | |
  | vyos | NONE | |

  ## Reading ``batfish_capability`` output

  ```
  summary == "FULL"    → proceed with batfish_q; reply has no caveat
  summary == "PARTIAL" → proceed BUT prepend caveat listing the
                         unsupported_devices + partially_supported_devices
  summary == "NONE"    → DO NOT call batfish_q.  Reply early with
                         "Batfish cannot evaluate any device in scope —
                          delegate to analyzer SQL or lab".
  summary == "EMPTY"   → scope didn't resolve any device — caller bug
  ```

  ## When to also call ``batfish_q(question='fileParseStatus')``

  Static map (``BATFISH_VENDOR_SUPPORT``) is a prediction.  Live
  ``fileParseStatus`` is ground truth from the snapshot Batfish
  actually ingested.  Differences happen when:

  - The snapshot's config file is empty / truncated (device collected
    but only partial output)
  - Vendor parser version changed (Batfish 2025.7 may have parsers
    not in earlier versions, or vice versa)
  - Config has a malformed section that Batfish silently skips

  Recommend calling once per snapshot (cache the result internally
  for that snapshot's session).

  ## How analyzer should consult this BEFORE delegating to sim

  analyzer should run ``batfish_capability(devices=scope)`` itself
  (the tool is read-only on netops.devices — no Batfish required) to
  decide:

  - All FULL → safe to ``task("simulator", ...)``
  - PARTIAL → still delegate, but include in your synthesised report
    a "Scope coverage" caveat noting which devices Batfish saw
  - NONE → skip sim entirely; tell user "for these vendors, current
    architecture has no config-layer evaluator; rely on analyzer's
    SQL state observations or (when available) lab experimental verification"
