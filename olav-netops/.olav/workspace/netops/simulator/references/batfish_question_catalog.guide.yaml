body: |
  # Batfish question catalog — sim's top-10

  Pick a question per the caller's intent.  Each entry: name, what it
  answers, ``q_args`` schema, sample return columns, common gotchas.

  ---

  ## bgpSessionStatus  — "is the BGP session UP per the configs?"

  q_args:
    - ``nodes`` (optional regex, e.g. ``"R1|R3"``)
    - ``remoteNodes`` (optional regex for the remote end)

  Returns rows with:
    Node, VRF, Local_AS, Local_IP, Local_Interface,
    Remote_AS, Remote_Node, Remote_IP, Remote_Interface,
    Address_Families, Session_Type (IBGP / EBGP_SINGLEHOP / EBGP_MULTIHOP / ...),
    Established_Status (ESTABLISHED / NOT_ESTABLISHED / NOT_COMPATIBLE / ...)

  Use when: caller asks "is BGP up between X and Y" / "are sessions
  Established" / "what does my BGP table look like" (logical view).

  ---

  ## bgpSessionCompatibility  — "WHY isn't BGP coming up?"

  q_args: same as bgpSessionStatus.

  Returns the same columns plus a ``Configured_Status`` like
  ``MULTIHOP_INACTIVE`` / ``LOCAL_IP_UNKNOWN_STATICALLY`` /
  ``NO_REMOTE_AS`` / ``UNIQUE_MATCH`` etc.  Use this when
  ``bgpSessionStatus`` shows ``NOT_ESTABLISHED`` — this question
  explains the reason.

  ---

  ## ospfSessionCompatibility  — "OSPF adjacency form-ability"

  q_args:
    - ``nodes`` (regex)

  Returns per-interface-pair rows with: Node, Interface, Remote_Node,
  Remote_Interface, IP, Remote_IP, Session_Status (e.g.
  ``ESTABLISHED`` / ``AREA_MISMATCH`` / ``MTU_MISMATCH`` /
  ``NETWORK_TYPE_MISMATCH`` / ``HELLO_INTERVAL_MISMATCH`` /
  ``PASSIVE_INTERFACE``).

  Use when: caller asks "why is OSPF stuck in Init / 2-Way" / "OSPF
  adjacency hypothesis".

  ---

  ## routes  — "what's in the RIB for prefix P on device D?"

  q_args:
    - ``nodes`` (regex)
    - ``network`` (prefix, e.g. ``"10.50.0.0/24"``)
    - ``protocols`` (optional list, e.g. ``["bgp", "ospf", "static"]``)
    - ``vrf`` (optional)

  Returns rows: Node, VRF, Network, Next_Hop, Next_Hop_IP, Next_Hop_Interface,
  Protocol, Metric, Admin_Distance, Tag.

  Use when: caller asks "what route does X use to reach Y" / "is the
  route in the table".

  **⚠ LARGE-NETWORK WARNING — MANDATORY for campus/enterprise networks:**
  Querying routes without a specific ``nodes`` filter returns ALL routes
  across ALL devices.  A 339-device campus EIGRP network has ~3.7 million
  route rows.  Serialising them overflows any sub-100K-token LLM context.

  ``batfish_q`` automatically summarises results > 400 rows:
  - ``row_count``: TRUE total rows (use for baseline vs sim delta math)
  - ``summary.unique_networks``: count of unique /prefix entries
  - ``rows``: first 10 sample rows only (for context, not counting)
  - ``truncated``: ``true`` when summary mode is active

  **Rule**: ALWAYS pass a specific ``nodes`` regex — never use ``".*"``.
  For blast-radius simulation, scope to the PEER nodes of the deactivated
  device (the nodes whose route tables change when the target goes down),
  NOT the deactivated node itself.

  **Batfish NodeSpecifier syntax** for the ``nodes`` arg:
  - Literal: ``"foo-border-4500x"`` (exact hostname)
  - Regex:   ``"/foo-border-4500x|foo2-dist-4500xv/"`` (slashes required for alternation!)
  - Without slashes ``"a|b"`` is treated as a literal name containing ``|`` → returns 0 rows.

  ```yaml
  # ✅ correct — peer nodes of foo-dist-4500xv-d (regex with slashes)
  q_args: {nodes: "/foo-border-4500x|foo2-dist-4500xv/"}

  # ✅ correct — single node (no slashes needed)
  q_args: {nodes: "foo-border-4500x"}

  # ❌ wrong — fetches all 3.7M routes, crashes context
  q_args: {nodes: ".*"}
  q_args: {}   # no filter = all nodes

  # ❌ wrong — pipe without slashes = 0 rows
  q_args: {nodes: "foo-border-4500x|foo2-dist-4500xv"}
  ```

  For route-count delta (change simulation):
  ```
  baseline_count = batfish_q(snap_baseline, "routes", {"nodes": "peer-regex"}).row_count
  sim_count      = batfish_q(snap_simN,     "routes", {"nodes": "peer-regex"}).row_count
  delta          = baseline_count - sim_count
  unique_lost    = baseline.summary.unique_networks - sim.summary.unique_networks
  ```

  ---

  ## Blast-radius upgrade simulation — using pre-built Batfish snapshots

  For change-plan simulations where Batfish-native forked snapshots already
  exist (created by ``fork_snapshot`` outside OLAV), pass the Batfish
  snapshot name directly as ``snapshot_id``.

  **Prerequisite**: Set ``OLAV_BATFISH_NETWORK`` env var to the Batfish
  network name (e.g. ``vu-prod-inbox``) so ``batfish_q`` can look up
  existing snapshots without re-exporting configs.

  Standard workflow for each upgrade stage:
  ```
  Step 1 — check capability (once per baseline):
    batfish_capability(snapshot_id="2025-11-02-baseline")

  Step 2 — baseline route count on peer nodes:
    batfish_q("2025-11-02-baseline", "routes",
              {"nodes": "<peer_regex>"})
    → envelope.row_count = baseline_count

  Step 3 — simulated route count (node deactivated):
    batfish_q("2025-11-02-sim-stageN", "routes",
              {"nodes": "<peer_regex>"})
    → envelope.row_count = sim_count

  Step 4 — delta = baseline_count - sim_count
           prefixes_lost = baseline.summary.unique_networks - sim.summary.unique_networks
  ```

  For VU campus network (Batfish network ``vu-prod-inbox``), available
  pre-built snapshots and their peer node regexes:

  | Snapshot | Deactivated | Peer nodes regex (use ``/regex/`` syntax) |
  |---|---|---|
  | 2025-11-02-baseline | (none) | — |
  | 2025-11-02-sim-stage1 | suns-dist-4500xv, foo-server-4500x-1/2 | ``/suns-wan-4500x\|suns-border/`` |
  | 2025-11-02-sim-stage2 | sta-dist-4500xv-4, sta-dist-4500xv-5 | ``sta-wan-4500xv`` |
  | 2025-11-02-sim-stage3 | wer-dist-4500xv | ``/wer-wan-4500xv\|wer2-wan/`` |
  | 2025-11-02-sim-stage4 | foo-dist-4500xv-m | ``/foo-border-4500x\|foo-core-6807v/`` |
  | 2025-11-02-sim-stage5 | foo-dist-4500xv-d | ``/foo-border-4500x\|foo2-dist-4500xv/`` |
  | 2025-11-02-sim-stage6 | foo2-dist-4500xv | ``/foo2-wan-4500xv\|foo2-wan-3560/`` |

  ---

  ## reachability  — "can A talk to B (per configs)?"

  q_args:
    - ``pathConstraints``: dict with ``startLocation``,
      ``endLocation``, optional ``forbiddenLocations``
    - ``headers``: HeaderConstraints — keys: ``srcIps``, ``dstIps``,
      ``ipProtocols``, ``srcPorts``, ``dstPorts``
    - ``actions``: list (default: ``["SUCCESS"]``)

  Returns rows showing the accepted/denied flows + the routing path
  (sequence of hops).

  Use when: caller asks "can X reach Y" / "test reachability".

  **CRITICAL — header schema (Phase E fix 2026-05-14)**:
  every header field is **string-typed** by Batfish's
  ``PacketHeaderConstraints``, not array.  The specifier syntax
  accepts comma-separated values inside that one string.

  ```yaml
  # ✅ correct
  headers: {dstIps: "192.168.50.0/24"}
  headers: {dstIps: "10.0.0.0/24,10.1.0.0/24"}   # comma-separated specifier

  # ❌ wrong — produces Batfish 500
  headers: {dstIps: ["192.168.50.0/24"]}         # list (not array-typed field)
  ```

  ``batfish_q`` now auto-coerces ``list[str]`` -> comma-joined string
  via its ``PacketHeaderConstraintsArgs`` Pydantic model, so if you
  accidentally pass a list it will be normalised — but pass a string
  to keep your intent unambiguous.  Unknown header field names raise
  a clean Pydantic ValidationError in the envelope ``message``.

  ---

  ## traceroute  — "trace a flow's path"

  q_args:
    - ``startLocation`` (e.g. ``"@enter(R1[ge-0/0/2])"``)
    - ``headers`` (HeaderConstraints)

  Returns per-hop trace.  More targeted than ``reachability``;
  use when caller knows the source and wants the actual path.

  ---

  ## differentialReachability  — "what reachability changed between
  ##                              two snapshots?"

  **CRITICAL**: use the tool's ``reference_snapshot`` parameter (not
  ``q_args``) to specify the baseline.

  q_args: same shape as ``reachability`` (optional pathConstraints,
  headers).

  Returns rows that differ: prefixes added/removed/path-changed
  between baseline and candidate snapshots.

  Use when: caller asks "if I apply change C, will reachability
  break".  Caller must pre-build candidate snapshot or have one
  available.

  ---

  ## testRoutePolicy  — "simulate route-map / policy"

  q_args:
    - ``nodes`` (regex)
    - ``policies`` (list of route-map / policy names)
    - ``inputRoutes`` (list of input route dicts)
    - ``direction`` (``"IN"`` or ``"OUT"``)

  Returns: per-route per-policy verdict (permit/deny), which clauses
  matched, modifications applied.

  Use when: caller asks "would route-map RM-IN permit prefix P".

  ---

  ## searchFilters  — "find packets that match an ACL action"

  q_args:
    - ``filters`` (list of filter / ACL names)
    - ``headers`` (HeaderConstraints, e.g. ``{"srcIps": "10.1.0.0/16",
      "dstPorts": "22"}``)
    - ``action`` (``"PERMIT"`` or ``"DENY"``, default DENY)

  Use when: caller asks "does ACL X block SSH from subnet Y" / "find
  flows my ACL drops".

  ---

  ## definedStructures  — "what named structures exist?"

  q_args: none (or optional ``nodes`` regex).

  Returns: structure name, type (route-map, ACL, prefix-list, etc.),
  and definition location.  Useful when caller needs to discover the
  names to plug into testRoutePolicy or searchFilters.

  ---

  ## Hard rules when calling

  - Always pass ``snapshot_id`` (no default).
  - ``q_args`` is OPTIONAL (the question runs with no filter if omitted).
  - For differential questions, use the tool's ``reference_snapshot``
    parameter, NOT a ``q_args`` field.
  - If you don't know the right question, query ``definedStructures``
    first (cheap) to see what's in the snapshot, then pick a more
    specific question.
  - If a question returns empty rows, that may be legitimate
    (e.g. no BGP sessions configured).  Don't retry — surface
    "no rows returned for <question> on <snapshot>" to the caller.
