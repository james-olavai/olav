body: |
  ## R-CAB-THREE-STAGE routing (2026-05-12, dev_docs/75)

  The change pipeline is three sub-agents now, each with a typed
  envelope. The orchestrator's job is mechanical: read
  ``next_step.action`` from the last result and dispatch.

  ```
  USER → analyzer (LLM) ──submit_draft──▶ sim (Python) ──finalize──▶ lab
                          ◀──receive_rejection──     ◀──routing_hint──
  ```

  ## Compound prompts — the verb-chain

  Compound prompts where the user says "X then Y" or "first A and then B"
  must invoke EVERY verb's sub-agent in turn. Do NOT stop after the
  first sub-agent.

  | User pattern | Required sequence |
  |---|---|
  | "diagnose X then plan a fix" / "investigate and emit CAB" | task("analyze") → task("analyzer") |
  | "plan a change between R2 and R3" (no validate) | task("analyzer") → task("sim", draft_path) |
  | "plan AND validate" / "plan and test" / "CAB this" | task("analyzer") → task("sim", draft_path) → task("lab", spec_path) |
  | "diagnose THEN plan AND validate" (3-step) | task("analyze") → task("analyzer") → task("sim") → task("lab") |
  | "find logs for X then design rollback" | task("investigate") → task("analyzer") |
  | "check state then refresh" | task("analyze") → task("collect") |

  ## next_step routing — the contract

  Every sub-agent returns a result with a ``next_step`` field. The
  orchestrator reads ``next_step.action`` and dispatches mechanically:

  ### From analyzer.submit_draft
      result["next_step"] = {
        "action": "sim_finalize",
        "sub_agent": "sim",
        "args": {"draft_path": "exports/cab/<id>/draft.yaml"}}
      → task("sim", "finalize the draft", draft_path=<path>)

  ### From sim.finalize_tcf (on success)
      result["next_step"] = {
        "action": "lab_validate",
        "sub_agent": "lab",
        "args": {"spec_path": "exports/cab/<id>/spec.tcf.yaml"}}
      → task("lab", "validate the spec", spec_path=<path>)
        IF the user asked for validation (validate/verify/test/CAB/验证).
        Otherwise present spec_path for HITL approval.

  ### From sim.finalize_tcf (on rejection — analyzer must revise)
      result["next_step"] = {
        "action": "analyzer_revise",
        "sub_agent": "analyzer",
        "args": {"change_id": "<id>", "rejection_path": "<path>"}}
      → task("analyzer", "revise change <id>: read rejection at <path>")
        The analyzer's first call will be receive_rejection to pull
        Sim's structured blockers + suggested_alternatives.

  ### From sim.finalize_tcf (hard-blocked after max retries)
      result["next_step"] = {
        "action": "user_review",
        "sub_agent": "user"}
      → Do NOT re-dispatch. Surface the blockers to the user. Three
        revision rounds were exhausted; the architecture forbids
        endless retry loops.

  ### From lab.validate (when lab rejected)
      result["next_step"] = {"action": "...", "routing_hint": "<hint>"}
        routing_hint values dispatch as:
          * "sim_can_revise"        → task("sim", "patch", ...)
          * "analyzer_intent_wrong" → task("analyzer", "revise", ...)
          * "infra_problem"         → surface to user
          * "user_review"           → surface to user

  ## Anti-patterns (boundary-test learned failures)

  1. **Stopping after the first task()**. When the prompt has a
     "then" / "and", you already have user authorization for the
     second step. Do NOT ask "would you like me to validate?".

  2. **Ignoring next_step**. The envelope tells you the next action
     mechanically. If next_step.action == "lab_validate" and the
     user asked for validation, dispatch IMMEDIATELY — don't paraphrase
     the result and stop.

  3. **Blind re-submit on rejection**. When sim rejects, the analyzer
     must call ``receive_rejection`` FIRST to pull blockers + suggested
     alternatives — a blind re-submit ignores Sim's hint and burns a
     retry round.

  4. **Treating partial findings as terminal**. The analyzer can
     submit_draft with PARTIAL facts — that's why Sim has structured
     blockers. Hand whatever you have to Sim; let it tell you what's
     missing. Don't paralyse on "I cannot fully diagnose".

