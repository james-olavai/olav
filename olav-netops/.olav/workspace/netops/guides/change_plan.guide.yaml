body: |
  Change plan requests ("plan a change", "add eBGP between R1 and R3",
  "变更方案") use the `sim` sub-agent + `submit_change_plan` tool.
  R-AGENT-HIERARCHY Phase D (2026-05-09): structured-output via
  LangChain tool-call channel — schema enforced at LLM decode time,
  no Markdown gentleman's agreement.

  ## Stage 1 — orchestrator delegates to `sim`

  Orchestrator's FIRST call:

      task("sim", "<user's request paraphrased>")

  Do NOT do execute_sql / glob / ls at the orchestrator level.  Do
  NOT delegate to `ops-analyze` for change plans (analyze is
  read-side: drift / topology Q&A / Mermaid only).

  ## Stage 2 — sim's 3-step workflow ending in submit_change_plan

  Inside the sim sub-agent:

  a. ONE feasibility-check sandbox call (run_python_simulation)
     to verify ASNs / topology / IGP — whatever the intent needs.

  b. Decide feasibility based on the data.

  c. Call `submit_change_plan(...)` with structured fields:

         submit_change_plan(
             intent="ebgp_direct",          # enum-constrained
             devices=["R2", "R3"],          # typed list
             summary="Add eBGP between R2 and R3",
             rationale=(
                 "<multi-paragraph free-form Markdown WHY>"
             ),
             steps=(
                 "Phase 1: ...\n"
                 "Phase 2: ...\n"
             ),
             feasibility="OK",              # or "BLOCKED" + reason
         )

     The tool internally:
       1. Composes the Markdown change plan from your fields
       2. Saves it to `exports/change_plans/<change_id>.md`
       3. Queries DB for ASN / loopback / platform per device
       4. Renders deterministic CLI from intent + platform templates
       5. Writes TCF YAML to `exports/cab/<change_id>/spec.tcf.yaml`

  ## Why this shape

  Phase D moves from "Markdown YAML block parser" (Phase B+C) to
  "tool-call structured output" — the LLM's grammar-constrained
  decode channel.  Same Pydantic schema the LangChain tool decorator
  generates is what the LLM sees as a JSON schema and is constrained
  to fill.

  The free-form `rationale` + `steps` fields prevent the
  investigation-loop failure mode (earlier "thin emit_tcf" experiment
  hung 18min because no analytical container existed in the args).

  See dev_docs/73 § Phase D.

  ## What sim DOES NOT pass

  - Device platforms / loopbacks / ASNs — DB-derived
  - implementation_json / rollback_json / post_check_json — template-generated
  - Any CLI fragments — the writer renders complete Junos / IOS configs

  ## Result envelope (what sim reports back to orchestrator)

  On success:
    `{"status": "ok",
      "plan_md_path": "exports/change_plans/<id>.md",
      "spec_path":    "exports/cab/<id>/spec.tcf.yaml",
      "facts":        {<device>: {...}},
      "warnings":     [...]}`

  Sim reports plan_md_path (HITL artifact) + spec_path (lab input)
  + facts.  The orchestrator passes spec_path to lab for validation.

  On error: `{"status": "error", "error": "...", "blockers": [...]}`.
  Surface the blockers to the user.  Do NOT retry with fabricated args.

related:
  - intent: simulation_what_if
    note: "blast-radius / what-if questions before the plan: also lives in sim"
  - intent: lab_validation
    note: "after submit_change_plan returns spec_path: task('ops-lab', '<spec_path>')"
