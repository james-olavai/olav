schema_version: 1
intent: change_plan_emit_tcf
agent: ops
keywords:
  - change plan
  - emit TCF
  - TCF spec
  - CAB
  - CAB spec
  - add eBGP
  - add iBGP
  - add OSPF
  - add VLAN
  - add ACL
  - 变更方案
  - 变更计划
  - 添加 BGP
  - 添加邻居
  - sim agent
  - render_tcf
  - r1-r3-ebgp
body: |
  Change plan requests ("plan a change", "add eBGP between R1 and R3",
  "变更方案") use a TWO-STAGE workflow that decouples LLM (semantic
  reasoning) from format (deterministic Python):

  ## Stage 1 — orchestrator delegates to `sim` (NOT analyze)

  As of R-AGENT-HIERARCHY Phase B+C (2026-05-09), change planning
  lives in the `sim` sub-agent.  Orchestrator's FIRST call:

      task("sim", "<user's request paraphrased>")

  Do NOT do execute_sql / glob / ls at the orchestrator level.  Do
  NOT delegate to `ops-analyze` for change plans (analyze is
  read-side: drift / topology Q&A / Mermaid only).

  ## Stage 2 — sim writes prose plan + invokes render_tcf

  Inside the sim sub-agent:

  a. ONE feasibility-check sandbox call (run_python_simulation)
     to verify ASNs, IGP between peers, etc.

  b. Write a Markdown change plan ending with:

         ## Change Summary
         ```yaml
         change_id: r2-r3-ebgp
         title: Add eBGP between R2 and R3
         intent_type: ebgp_direct
         devices: [R2, R3]
         feasibility: OK
         ```

     If feasibility check found a blocker:
         feasibility: BLOCKED
         feasibility_reason: "<one-line>"

  c. Call render_tcf skill-script with the FULL plan text:

         execute_skill_script("render_tcf.py", script_args={
             "plan_text": "<the entire markdown plan>",
         })

     The script extracts the Summary block, queries the DB for
     ASN / loopback / platform per device, renders deterministic
     CLI from intent + platform templates, and writes the TCF YAML.

  ## Why this shape (background)

  Three CAB experiments on gemma4:31b nothink (2026-05-09) showed
  every "give the LLM more help with TCF args" attempt made things
  worse — thin tool, plan template, more guides all caused the
  agent to investigate forever or hallucinate facts to satisfy the
  schema.  Diagnosis: TCF is the wrong shape for an LLM to author.

  Fix: LLM outputs prose; deterministic Python composes TCF.
  See dev_docs/73 § Phase C.

  ## What sim DOES NOT do

  - Compose `implementation_json` / `rollback_json` / `post_check_json`
  - Pass ASN / loopback / CLI to render_tcf — facts come from DB
  - Call `emit_tcf` directly (deprecated for sim path)
  - Retry render_tcf with "fixed" args after a BLOCKED response

  ## Result envelope (what sim reports back to orchestrator)

  On success: `{"status": "ok", "spec_path": "exports/cab/<id>/spec.tcf.yaml",
                "facts": {<device>: {...}}, "warnings": [...]}`.
  Sim reports the spec_path + facts dict + any warnings.  Orchestrator
  passes the spec_path to lab via `task("ops-lab", spec_path)`.

  On error: `{"status": "error", "error": "...", "blockers": [...]}`.
  Surface the blockers to the user; do NOT retry with fabricated args.

related:
  - intent: simulation_what_if
    note: "blast-radius / what-if questions before the plan: also lives in sim"
  - intent: lab_validation
    note: "after render_tcf produces spec.tcf.yaml: task('ops-lab', '<spec_path>')"
