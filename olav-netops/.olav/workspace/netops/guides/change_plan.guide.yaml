body: |
  ## R-CAB-THREE-STAGE (2026-05-12, dev_docs/75)

  Change-plan requests flow through THREE sub-agents now, not one:

      USER → analyzer (LLM, drafts) → sim (Python, finalizes) → lab

  Each stage has a typed envelope persisted to disk under
  ``exports/cab/<change_id>/``:
    * ``draft.yaml``        — analyzer's proposal (DraftChangePlan)
    * ``spec.tcf.yaml``     — sim's rendered TCF (on OK)
    * ``rejection_sim.yaml``— sim's structured rejection (on BLOCKED)

  The orchestrator dispatches mechanically on the ``next_step.action``
  every stage returns. See ``compound_chain_workflow`` guide for the
  full routing table.

  ## Stage 1 — orchestrator delegates to `analyzer`

  Orchestrator's FIRST call for any change request:

      task("analyzer", "<user's request paraphrased>")

  Do NOT use ``ops-analyze`` for change plans — analyze is read-side
  (drift / topology Q&A / Mermaid). The change-planning analyzer is
  ``analyzer`` (renamed from sim on 2026-05-12 per dev_docs/75 Day-2).

  ## Stage 2 — analyzer's workflow ending in submit_draft

  Inside the analyzer sub-agent:

  a. Call inspect_* tools (devices / topology / routing / interfaces /
     blast_radius) to gather facts. Minimum: inspect_devices on every
     device in scope.

  b. Pick an intent from SupportedIntent:
       ebgp_direct / ibgp_direct / static_route_add / vlan_add /
       freeform_cli.

  c. Call `submit_draft(...)` with the inspector results as
     `facts_collected`:

         submit_draft(
             user_prompt="<verbatim user ask>",
             devices_in_scope=["R2", "R3"],
             proposed_intent="ebgp_direct",
             intent_args={},
             rationale="<WHY based on inspector outputs>",
             facts_collected=<the FactsEnvelope dict you observed>,
         )

     The tool:
       1. Validates against the DraftChangePlan Pydantic schema —
          empty facts_collected or unknown intent are refused.
       2. Writes the draft to ``exports/cab/<change_id>/draft.yaml``.
       3. Returns ``{"status": "ok", "change_id": ..., "draft_path": ...,
                      "next_step": {"action": "sim_finalize",
                                     "sub_agent": "sim",
                                     "args": {"draft_path": ...}}}``

  ## Stage 3 — sim renders the TCF

  Orchestrator follows the ``next_step``:

      task("sim", "finalize the draft", draft_path=<path>)

  Sim's single tool ``finalize_tcf(draft_path)`` is a Python
  skill-script (no LLM in the loop):

       1. Load + Pydantic-validate the draft.
       2. Per-intent feasibility check (same_asn / not_directly_connected
          / missing_facts / invalid_cidr / ...). On BLOCKED: writes
          ``rejection_sim.yaml`` with structured Blocker codes and
          suggested_alternatives.
       3. networkx simulation pass — isolation / loop invariants.
       4. Render TCF deterministically (DB-grounded facts, template CLI).
       5. Returns one of:
            {"status": "ok",       "spec_path": ..., "next_step":
                                    {"action": "lab_validate", ...}}
            {"status": "rejected", "rejection_path": ..., "next_step":
                                    {"action": "analyzer_revise", ...}}
            {"status": "hard_blocked", "next_step":
                                    {"action": "user_review", ...}}

  ## Why this shape

  Splitting the old single-stage submit_change_plan into Analyzer +
  Sim gives the LLM ONE job (gather facts, propose intent) and the
  Python side ONE job (judge feasibility, render). Every guardrail
  that used to bolt on as a F.X patch (facts_cited hard-error, F.2
  prod CLI completeness lint, ARCH-40 require_two_devices) now lives
  in its natural home — the DraftChangePlan Pydantic schema or the
  per-intent feasibility rule under ``olav.core.cab.sim.feasibility``.

  See dev_docs/75 for the full design + hardcoding-removal inventory.

  ## What analyzer DOES NOT do

  - Author CLI commands directly (sim's render layer composes them
    from intent + DB facts + per-platform templates)
  - Declare a change "feasible" in any final sense (sim does the
    deterministic check)
  - Allocate lab subnets (sim's render layer, idempotent on change_id)

  ## On rejection — call receive_rejection FIRST

  When the orchestrator routes you back via
  ``next_step.action=="analyzer_revise"``:

      receive_rejection(change_id="<id>")
      # → returns blockers + suggested_alternatives +
      #   next_revision_round

  Then call submit_draft with revision_round=<bumped> and
  previous_blockers=[blocker codes from the rejection]. A blind
  re-submit ignores Sim's hint and burns a retry. After 3 rejections,
  Sim sets hard_blocked=True and the orchestrator surfaces to user.

