body: |
  When the user wants to MODIFY an EXISTING change spec (rather than
  author a new one), the orchestrator MUST delegate to the `sim`
  sub-agent and instruct it to use ``tcf_patch_block`` instead of
  ``submit_change_plan``.

  ## When this guide applies

  Trigger phrases:
  - "fix the existing change <id>"
  - "the change <id> has a wrong <field>, change it to <value>"
  - "revise change <id>"
  - "patch <id> with ..."
  - "modify the existing spec ..."
  - 修改/修复/更新 <id>

  Distinguishing from new-plan ("add eBGP between R3 and R4"):
  - "add", "create", "plan a new" → new plan → ``submit_change_plan``
  - "fix", "revise", "modify", "the existing", "change <id>'s X to Y" →
    revise → ``tcf_patch_block``

  ## What the orchestrator does

  ONE call:

      task("sim", "Revise existing change <change_id>: apply
                   <op> to <block> for <device> — <details>.
                   Use tcf_patch_block (not submit_change_plan).")

  Do NOT:
  - Try to read the existing spec yourself with ``glob`` /
    ``read_file`` (those tools are deliberately not in the
    orchestrator's toolset — see ARCH-30 / INVIVO-ORCH-FILESYSTEM-LEAK).
  - Call ``submit_change_plan`` (would emit a NEW spec, losing the
    existing one's revision history + journal).

  ## What sim does

  Sim's flow when given a revise request:
  1. Read the existing ``exports/cab/<change_id>/spec.tcf.yaml``
     via ``tcf_patch_block``'s built-in resolver.
  2. Build the patch payload:
     - ``replace_device``: replace ALL entries for one device in a
       block (most common; e.g. wrong CLI / interface)
     - ``append``: add new rows (e.g. extra post_check)
     - ``remove_device``: drop a device's entries entirely
  3. Call ``tcf_patch_block(change_id, block, operation, device,
     payload, rationale)``.
  4. The tool atomically writes the spec, increments revision counter,
     appends a journal entry. Returns ``{status, revision, rows_before,
     rows_after}``.

  ## Block field mapping

  | User says | block parameter |
  |---|---|
  | "wrong CLI / interface / IP / config" | ``implementation`` |
  | "wrong rollback" | ``rollback`` |
  | "wrong post_check" / "verification" | ``post_check`` |
  | "wrong pre_check" / "precondition" | ``pre_check`` |
  | "wrong test / TVT" | ``tvt`` |

  ``devices`` (top-level), ``intent``, ``change_id`` are immutable
  post-emission. Cannot be patched — would require re-emit via
  ``submit_change_plan`` with a new ``change_id``.

  ## Example dispatch

  User: "the existing change r3-r4-ebgp has a wrong interface,
        change R3 to use Ethernet0/3"

  Orchestrator:
      task("sim", "Revise existing change r3-r4-ebgp: in the
                   implementation block for R3, replace the
                   interface from current value to Ethernet0/3.
                   Use tcf_patch_block(change_id='r3-r4-ebgp',
                   block='implementation', operation='replace_device',
                   device='R3', payload=[updated_cli_block],
                   rationale='user-requested interface change to
                   Ethernet0/3').")

  Sim then constructs the new CLI block (using inspect_devices for
  R3's facts + the new interface name) and calls tcf_patch_block.
