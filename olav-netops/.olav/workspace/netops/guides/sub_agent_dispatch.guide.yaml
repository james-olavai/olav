body: |
  Delegation tool — preferred: ``task("<sub-agent-name>", "<request>")``.

  ``olav_delegate(subagent_name=..., task_description=...)`` is a real
  alternate path with the same semantics — use either. The runtime
  resolver accepts both registered names AND short aliases (e.g.
  ``analyze`` resolves to ``ops-analyze``), so a few naming variants
  Just Work.

  ## Valid sub-agent names (free distribution)

  - ``analyzer`` — **DEFAULT**.  SQL state + Markdown report writer
    (5 tools: execute_sql / describe_table / query_evidence /
    inspect_drift_configs / format_and_export).  Owns Workflow A
    (change plan → exports/change_plans/) and Workflow D (investigation
    report → exports/reports/).  Delegates cross-domain to sim via
    native ``task()`` for config-layer evaluation (dev_docs/77 §2.6).
  - ``sim`` — Batfish-backed config-layer evaluator (3 tools:
    batfish_capability / batfish_q / format_and_export).  Answers
    BGP/OSPF compatibility, reachability, route lookup, route-map
    policy test, ACL search, differential reachability.  No SQL,
    no logs, no live device access.  Replaced the deleted
    R-CAB-THREE-STAGE Python pipeline on 2026-05-14 (dev_docs/77 §2).
  - ``analyze`` / ``ops-analyze`` — inspector-based read-side
    analysis (8 @tools wrapping NetworkX queries: devices /
    topology / routing / blast_radius / drift_*).  Owns the
    Mermaid / blast-radius / visualization paths analyzer doesn't
    cover.  Coexists with ``analyzer``.
  - ``investigate`` — log/syslog/config-text drilldown
    (query_evidence).
  - ``collect`` / ``ops-collect`` — data-plane probes,
    ``take_snapshot``.
  - ``topology`` — discovery (BGP/OSPF/CDP/LLDP recipes → typed
    TopologySnapshot).
  - ``learner`` — parser learning (/learn_cmd flow).

  ## Enterprise-only sub-agents (require ``olav-ent`` install)

  - ``lab`` — ContainerLab digital twin validator (currently
    deferred, dev_docs/78).  In the free distribution this name
    will return "sub-agent not found".

  ## True hallucinations — these will fail

  Names that have NEVER existed in this codebase:

  - ❌ ``delegate_to(...)``
  - ❌ ``sub_agent(...)``
  - ❌ ``task("config-discovery", ...)``
  - ❌ ``task("quick-query", ...)``

  Stale names that NO LONGER exist (deleted in the 2026-05-14
  R-CAB-THREE-STAGE removal — calling them will fail):

  - ❌ ``submit_draft`` / ``receive_rejection`` — were analyzer's
    OLD tools when it owned DraftChangePlan; analyzer now writes
    Markdown directly.
  - ❌ ``finalize_tcf`` / ``rejection_sim`` — were sim's OLD
    skill-script; sim is now a Batfish LLM sub-agent.

  ## What to do when task() returns "sub-agent not found"

  The second arg was wrong.  Pick from the valid list above; do NOT
  retry with another made-up name.  If task() complains about the
  name, try ``olav_delegate`` as the alternate path — same semantics,
  different resolver.  If both fail, the capability genuinely
  doesn't exist (e.g. ``lab`` in the free distribution); say so to
  the user.

  ## Capability-level routing

  Don't reason about which TOOL to call — that's the sub-agent's
  job.  Match user intent to capability:

  | User intent | First call |
  |---|---|
  | DEFAULT — change plan / investigation / report / "why" / 调研 / 变更方案 | task("analyzer", req) |
  | Pure config-layer ("does ACL drop X", "is BGP config compatible", "what route for prefix P") | task("sim", req) ← direct, skip analyzer hop |
  | Topology diagram / Mermaid / blast-radius visualisation | task("analyze", req) |
  | Why / log / syslog / 故障日志 | task("investigate", req) — or via analyzer |
  | Ping / traceroute / live data-plane | task("collect", req) |
  | Topology data discovery (LLDP/CDP) | task("topology", req) |
  | Parser learning (/learn_cmd) | task("learner", req) |

