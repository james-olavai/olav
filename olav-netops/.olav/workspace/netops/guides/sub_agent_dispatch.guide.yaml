body: |
  Delegation tool — preferred: ``task("<sub-agent-name>", "<request>")``.

  ``olav_delegate(subagent_name=..., task_description=...)`` is a real
  alternate path with the same semantics — use either. The runtime
  resolver accepts both registered names AND short aliases (e.g.
  ``analyze`` resolves to ``ops-analyze``), so a few naming variants
  Just Work.

  ## Valid sub-agent names

  Both short and ``ops-`` prefixed names accepted (R-AGENT-HIERARCHY
  Phase A in flux — both styles registered for now):

  - ``analyze`` / ``ops-analyze`` — read-side state / topology / drift
  - ``analyzer`` — change-plan ANALYST (LLM): facts → DraftChangePlan via
    ``submit_draft``; revision via ``receive_rejection`` (R-CAB-THREE-STAGE
    Day 2, 2026-05-12, dev_docs/75; renamed from ``sim``)
  - ``sim`` — change-plan FINALIZER (Python skill-script): one tool
    ``finalize_tcf(draft_path)``; renders TCF or writes rejection_sim.yaml
    deterministically; no LLM in the loop (R-CAB-THREE-STAGE Day 4)
  - ``investigate`` — log/syslog/config-text drilldown
  - ``collect`` / ``ops-collect`` — data-plane probes, ``take_snapshot``
  - ``lab`` / ``ops-lab`` — ContainerLab digital twin validation
  - ``topology`` — discovery (BGP/OSPF/CDP/LLDP recipes)
  - ``learner`` — parser learning (/learn_cmd flow)

  ## True hallucinations — these will fail

  Names that have NEVER existed in this codebase:

  - ❌ ``delegate_to(...)``
  - ❌ ``sub_agent(...)``
  - ❌ ``task("config-discovery", ...)``
  - ❌ ``task("quick-query", ...)``

  ## What to do when task() returns "sub-agent not found"

  The second arg was wrong.  Pick from the valid list above; do NOT
  retry with another made-up name.  If task() complains about the
  name, try ``olav_delegate`` as the alternate path — same semantics,
  different resolver.  If both fail, the capability genuinely
  doesn't exist; say so to the user.

  ## Capability-level routing

  Don't reason about which TOOL to call — that's the sub-agent's
  job.  Match user intent to capability:

  | User intent | First call |
  |---|---|
  | Change plan / "add eBGP X-Y" / 变更方案 | task("sim", req) |
  | What-if / blast-radius prediction | task("sim", req) |
  | BGP / routing read-side state Q&A | task("analyze", req) |
  | Snapshot diff / drift report | task("analyze", req) |
  | Topology diagram / Mermaid | task("analyze", req) |
  | Why / log / syslog / 故障定位 / 日志 | task("investigate", req) |
  | "What does config say" / "show output of X" | task("investigate", req) |
  | Lab validation / CAB / "test in lab" | task("lab", <plan from sim>) |
  | Ping / traceroute / live data-plane | task("collect", req) |
  | Topology data discovery (LLDP/CDP) | task("topology", req) |
  | Parser learning (/learn_cmd) | task("learner", req) |

