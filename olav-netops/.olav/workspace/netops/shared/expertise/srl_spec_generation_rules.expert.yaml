body: |
  # CAB Implementation Spec rules — when target lab is SR Linux

  ## Why this matters

  When ops-analyze produces a CAB Implementation Spec destined for a
  digital-twin lab using SR Linux containers, the spec must include
  SRL-specific fields the LLM might omit (because its training data
  is Cisco-shaped and those fields are implicit in Cisco config).
  Missing them → lab-deploy succeeds but BGP refuses to establish
  or refuses to exchange routes → CAB FAIL with no actionable
  config error.

  This is the **upstream complement** to ``bgp_validation_srl``
  in ops-lab/expertise/.  ops-analyze writes the spec; ops-lab
  validates it.  Both must understand SRL.

  ## Required SRL fields in eBGP spec ``config_lines``

  When the ``Config Lines — node X (SRL CLI)`` section lists ``set /``
  commands for SRL containers, the spec MUST include all of these:

  ### Interface block
  ```
  set / interface ethernet-1/N admin-state enable
  set / interface ethernet-1/N subinterface 0 admin-state enable
  set / interface ethernet-1/N subinterface 0 ipv4 admin-state enable
  set / interface ethernet-1/N subinterface 0 ipv4 address A.B.C.D/M
  ```
  All four lines are required.  Cisco's ``interface … ip address …``
  is a single line; SRL needs the L2 / sub / IPv4-family triad
  enabled separately.

  ### Loopback (system0) block
  ```
  set / interface system0 admin-state enable
  set / interface system0 subinterface 0 admin-state enable
  set / interface system0 subinterface 0 ipv4 admin-state enable
  set / interface system0 subinterface 0 ipv4 address X.X.X.X/32
  ```
  Same triad.  ``system0`` is the SRL loopback equivalent.

  ### Network-instance binding
  ```
  set / network-instance default interface ethernet-1/N.0
  set / network-instance default interface system0.0
  ```
  Subinterfaces must be EXPLICITLY bound to the routing instance
  (Cisco's "default VRF" is implicit; SRL requires this).

  ### Routing policy (REQUIRED for eBGP route exchange)
  ```
  set / routing-policy prefix-set loopbacks prefix X.X.X.X/32 mask-length-range exact
  set / routing-policy policy export-bgp statement 10 match prefix-set loopbacks
  set / routing-policy policy export-bgp statement 10 action policy-result accept
  set / routing-policy policy export-bgp default-action policy-result reject
  ```
  Without this, BGP reaches Established but exchanges 0 routes
  (SRL default policy rejects all eBGP routes).

  ### BGP block
  ```
  set / network-instance default protocols bgp admin-state enable
  set / network-instance default protocols bgp autonomous-system <AS>
  set / network-instance default protocols bgp router-id X.X.X.X
  set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
  set / network-instance default protocols bgp ebgp-default-policy import-reject-all false
  set / network-instance default protocols bgp group <grp-name> peer-as <PEER_AS>
  set / network-instance default protocols bgp group <grp-name> export-policy [export-bgp]
  set / network-instance default protocols bgp neighbor <peer_ip> peer-group <grp-name>
  ```

  Critical lines often missed:
  * ``ebgp-default-policy import-reject-all false`` — default is
    TRUE, which silently drops all eBGP routes.
  * ``afi-safi ipv4-unicast admin-state enable`` — without this,
    BGP session forms but no IPv4 routes exchange.
  * ``peer-group`` is mandatory in SRL CLI.  Cisco-style direct
    neighbor declaration without group will not parse.

  ## Cross-platform translation table (prod → SRL lab)

  When prod is Cisco IOS / Junos and the lab is SRL containers:

  | Prod (Cisco IOS) | SRL equivalent |
  |---|---|
  | ``interface GigabitEthernet0/0`` | ``interface ethernet-1/1`` (subinterface 0) |
  | ``ip address A.B.C.D mask`` | ``subinterface 0 ipv4 address A.B.C.D/M`` |
  | ``router bgp <AS>`` | ``network-instance default protocols bgp autonomous-system <AS>`` |
  | ``neighbor X.X.X.X remote-as <PEER_AS>`` | ``protocols bgp group G peer-as <PEER_AS>`` + ``neighbor X.X.X.X peer-group G`` |
  | ``no synchronization`` (default) | n/a, no sync concept |
  | implicit accept of all received | **must** ``ebgp-default-policy import-reject-all false`` |

  | Prod (Junos) | SRL equivalent |
  |---|---|
  | ``set protocols bgp group G type external`` | implicit (group has peer-as different from local-as) |
  | ``set protocols bgp group G neighbor X peer-as <PEER_AS>`` | same — group with peer-as + neighbor peer-group |
  | ``set protocols bgp group G family inet unicast`` | ``afi-safi ipv4-unicast admin-state enable`` |
  | ``set policy-options policy-statement export-bgp ...`` | ``routing-policy policy export-bgp ...`` (different syntax, same idea) |

  ## CAB Spec self-check before format_and_export

  Before saving the spec, walk through:

  1. Is `ebgp-default-policy import-reject-all false` in the BGP
     block?  If no → add it (or accept that routes won't exchange).
  2. Is there an explicit `export-policy` and a matching
     `routing-policy policy <name>`?  If no → add the
     loopback-export policy template above.
  3. Is each subinterface explicitly bound to `network-instance
     default interface <intf>.0`?  If no → add.
  4. Does the spec specify lab subnet (172.16.X.0/30 typically) and
     point to existing prod interfaces by name in the SRL Lab
     Substitution table?

  Specs missing any of (1)/(2)/(3) will pass deploy but fail
  validation in ops-lab.  Better to FAIL the spec generation
  step than write a known-broken spec.

  ## Known-failing spec patterns (ops-lab will report FAIL)

  * BGP block lacks `ebgp-default-policy ...` → BGP Established
    + 0 routes received → ops-lab FAIL.
  * `interface ... ip address A.B.C.D mask` directly (no subinterface)
    → SRL parser rejects → dry_run_failures → ops-lab FAIL fast.
  * `neighbor X remote-as Y` without prior `group G peer-as Y` →
    parse error → dry_run_failures.
  * Spec assumes IGP route to peer loopback without specifying
    multihop → BGP state stuck at ``connect`` → FAIL.
