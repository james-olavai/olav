body: |
  ## Enterprise Branch L1-L4 playbook

  Multi-site enterprise networks with central HQ + many branches.
  Each branch typically: one router + 1-2 access switches.

  ## L1 — WAN link

  ### WAN circuit availability
  - `show interfaces dialer*` / `show interfaces tunnel*`
    flap counts and uptime
  - ISP-supplied circuit going up/down on >10 min cadence = SLA breach

  ### LAN-side error counters
  Same as campus playbook — CRC / input errors on access ports.

  ## L2 — link layer

  ### Trunk / VLAN configuration drift between branches
  - Branch A has VLAN 10 = "guest", branch B has VLAN 10 = "voice"
    = mis-policy when site-to-site VPN tunnels carry traffic

  ### STP root bridge inconsistency
  Each branch should locally root its STP (no inter-branch STP).
  Drift = unexpected blocking ports / suboptimal forwarding.

  ## L3 — routing

  ### Default route source
  - DHCP-learned default = ISP-handed (preferred)
  - Static default to unreachable next-hop = silent black hole

  ### Site-to-site VPN tunnel health
  ```sql
  SELECT device_name, parsed_data
  FROM netops.parsed_outputs
  WHERE command IN ('show crypto isakmp sa', 'show crypto ipsec sa')
    AND parsed_data IS NOT NULL;
  ```
  IKE Phase 1 (isakmp) and Phase 2 (ipsec) both must be ACTIVE for
  the tunnel to forward traffic.  Phase 1 up + Phase 2 down = silent
  outage.

  ### Hub failover misconfiguration
  - Branch with single VPN tunnel to one HQ = single point of failure
  - Multi-tunnel branches should have HSRP/preempt config consistent.

  ## L4 — services

  ### DHCP scope exhaustion at branch
  - `show ip dhcp binding` returns near pool size = client refusal.

  ### NAT translation table near limit
  - High-fanout branch routers can exhaust NAT entries.

  ### Quality-of-service policy attached but no classes hit
  - Indicates DPI classifier misconfiguration or app-route drift.

  ## When recording
  - Branch findings should include the `site` value from
    `netops.devices` so ops can dispatch.
  - VPN tunnel + LAN issues at same branch = related findings.
  - Multi-branch findings (same issue at many sites) = elevate
    severity by one level vs single-branch.
