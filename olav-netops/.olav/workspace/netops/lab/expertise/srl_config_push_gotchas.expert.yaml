body: |
  # SRL config push — operational gotchas (NOT Cisco)

  When ops-lab pushes config to SRL containers via
  ``deploy_and_push_lab`` or ``push_node_config``, the underlying
  CLAB API uses ``sr_cli`` with base64-encoded blocks.  Knowing
  these semantics prevents silent partial applies and confusing
  ``dry_run_failures`` errors.

  ## SRL config model — candidate vs running

  SRL has TWO config stores:
  * **running** — what the box is actually running.
  * **candidate** — staging area; multiple edits batch up here,
    then atomic commit moves them to running.

  Cisco's "running-config + startup-config" is different — Cisco
  applies edits live, then `write memory` saves them.  SRL is
  more like Junos's commit model.

  ## Required prologue: ``discard now``

  Before pushing a config block, the standard pattern is:
  ```
  sr_cli "discard now; <set commands>; commit now"
  ```
  ``discard now`` clears any leftover candidate state from a
  previous failed session.  Without this, your new ``set``
  commands accumulate on top of stale ones, and the next
  ``commit now`` may apply unintended config.

  This is why ``deploy_and_push_lab`` tooling always wraps pushed
  configs with ``discard now ; <body> ; commit now``.

  ## Encoding — base64 pipe

  CLI commands containing newlines, quotes, or special chars are
  base64-encoded by the CLAB API tooling and decoded inside the
  container before piping to ``sr_cli``:
  ```
  echo <base64> | base64 -d | sr_cli 2>&1
  ```
  Direct passing of multi-line config blocks via REST POST body
  often gets mangled by HTTP body parsing.  Don't construct your
  own push without base64 encoding.

  ## ``2>&1`` is required

  ``sr_cli`` writes errors to stderr.  Without ``2>&1`` in the
  ``bash -c`` invocation, your ``exec_on_node`` will return empty
  stdout when the command fails, hiding the actual error.  Always
  use ``bash -c '... 2>&1'``.

  ## Dry-run vs commit

  ``deploy_and_push_lab`` runs each config block in a dry-run
  mode FIRST (``commit validate`` semantically).  If the YAML
  parser or schema validator rejects any line, it returns
  ``dry_run_failures`` BEFORE actually committing.

  Common dry_run_failures causes:
  * ``set / network-instance default interface ethernet-1/1.0`` —
    interface ``.0`` requires the subinterface to exist FIRST
    (``set / interface ethernet-1/1 subinterface 0 admin-state enable``).
    Order matters; SRL's "set" commands are not commutative when
    they depend on parent-object existence.
  * ``set / network-instance default protocols bgp neighbor X
    peer-group G`` — group G must exist FIRST (``set / network-
    instance default protocols bgp group G peer-as ...``).
  * ``set / interface ethernet-X breakout-mode num-channels Y
    channel-speed Z`` — breakout requires platform support; not
    all SRL containers (especially mock containers in CLAB) support
    breakout.

  ## What the agent should NOT do

  1. **Iterate-and-fix** — ``dry_run_failures`` means the spec is
     wrong.  Don't push patches in a loop.  Report CAB FAIL and
     point to the failing line.  CAB is a gate.

  2. **Push partial config without group/instance prerequisites** —
     SRL won't backfill them.  If ``neighbor`` references a missing
     group, the whole batch fails.

  3. **Skip ``2>&1``** in exec_on_node bash invocations.  Even for
     ``show`` commands.  You'll lose the error context.

  4. **Use ``commit confirm``** — SRL has it but the lab tooling
     uses plain ``commit now`` for atomicity.  Don't mix.

  ## What the agent SHOULD do on failure

  When ``deploy_and_push_lab`` returns ``dry_run_failures``:
  * Read the error message — SRL is verbose; usually says exactly
    which line failed and why.
  * Match the error to one of the failure patterns above.
  * Report **CAB FAIL — config rejected at deploy** with the
    failing line + the SRL-specific reason from this guide.
  * Always call ``destroy_lab`` to clean up the partial deploy.

  ## Verification ordering

  Even after a successful deploy_and_push_lab (commit committed),
  protocol convergence is async:
  * BGP/OSPF will take 5-30 seconds to reach Established / Full.
  * Verify protocol state via ``exec_on_node`` AFTER deploy
    returns; don't trust the deploy's "committed" status alone.
  * If exec_on_node shows interface up + IP correct, but BGP
    state is `connect` / `idle` after 30s, that's a config issue
    or routing issue — see ``bgp_validation_srl`` for the state
    decoder.
