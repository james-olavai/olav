# 📋 Config Diff Analysis Strategies
# Defines how to filter "noise" (metadata) and extract sections for different platforms.

platforms:
  cisco_ios:
    metadata_patterns:
      - "current configuration"
      - "last configuration change at"
      - "building configuration"
      - "bytes"
    section_terminator: "!"
    indent_based: true

  cisco_nxos:
    metadata_patterns:
      - "Time:"
      - "Configuration compiled at"
    section_terminator: "!"
    indent_based: true

  huawei_vrp:
    metadata_patterns:
      - "#Last configuration"
      - "display current-configuration"
    section_terminator: "#"
    indent_based: false

  juniper_junos:
    metadata_patterns:
      - "Last changed:"
      - "version"
    section_terminator: "}"
    indent_based: true

  paloalto_panos:
    metadata_patterns:
      - "Last committed"
    section_terminator: "}"
    indent_based: true
