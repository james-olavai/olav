body: |
  # BGP CLI translation — Junos ↔ Cisco IOS / IOS-XR

  Production fleets in this codebase are mixed Junos + Cisco IOS.
  When ops-analyze produces a change plan that's intended for two
  different platforms (e.g. R1 is Junos vSRX, R4 is Cisco IOS),
  the spec must use **per-platform CLI** for each side.  Mixing
  syntax leaks Junos-style commands into a Cisco config or vice
  versa; ops-lab will reject it.

  ## eBGP basic peer (R1 Junos AS65000 ↔ R4 IOS AS65001)

  ### Junos (R1 side)
  ```
  set interfaces ge-0/0/2 unit 0 family inet address 172.16.14.1/30
  set protocols bgp group ebgp-r4 type external
  set protocols bgp group ebgp-r4 family inet unicast
  set protocols bgp group ebgp-r4 local-as 65000
  set protocols bgp group ebgp-r4 neighbor 172.16.14.2 peer-as 65001
  ```

  ### Cisco IOS (R4 side)
  ```
  interface Ethernet0/0.1
   ip address 172.16.14.2 255.255.255.252
  router bgp 65001
   neighbor 172.16.14.1 remote-as 65000
   address-family ipv4
    neighbor 172.16.14.1 activate
   exit-address-family
  ```

  Critical Cisco gotcha: ``neighbor X activate`` is REQUIRED in
  IOS 12.4+ inside the address-family block.  Without it, the
  neighbor is configured but doesn't peer.  Junos has no such
  knob — declaring `family inet unicast` on the group is enough.

  ### Cisco IOS-XR (different from IOS)
  ```
  router bgp 65001
   address-family ipv4 unicast
   neighbor 172.16.14.1
    remote-as 65000
    address-family ipv4 unicast
  !
  ```
  IOS-XR uses indented hierarchy + atomic commit (like Junos);
  IOS 12/15 uses flat config + immediate apply.  Same vendor,
  different paradigms.

  ## iBGP — full mesh vs route-reflector

  ### Junos route-reflector
  ```
  set protocols bgp group ibgp-rr type internal
  set protocols bgp group ibgp-rr cluster 1.1.1.1
  set protocols bgp group ibgp-rr neighbor 4.4.4.4 peer-as 65000
  ```

  ### Cisco IOS route-reflector
  ```
  router bgp 65000
   neighbor 4.4.4.4 remote-as 65000
   address-family ipv4
    neighbor 4.4.4.4 route-reflector-client
  ```

  Cluster ID semantics differ:
  * Junos: `cluster <id>` on the group makes that ROUTER the RR
    for clients in the group.
  * Cisco: `route-reflector-client` per-neighbor; cluster-id
    inferred from BGP router-id.  Set explicitly only for
    multi-RR setups.

  ## Loopback peering

  ### Junos
  ```
  set protocols bgp group ibgp-mesh local-address 1.1.1.1
  set protocols bgp group ibgp-mesh neighbor 4.4.4.4 multihop ttl 64
  ```

  ### Cisco IOS
  ```
  router bgp 65000
   neighbor 4.4.4.4 remote-as 65000
   neighbor 4.4.4.4 update-source Loopback0
   neighbor 4.4.4.4 ebgp-multihop 255  ! only for eBGP loopback peering
  ```

  Junos: `local-address` sets the source IP; `multihop ttl` is
  per-neighbor.  Cisco: `update-source Loopback0` ties to interface
  not address; `ebgp-multihop` only matters for eBGP (iBGP is
  multihop by default in IOS).

  ## Soft-reconfiguration (Cisco only)

  Cisco has `neighbor X soft-reconfiguration inbound` to store
  unfiltered RIB-In.  Junos has no equivalent — it always
  re-fetches via route-refresh capability.  Don't include
  soft-reconfiguration in Junos blocks.

  ## Common spec-generation mistakes (cross-vendor)

  When generating change plans for mixed Junos+Cisco fleets:

  1. **Don't use Cisco syntax for Junos blocks** —
     ``neighbor X.X.X.X remote-as 65001`` is Cisco; Junos uses
     ``set protocols bgp group <G> neighbor X.X.X.X peer-as 65001``
     INSIDE a group.

  2. **Activate is Cisco-only** — Don't add ``activate`` to Junos
     blocks; doesn't parse.

  3. **Family inet unicast on Junos, address-family ipv4 on Cisco** —
     these are equivalent semantics, different syntax.

  4. **AS-path prepend** —
     * Junos: ``set policy-options policy-statement export-prepend
       term 1 then as-path-prepend "65000 65000"``
     * Cisco: ``route-map PREPEND permit 10 / set as-path prepend
       65000 65000``
     * IOS-XR: ``route-policy PREPEND / prepend as-path 65000 2 /
       end-policy``

  5. **Default behaviour differs** —
     * Cisco IOS: implicit accept of all received routes from
       eBGP peers.
     * Junos: implicit accept too, but BGP without explicit
       export policy advertises 0 routes (Junos won't advertise
       anything not in an export policy).
     * IOS-XR: same as Junos — needs explicit export policy.
     * SRL: REJECTS all by default (see srl_spec_generation_rules).

  ## CAB Spec section template (cross-vendor)

  When the spec includes both Junos and Cisco config_lines:
  ```
  ## Config Lines — node R1 (Junos)
  ```
  set ...
  ```

  ## Config Lines — node R4 (Cisco IOS)
  ```
  router bgp ...
  ...
  ```
  ```
  Make the platform-name explicit in the section title.  ops-lab
  reads platform-name to dispatch to the right CLI translator.

  ## Quick-glance "what's the same / different"

  | Concept | Junos | Cisco IOS | IOS-XR | SRL |
  |---|---|---|---|---|
  | Define peer | group + neighbor | direct neighbor | hierarchy | group + neighbor |
  | Activate AF | family inet unicast | activate (inside AF) | address-family ipv4 unicast | afi-safi ipv4-unicast admin-state enable |
  | RR mark | cluster <id> on group | route-reflector-client | route-reflector-client | route-reflector-client |
  | Source from loopback | local-address | update-source LoopbackN | update-source LoopbackN | local-address |
  | Multihop | multihop ttl <n> | ebgp-multihop <ttl> | ebgp-multihop <ttl> | multihop ttl <n> |
  | Apply config | commit | running immediate + write mem | commit | commit now |
  | Default eBGP accept | implicit accept | implicit accept | needs explicit policy | needs explicit policy |
