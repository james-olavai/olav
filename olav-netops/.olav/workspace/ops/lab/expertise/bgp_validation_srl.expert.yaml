body: |
  # SRL-specific BGP validation (NOT Cisco)

  ## Why this matters
  An LLM trained mostly on Cisco IOS / IOS-XR docs will mis-read SRL
  BGP state names.  In SRL, ``active`` is **TCP failure**, not "trying
  to connect" (Cisco semantics).  Use this decoder when validating
  SRL containers in CAB labs.

  ## State Decoder (SRL semantics)

  | state          | meaning                              | likely cause if not Established |
  |----------------|--------------------------------------|----------------------------------|
  | `idle`         | admin-down OR no route to peer       | check admin-state, IGP route to peer |
  | `active`       | TCP cannot reach peer (HARD failure) | NO retry; routing/MTU/FW issue   |
  | `connect`      | TCP attempting; transient            | wait 30s; if persists → TCP fail |
  | `opensent`     | TCP up, BGP OPEN sent, peer silent   | peer-as mismatch typical         |
  | `openconfirm`  | OPEN exchanged; KEEPALIVE pending    | rare; usually transient          |
  | `Established`  | working                              | next: check routes received      |

  ## SRL eBGP gotchas (NOT Cisco-equivalent)

  1. **`ebgp-default-policy import-reject-all`** defaults to **TRUE**
     in SRL (Cisco default = implicit accept).  Must set FALSE OR
     write explicit import policy or NO routes will exchange even
     when BGP reaches `Established`.
  2. **Loopback peering** requires `multihop` (TTL ≥ 2) AND IGP
     route to the peer's loopback.  Direct interface peering does
     NOT need multihop.
  3. **`peer-group` is mandatory** in SRL CLI — Cisco lets you
     declare a neighbor without group; SRL needs the group.
  4. **`subinterface 0` model** — SRL splits interface vs
     subinterface admin-state; both must be enable.

  ## Verification Sequence (cannot skip a step)

  ```
  exec_on_node: bash -c 'sr_cli show interface ethernet-1/1 2>&1'
    → confirm admin/oper up + IPv4 address matches spec

  exec_on_node: bash -c 'sr_cli show network-instance default protocols bgp neighbor 2>&1'
    → confirm state == Established (case-sensitive)

  exec_on_node: bash -c 'sr_cli show network-instance default protocols bgp routes ipv4-unicast summary 2>&1'
    → confirm rx_count ≥ 1 from peer
  ```

  ## CAB Pass Criteria (ALL must hold)

  1. neighbor state == `Established` (the literal string, not
     `active` / `connect` / `opensent`)
  2. ≥1 route received from peer (peer's loopback /32 typically)
  3. interfaces up + IPs match spec
  4. no `dry_run_failures` on the config push
  5. no log-level errors during the exec_on_node sequence

  ## CAB-as-gate rule (NOT fix-it loop)

  CAB IS A GATE.  Any criterion fails → report **CAB FAIL** with the
  specific evidence (the failing exec_on_node line) and the
  diagnostic hint from this decoder.  DO NOT attempt to push more
  config to "fix" the issue — that's lab-bench-engineering, not CAB.
  The change plan is the contract; if it fails in lab, the plan
  needs revision (back to ops-analyze), not the lab needs more
  config.

  ## Failure-mode → diagnosis examples

  * `state=active` on r1 + r4 → TCP not reaching: check IP
    assignment, no firewall in lab subnet, MTU consistent.
  * `state=Established` + 0 routes received → likely
    `ebgp-default-policy import-reject-all=true` (the default).
    Spec missing the policy override.
  * `state=opensent` for >30s → peer-as mismatch.  Verify spec's
    `peer-as` for both sides matches the other's `local-as`.
