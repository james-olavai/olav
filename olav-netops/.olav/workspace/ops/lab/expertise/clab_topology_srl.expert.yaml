body: |
  # ContainerLab topology YAML — required structure for SRL labs

  When ``deploy_and_push_lab`` (or ``deploy_lab``) builds an SRL
  digital twin, the ``yaml_content`` argument MUST be a complete
  ContainerLab topology including BOTH ``nodes`` AND ``links``.
  Containers without an explicit ``links:`` entry have NO L2 path
  between their data interfaces — BGP / OSPF will form no
  adjacency (TCP failure on direct interface peering).

  This is the most common silent-FAIL pattern in CAB lab tests:
  config is correct, deploy commits cleanly, but BGP stays at
  ``active`` because the containers can't ARP each other.

  ## Required topology shape

  ```yaml
  name: <lab_name>
  topology:
    nodes:
      r1:
        kind: nokia_srlinux
        image: ghcr.io/nokia/srlinux:24.10.1
      r4:
        kind: nokia_srlinux
        image: ghcr.io/nokia/srlinux:24.10.1
    links:
      - endpoints: [r1:e1-1, r4:e1-1]   # ← REQUIRED for L2 connectivity
  ```

  Without the ``links:`` section, CLAB starts the containers but
  doesn't create the veth pair between r1 ethernet-1/1 and r4
  ethernet-1/1.  The interfaces still come up admin/oper, the
  IPs are assigned, BGP starts in ``active`` state — but there's
  no actual wire between them.

  ## SRL interface naming in CLAB links

  | SRL CLI name      | CLAB endpoint shorthand |
  |-------------------|-------------------------|
  | ethernet-1/1      | e1-1                    |
  | ethernet-1/2      | e1-2                    |
  | ethernet-1/N      | e1-N                    |

  CLAB uses the dash form (``e1-1``); SRL CLI uses the slash form
  (``ethernet-1/1``).  Spec configs reference the slash form;
  topology endpoints reference the dash form.

  ## Topology checklist for typical CAB lab

  Before passing yaml_content to deploy_and_push_lab, verify:

  1. ``name: <lab_name>`` set (matches the ``lab_name`` argument).
  2. ``topology.nodes`` has each node with ``kind:
     nokia_srlinux`` + ``image: ghcr.io/nokia/srlinux:24.10.1``.
  3. ``topology.links`` has at least one entry per data
     adjacency declared in the spec.  Two-node lab with one
     direct link → one entry.
  4. Endpoint references use the ``e1-N`` shorthand, NOT
     ``ethernet-1/N``.
  5. No ``mgmt`` block needed — CLAB auto-assigns the management
     network.

  ## Multi-link lab (>2 nodes)

  ```yaml
  topology:
    nodes:
      r1: {kind: nokia_srlinux, image: ...}
      r2: {kind: nokia_srlinux, image: ...}
      r3: {kind: nokia_srlinux, image: ...}
    links:
      - endpoints: [r1:e1-1, r2:e1-1]
      - endpoints: [r1:e1-2, r3:e1-1]
      - endpoints: [r2:e1-2, r3:e1-2]
  ```

  Each L2 adjacency requires its own ``endpoints`` entry.

  ## MTU consistency

  CLAB's default veth MTU is 1500.  If your spec uses jumbo MTU
  (9000+) on SRL interfaces, you must also set ``mtu`` on the
  link OR adjust the SRL interface MTU to 1500.  Mismatched MTU
  causes BGP / OSPF stuck-at-exstart problems but can also break
  TCP three-way handshake silently.

  Default safe MTU: don't override; use SRL interface MTU 1500 in
  the spec config_lines for lab.  Production-equivalent jumbo
  configs can be tested separately with explicit lab MTU
  alignment.

  ## What "good" looks like at deploy time

  After ``deploy_and_push_lab`` returns, immediately verify
  L2 connectivity BEFORE checking BGP:

  ```
  exec_on_node: bash -c 'ip -br link 2>&1'
    → expect ethernet-1/1 (or e1-1 from the kernel side) UP

  exec_on_node: bash -c 'ip neigh 2>&1'
    → expect peer's L2 interface IP in the ARP table
  ```

  If ARP table is empty between two-node /30 peering, the link
  was never wired.  Re-check the topology YAML's ``links:``
  section — that's the bug.

  ## Fail-mode → diagnosis

  * BGP ``active`` + ``ip neigh`` empty + interface UP →
    ``links:`` section missing or wrong endpoints.  Typical: agent
    omitted ``links:`` entirely.  CAB FAIL with diagnosis:
    "topology YAML missing inter-container links; bgp can't ARP".
  * BGP ``active`` + ``ip neigh`` shows peer IP but state stale →
    veth created but data-plane filter / firewall.  Less common
    in pure CLAB; usually means custom mgmt network.
  * BGP ``Established`` but 0 routes → that's policy (see
    ``bgp_validation_srl``), NOT topology.  Different problem.
