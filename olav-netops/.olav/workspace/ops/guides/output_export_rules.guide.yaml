schema_version: 1
intent: save_artifact
agent: ops
keywords:
  - save
  - export
  - write to disk
  - write file
  - exports/
  - .mmd
  - .md
  - .csv
  - .json
  - 保存
  - 导出
  - 写文件
body: |
  Any request to "save", "export", "write to disk", or to land an
  artefact under exports/ MUST go through the writer subagent —
  format_and_export is owned by core/writer/, the only path that
  actually writes files.

  Steps (orchestrator-side):

  1. Produce the data (SQL result, Mermaid string, report Markdown,
     simulation JSON, etc.) via your normal tools.

  2. Delegate to writer with a `report_type` tag matching the data:
     olav_delegate("writer",
       "report_type: <tag>\n<the data as JSON or text>")

  3. Writer returns ``{"path": "exports/<subdir>/<file>.<ext>", ...}``;
     cite ``result["path"]`` verbatim in your final reply.

  Report-type tag table:
    device_table       — JSON list of device rows → CSV + Markdown
    topology_diagram   — Mermaid string → .mmd in exports/diagrams/
    query_result       — generic SQL result → CSV
    audit_report       — narrative Markdown → .md in exports/reports/
    script_export      — generated bash/python → .sh / .py in exports/scripts/
    cab_report         — CAB validation report → .md
    diff_report        — drift comparison → .md

  ⚠️ NEVER write "Saved to /exports/foo.X" without having delegated
  to writer.  That is hallucination; the file will not exist on disk.
  SaveAssertionMiddleware catches this case but recovery is best-effort
  — direct delegation is preferred.

related:
  - intent: topology_visualization
    note: "uses report_type=topology_diagram"
  - intent: simulation_what_if
    note: "uses report_type=audit_report for the narrative"
