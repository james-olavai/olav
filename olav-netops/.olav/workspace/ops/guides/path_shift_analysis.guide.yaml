schema_version: 1
intent: path_shift_analysis_between_snapshots
agent: ops
keywords:
  - path shift
  - route changed
  - next-hop changed
  - routes shifted
  - routing change
  - routing diff
  - prefix moved
  - next hop drift
  - 路径变化
  - 下一跳变化
  - 路由漂移
body: |
  Compare routing tables between two snapshots — detect prefixes
  whose next_hop changed.  Run inside run_python_simulation.

  Pattern (latest two snapshots automatically):

  ```python
  snap1 = db.query("""
      SELECT device_name, network, next_hop, snapshot_id
      FROM netops.parsed_outputs
      WHERE command IN ('show ip route', 'show route')
        AND snapshot_id = (
            SELECT snapshot_id FROM netops.parsed_outputs
            ORDER BY created_at ASC LIMIT 1
        )
  """)
  snap2 = db.query("""
      SELECT device_name, network, next_hop, snapshot_id
      FROM netops.parsed_outputs
      WHERE command IN ('show ip route', 'show route')
        AND snapshot_id = (
            SELECT snapshot_id FROM netops.parsed_outputs
            ORDER BY created_at DESC LIMIT 1
        )
  """)
  s1 = {(r["device_name"], r["network"]): r["next_hop"] for r in snap1}
  s2 = {(r["device_name"], r["network"]): r["next_hop"] for r in snap2}
  shifts = []
  for key, nh1 in s1.items():
      nh2 = s2.get(key)
      if nh2 and nh2 != nh1:
          shifts.append({
              "device": key[0], "prefix": key[1],
              "from": nh1, "to": nh2,
          })
  _result = {"path_shifts": shifts, "count": len(shifts)}
  ```

  Raw fallback (RAW-05): if a snapshot's `parsed_outputs` is empty
  (Junos / SR Linux TextFSM gaps), widen the boundary query to
  `UNION ALL` `netops.raw_output_store` so the snapshot still
  participates.

  Prefer `diff_routing_drift(snapshot_id_1, snapshot_id_2)` (see
  drift_detection guide) for a richer report including
  AS-PATH / community / origin deltas — this guide is for the
  next-hop-only quick check.

related:
  - intent: drift_detection
    note: "diff_routing_drift gives a fuller routing diff (next-hop, AS-PATH, community)"
  - intent: bgp_path_selection_and_state_machine
    note: "explain why a path shifted (which BGP attribute changed?)"
