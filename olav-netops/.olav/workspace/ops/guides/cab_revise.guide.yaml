schema_version: 1
intent: cab_revise_after_lab_findings
agent: ops
keywords:
  - revise spec
  - fix lab findings
  - address findings
  - patch TCF
  - update implementation
  - fix the missing AS
  - fix missing address-family
  - 修复 spec
  - 按 lab 反馈修改
  - 添加 AS 号
  - 修补 TCF
  - 二次修订
  - tcf_patch_block
body: |
  Revising an existing TCF after lab findings (or operator manual
  request) — a HITL pattern, not an auto-loop.

  CONTEXT (when this fires):
    - Operator says "lab found these issues, please fix" / "add AS
      65001 to R1" / "address the missing address-family on R3"
    - Spec already exists at exports/cab/<change_id>/spec.tcf.yaml
    - Spec has revision_count > 0 OR lab.verdict != PENDING OR
      lab.prod_review_findings populated

  WORKFLOW (mandatory order):

  1. READ existing spec FIRST (do not skip):
        from olav.core.cab import tcf_load
        tcf = tcf_load("exports/cab/<change_id>/spec.tcf.yaml")
        # Inspect: tcf.implementation, tcf.lab.prod_review_findings,
        #          tcf.revision_count, tcf.last_revised_by

  2. If lab.prod_review_findings exists, READ each finding:
        for f in tcf.lab.prod_review_findings:
            print(f.severity, f.device, f.description, f.suggested_fix)
       Decide per-finding:
        - severity=blocker → fix unless operator explicitly accepts
        - severity=warn   → operator decision; default to baseline
                            assumption unless operator says fix
        - severity=info   → usually pass

  3. APPLY fixes via tcf_patch_block — NOT emit_tcf:
        execute_skill_script(skill_name="analyze",
                             script_name="tcf_patch_block.py",
                             script_args={
                                 "spec_path": "exports/cab/<id>/spec.tcf.yaml",
                                 "device": "R1",
                                 "add_lines": [
                                     "set routing-options autonomous-system 65001",
                                 ],
                             })

     One call per CliBlock change.  Result envelope shows revision_count
     incremented + cli_after preview.

  4. NEVER call emit_tcf when the spec already exists.  emit_tcf
     refuses to overwrite (returns status=error with hint to use
     tcf_patch_block).  Trying anyway just produces the same error.

  5. DO NOT auto-loop.  After your patch_block call, REPORT to user:
       - which findings you addressed
       - which you left alone (and why — baseline-assumed?)
       - new revision_count
     Then STOP.  User decides whether to invoke lab again to
     re-validate or approve as-is.

  COMMON MISTAKES to avoid:
    a. Calling emit_tcf with the same change_id thinking it'll merge
       — it won't, and the guard will refuse with an error pointing
       at this guide.
    b. Patching multiple unrelated findings in one call — each
       semantically-distinct change should be its own patch_block
       (better audit trail in revision_count + last_revised_at).
    c. Deciding per-finding without surfacing reasoning — operator
       needs to see your decision so they can override.
    d. Auto-validating in lab after patches — that's the operator's
       call.  Just emit a clean status report and stop.

  RELATED:
    - intent: change_plan_emit_tcf
      note: "fresh emit (revision 0) — use emit_tcf, NOT patch_block"
    - intent: lab_validation
      note: "operator may ask /lab validate after patch — but you do
             not auto-trigger it"

related:
  - intent: change_plan_emit_tcf
    note: "fresh emit only; patch_block for revisions"
  - intent: lab_validation
    note: "operator-triggered; do not auto-call"
