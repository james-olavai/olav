body: |
  OSPF shortest-path computation inside run_python_simulation.

  Cost rules:
    * Default cost = 10^8 / interface_bandwidth
    * Total path cost = SUM of costs on outgoing interfaces
    * For bidirectional links, use cost on the LOCAL (sending) interface

  Build OSPF-weighted graph from DB:

  ```python
  ospf_nbrs = db.query("""
      SELECT device_name, neighbor_id, interface, cost, state
      FROM netops.v_ospf_neighbors_auto
      WHERE state = 'FULL'
  """)

  G = nx.DiGraph()
  for row in ospf_nbrs:
      cost = row.get("cost") or 10  # default if missing
      G.add_edge(
          row["device_name"], row["neighbor_id"],
          weight=cost, interface=row.get("interface"),
      )
  ```

  Shortest path + cost:

  ```python
  try:
      path = nx.dijkstra_path(G, "R1", "R4", weight="weight")
      cost = nx.dijkstra_path_length(G, "R1", "R4", weight="weight")
      _result = {"path": path, "cost": cost}
  except nx.NetworkXNoPath:
      _result = {"path": None, "reason": "No OSPF path R1→R4"}
  ```

  All shortest paths (ECMP detection - see ecmp_detection guide
  for the full per-pair sweep):

  ```python
  paths = list(nx.all_shortest_paths(G, "R1", "R4", weight="weight"))
  ```

