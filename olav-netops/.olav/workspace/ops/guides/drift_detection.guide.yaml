schema_version: 1
intent: drift_detection
agent: ops
keywords:
  - drift
  - diff
  - compare
  - changed
  - difference
  - delta
  - 漂移
  - 对比
  - between snapshots
  - last two snapshots
  - what changed
  - snapshot comparison
body: |
  Snapshot diff / drift / "what changed between snapshots" requests:

  1. Delegate to ops-analyze — it runs every diff inside
     run_python_simulation, where the four diff primitives are
     pre-loaded sandbox globals (no execute_skill_script needed):
     olav_delegate("ops-analyze", <full request>)

     ops-analyze invokes one call:
       run_python_simulation(experiment_code='''
       _result = diff_sql_state(table, t1, t2)
       ''')

  2. Default snapshot pair when user doesn't specify: latest two,
     i.e. SELECT MAX(snapshot_id) and the one before from
     netops.parsed_outputs (or netops.snapshots).

  3. Output structure:
     - Summary one-liner: "X tables compared, N changes"
     - Details: per-table change list as a Markdown table
     - Impact: which protocols / topology / config are affected
     - Cap at 20 most significant changes; mention overflow

  4. Composite drift+sim is fine in the SAME sandbox call (R102.UNIFIED_SANDBOX).
     If the user asks "what changed AND what would the impact be?",
     chain diff_* + sim.clone + nx graph analysis in one
     run_python_simulation invocation rather than 2-3 round-trips.

  5. If saving the drift report is requested (R85 — inline-save):
       format_and_export(
           data=<markdown_drift_report>,
           format='md',
           subdir='reports',
           filename='drift_<snap_a>_vs_<snap_b>'
       )
     ops-analyze inherits format_and_export from core; no
     delegation to writer needed.  See ``format_diff_report``
     memory for the report-shape conventions.

related:
  - intent: simulation_what_if
    note: "if user asks 'what would change if R3 fails' that's simulation, not drift"
  - intent: save_artifact
    note: "use format_and_export directly (R85); see format_diff_report memory"
