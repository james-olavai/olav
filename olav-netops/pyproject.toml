[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olav-netops"
version = "0.25.1"
description = "OLAV Network Operations domain package — SSH collection, topology analysis, audit, drift detection"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "OLAV Team"}
]
license = {text = "BSL-1.1"}
keywords = ["aiops", "netops", "network-automation", "agent", "nornir", "containerlab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "olav>=0.25.1",
    # Network SSH collection (Nornir + Netmiko)
    "nornir>=3.3.0",
    "nornir-netmiko>=1.0.0",
    # Network utilities (IP/interface parsing, TextFSM templates)
    "netutils>=1.17.1",
    # Floors raised 2026-08-04 (textfsm 1.1.3 -> 2.1.0, ntc-templates
    # 9.0.0 -> 9.1.0) when the platform stopped declaring them.
    #
    # `olav` core carried `textfsm>=2.1.0` + `ntc-templates>=9.1.0` despite
    # having zero importers, and because olav-netops depends on olav, those
    # stricter floors silently won every resolution — every tested install of
    # olav-netops has had 2.1.0 / 9.1.0. Dropping them from core (they belong
    # here, with the only consumers: tools/textfsm_parse.py,
    # core/commands_sync.py, learner/_lib/validate_parser.py) left these floors
    # exposed for the first time, and a fresh `pip install olav-netops` could
    # then resolve textfsm 1.1.3 — a combination never tested. Raised to what
    # the contract effectively was rather than leaving a silent downgrade.
    "textfsm>=2.1.0",
    "ntc-templates>=9.1.0",
    # Topology analysis (graph algorithms, simulation)
    "networkx>=3.6.1",
    # Audit anomaly detection (ML)
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "ruptures>=1.1.9",
    # Collection-time credential redaction (olav/core/redaction.py wraps it;
    # the consumers are THIS package's collect/import paths, so it's a hard
    # dep here — ~50KB pure Python. Redaction defaults ON; without the lib
    # every network import warns loudly and writes plaintext (fail-open).
    "netconan>=0.13",
    # CLI output
    "rich>=13.0.0",
]

[project.optional-dependencies]
sim = [
    # Batfish network simulation / what-if analysis
    "pybatfish>=2024.7.22.1569",
]

# ── Domain table entry points ─────────────────────────────────────────────────
# The platform IngestManager calls importlib.metadata.entry_points to discover
# and auto-register domain tables at startup.
[project.entry-points."olav.ingest_tables"]
parsed_outputs   = "olav_netops.core.tables:ParsedOutputsTable"
devices          = "olav_netops.core.tables:DevicesTable"
topology_links   = "olav_netops.core.tables:TopologyLinksTable"
commands         = "olav_netops.core.tables:CommandsTable"
raw_output_store = "olav_netops.core.tables:RawOutputStoreTable"
oc_outputs       = "olav_netops.core.tables:OcOutputsTable"


# ── Slash command entry points ────────────────────────────────────────────
# Provides slash commands to the platform via the olav.slash_commands group.
# The MANIFEST.yaml in .olav/workspace/netops/ is the authoritative source for
# per-project configuration (approval, timeout, aliases).  These entry points
# declare what the package *can* provide; the project MANIFEST activates them.
[project.entry-points."olav.slash_commands"]
learn_cmd         = "olav_netops.cli.builtin:cmd_learn"
netops_init       = "olav_netops.cli.builtin:netops_init_main"
netops_snapshot   = "olav_netops.cli.builtin:netops_snapshot_main"

[project.entry-points."olav.domain_prompts"]
netops = "olav_netops.cli.prompt:DOMAIN_PROMPT"

[project.entry-points."olav.reload_hooks"]
netops = "olav_netops.command_registry:reload_hook"

# ── First-run empty-state checks (dev_docs/99 §7.1) ─────────────────────────
# The platform's lazy bootstrap discovers this group on every agent launch
# and surfaces returned findings on the TUI welcome screen. Contract: the
# callable takes no args, is deterministic/local (no LLM, no network), and
# returns a user-facing finding string or None.
[project.entry-points."olav.first_run_checks"]
netops_data = "olav_netops.first_run:check_netops_data"

[project.entry-points."olav.config_commands"]
netops = "olav_netops.command_registry:get_config_commands"

# ── Sandbox prologue — injects NetworkModel into every sandbox execution ──
# ADR-0002: the platform core has no knowledge of this; it discovers us
# via the `olav.sandbox_prologues` entry-point group.
[project.entry-points."olav.sandbox_prologues"]
netops_network_model = "olav_netops.sandbox_prologue:network_model_prologue"

# ── Catalog topics — populate `olav catalog` with netops tables/views ──
# ADR-0002 compliance: the platform core ships no topics itself;
# `olav catalog` aggregates this entry-point group.
[project.entry-points."olav.catalog_topics"]
netops = "olav_netops.catalog:get_catalog_topics"

# ── CLI tool loaders — platform dispatches `olav diff` etc. via this group ──
# ADR-0002 P4: platform no longer importlib-loads workspace Python files
# directly. The domain package owns the locator + loader.
[project.entry-points."olav.cli_tools"]
diff_snapshots = "olav_netops.cli.diff_hook:load_diff_snapshots"
selftest_profile = "olav_netops.cli.audit_hook:load_selftest_profile"

[tool.hatch.build.targets.wheel]
packages = ["src/olav_netops"]

[tool.hatch.build.targets.sdist]
# Package source only. The default (whole tree) would ship the dev
# .olav/workspace/ — including live lab nornir credentials/inventory
# (defaults.yaml/hosts.yaml) that must never reach PyPI. The bundled
# skillpack under src/olav_netops/data/ carries the distributable
# workspace copy (with only the .example config templates).
only-include = ["src/olav_netops", "README.md", "pyproject.toml"]
