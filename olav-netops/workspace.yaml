name: netops
version: "0.19.0"
description: "Network operations + audit — SSH collection, analysis, compliance, learning"
set_active: false
requires:
  packages:
    - nornir>=3.3.0
    - nornir-netmiko>=1.0.0
    - netutils>=1.17.1
    - networkx>=3.6.1
    - rich>=13.0.0
  binaries: []
  # Note: Nornir reads passwords from defaults.yaml, not environment variables.
db_schema: netops
init_command: "/netops_init --dry-run"
inject_into_core:
  tools:
    - tools/execute_cli.py
    - tools/search_commands.py
    - tools/diff_configs.py
    - tools/take_snapshot.py

workspaces:
  - name: ops
    source: .olav/workspace/ops
  - name: audit
    source: .olav/workspace/audit
  - name: topology
    source: .olav/workspace/topology
  - name: command_learner
    source: .olav/workspace/command_learner
  # 2026-05-01: spun out from ops sub-agent tree to lighten ops
  # orchestrator prompt (ops 6 → 3 sub-agents).  See dev_docs/00 §
  # ISSUE-CTX-PROMPT-INFLATION mitigation.
  - name: devops
    source: .olav/workspace/devops
  - name: infra
    source: .olav/workspace/infra
