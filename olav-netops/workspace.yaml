name: netops
version: "0.19.0"
description: "Network operations + audit — SSH collection, analysis, compliance, learning"
set_active: false
requires:
  packages:
    - nornir>=3.3.0
    - nornir-netmiko>=1.0.0
    - netutils>=1.17.1
    - networkx>=3.6.1
    - rich>=13.0.0
  binaries: []
  # Note: Nornir reads passwords from defaults.yaml, not environment variables.
db_schema: netops
init_command: "/netops_init --dry-run"
inject_into_core:
  tools:
    - tools/execute_cli.py
    - tools/search_commands.py
    - tools/diff_configs.py
    - tools/take_snapshot.py

# R-AGENT-HIERARCHY Phase A (2026-05-09): consolidated 6→3
# user-facing orchestrators per dev_docs/73.  topology + learner
# pulled back into netops/{topology,learner}; devops_scripts +
# devops_infra merged under devops orchestrator with scripts/
# + infra/ sub-agents.  Patch D' Steps 1-5 (2026-05-08) decoupled
# tool registration scope from impl sharing — removed the
# 2026-05-01 reason to keep agents at top level.  CLI:
# ``olav --agent netops "..."`` / ``olav --agent devops "..."``.
workspaces:
  - name: netops
    source: .olav/workspace/netops
  - name: audit
    source: .olav/workspace/audit
  # devops removed 2026-06-02 (ADR-0014 Phase B): devops is now a PLATFORM
  # agent shipped in the olav wheel (src/olav/data/workspace/devops), deployed
  # by `olav init` — no longer bundled with the netops skill pack.
