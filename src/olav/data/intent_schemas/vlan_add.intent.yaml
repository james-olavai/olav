intent: vlan_add
description: "Create a new VLAN on a switch (L2 broadcast domain)."
version: '1.0'
applies_to_platforms: [cisco_ios, juniper_junos]

args:
  src_device:
    type: string
    required: true
    description: "Switch hostname where the VLAN will be created."
  vlan_id:
    type: integer
    required: true
    description: "VLAN ID (1-4094)."
  vlan_name:
    type: string
    required: true
    description: "Human-readable VLAN name."

fact_lookups:
  - var: src_platform
    sql: "SELECT platform FROM netops.devices WHERE hostname = ?"
    args_template: ["{{ src_device }}"]
    return: scalar
    on_missing: error

# No computed facts needed for vlan_add — VLAN ID is the arg directly.

cli_templates:
  cisco_ios:
    setup:
      - "configure terminal"
      - "vlan {{ vlan_id }}"
      - " name {{ vlan_name }}"
      - " exit"
      - "end"
      - "write memory"
    rollback:
      - "configure terminal"
      - "no vlan {{ vlan_id }}"
      - "end"
      - "write memory"
  juniper_junos:
    setup:
      - "configure"
      - "set vlans {{ vlan_name }} vlan-id {{ vlan_id }}"
      - "commit and-quit"
    rollback:
      - "configure"
      - "delete vlans {{ vlan_name }}"
      - "commit and-quit"

post_checks:
  - device_var: src_device
    description: "VLAN {{ vlan_id }} (name={{ vlan_name }}) is present in the VLAN table"
    command_templates:
      cisco_ios: "show vlan id {{ vlan_id }}"
      juniper_junos: "show vlans {{ vlan_name }}"
    expected_pattern: "{{ vlan_name }}"
    must_match: true
