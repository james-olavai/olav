body: |
  ## ISP / Backbone Edge L1-L4 playbook

  High-fanout BGP / MPLS networks.  Issues at this tier are
  customer-affecting (entire prefixes blackholing).

  ## L1 — DWDM / long-haul

  ### Optic Tx/Rx light levels degrading
  Track `tx_power` / `rx_power` from `show interfaces transceiver
  detail`.  Rx power dropping below threshold (e.g. -18 dBm for
  10GE LR) = imminent failure.

  ### Long-haul interface error trend
  Even small CRC rates on a 100 Gbps long-haul = noticeable
  customer packet loss.

  ## L3 — routing

  ### eBGP session flap pattern
  ```sql
  SELECT device_name, neighbor, remote_as, bgp_state,
         CAST(NULLIF(uptime, '') AS VARCHAR) AS up
  FROM netops.v_show_ip_bgp_neighbors_auto
  WHERE bgp_state != 'Established'
     OR uptime LIKE '%minutes' OR uptime LIKE '%seconds';
  ```
  Flapping eBGP = customer-perceived outage; treat as critical.

  ### iBGP / route-reflector cluster health
  - All RR clients should be Established to at least 2 RRs
  - Cluster-ID inconsistency = routing loops

  ### RIB growth outliers
  ```sql
  SELECT device_name,
         json_extract_string(parsed_data, '$[0].total_paths') AS paths
  FROM netops.parsed_outputs
  WHERE command='show ip bgp summary'
  ORDER BY CAST(paths AS BIGINT) DESC LIMIT 10;
  ```
  Sudden +10% RIB growth between snapshots = leak / hijack /
  policy change worth investigating.

  ### MPLS LSP TE bandwidth / label exhaustion
  - `show mpls forwarding-table summary` — label count near platform limit?
  - LSP head-end re-optimisation failing = sub-optimal routing

  ### Prefix-filter / route-map drift
  - Same prefix-filter different across upstream peers = inconsistent reachability
  - Outbound route-map missing on a customer = leak risk

  ## L4 — control plane

  ### LFA / Fast-Reroute coverage
  - Every link should have an LFA or FRR backup;
    LFA-uncovered link = noticeable convergence delay on failure.

  ### BFD multi-hop adjacencies
  - BFD over iBGP between RRs; BFD detection time tuning critical.

  ### Multicast (PIM) state divergence across PE-CE
  - Source registration count mismatches between PEs.

  ## When recording
  - **All ISP findings are likely customer-affecting.**  Default to
    severity `high` or `critical` unless evidence shows scope
    limited to internal.
  - eBGP session findings should include the affected `remote_as`
    so the operator knows which downstream is impacted.
