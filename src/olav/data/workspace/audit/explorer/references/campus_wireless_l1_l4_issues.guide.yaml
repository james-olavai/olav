body: |
  ## Campus + Wireless L1-L4 playbook

  Issue families common to a campus access network with wireless.
  Each item below is a **hypothesis to test** — not a fact to assume.
  Use this as a checklist input to your PLAN phase; pick the ones
  whose data preconditions are met.

  ## L1 — physical layer

  ### CRC / input / output errors on access ports
  ```sql
  SELECT device_name, interface,
         CAST(NULLIF(input_errors, '') AS BIGINT) AS in_err,
         CAST(NULLIF(crc, '')           AS BIGINT) AS crc_err,
         CAST(NULLIF(output_errors, '') AS BIGINT) AS out_err
  FROM netops.v_show_interfaces_auto
  WHERE CAST(NULLIF(crc, '') AS BIGINT) > 0
     OR CAST(NULLIF(input_errors, '') AS BIGINT) > 1000
  ORDER BY crc_err DESC NULLS LAST LIMIT 50;
  ```
  **Severity**: high when CRC > 1M; critical when CRC > 1B.
  Root causes: failing SFP, bad fiber, duplex mismatch (see L2).

  ### PoE budget oversubscription
  ```sql
  SELECT device_name,
         json_extract_string(parsed_data, '$[0].available_watts') AS avail,
         json_extract_string(parsed_data, '$[0].used_watts') AS used,
         json_extract_string(parsed_data, '$[0].remaining_watts') AS remain
  FROM netops.parsed_outputs
  WHERE command='show power inline' AND parsed_data IS NOT NULL;
  ```
  Watch for `used > 0.9 * available` — adding new APs will trip
  Class-4/UPOE budgets.

  ## L2 — link layer

  ### Speed/duplex mismatches between access ↔ distribution
  ```sql
  SELECT cdp.device_name AS local_dev, cdp.local_interface AS local_int,
         lif.speed AS local_speed, lif.duplex AS local_duplex,
         cdp.neighbor_name AS remote_dev,
         rif.speed AS remote_speed, rif.duplex AS remote_duplex
  FROM netops.v_show_cdp_neighbors_detail_auto cdp
  JOIN netops.v_show_interfaces_auto lif
       ON cdp.device_name = lif.device_name AND cdp.local_interface = lif.interface
  JOIN netops.v_show_interfaces_auto rif
       ON cdp.neighbor_name = rif.device_name AND cdp.neighbor_interface = rif.interface
  WHERE lif.speed != rif.speed OR lif.duplex != rif.duplex;
  ```
  **Highly correlated** with L1 CRC errors — record both, link via
  `related_findings`.

  ### Trunk / native VLAN inconsistencies
  - Trunk allowed VLAN list drift between dist/access pair
  - Native VLAN mismatch → leaks BPDUs / management traffic

  ### MAC address-table close to platform limit
  ```sql
  SELECT device_name, COUNT(*) AS macs
  FROM netops.parsed_outputs po,
       UNNEST(json_extract(po.parsed_data, '$')::JSON[]) AS e
  WHERE po.command='show mac address-table'
  GROUP BY device_name ORDER BY macs DESC LIMIT 10;
  ```
  Catalyst 3850 cap ≈ 32k MACs; alert at >25k.

  ### STP topology change rate (TCN storm)
  Per-interface `last_topology_change` < 1 min on >5 ports = STP
  instability.  Drives intermittent client disconnects.

  ## L3 — network layer

  ### SVI down with Autostate
  ```sql
  SELECT device_name, interface, link_status, protocol_status
  FROM netops.v_show_interfaces_auto
  WHERE interface LIKE 'Vlan%' AND link_status='up'
    AND protocol_status NOT IN ('up', 'up (connected)');
  ```
  "down, Autostate Enabled" means no active port carries the VLAN —
  either widespread VLAN disuse OR a config / ghost issue.

  ### Loopback / management interface mismatch with inventory
  - Loopback0 IP differs from `netops.devices.ip_address` → DNS / NMS confusion.

  ### Default route absent on access switches
  - Critical for management; some access-only stacks rely on this.

  ## L4 — application / control plane

  ### DHCP relay failure cluster
  - `show ip helper-address` shows the relay targets;
    `show ip dhcp snooping statistics` shows drop counters.

  ### ACL deny hit-counts spiking
  - Drop counters on edge ACLs across many ports → policy misconfig.

  ### dot1x auth failure pattern
  ```sql
  SELECT device_name, COUNT(*) AS fail_count
  FROM netops.parsed_outputs po,
       UNNEST(json_extract(po.parsed_data, '$')::JSON[]) AS e
  WHERE command='show authentication sessions'
    AND json_extract_string(e.unnest, '$.method') NOT IN ('dot1x', 'mab')
  GROUP BY device_name HAVING fail_count > 20;
  ```

  ## Wireless-specific

  ### AP software version dispersion (AireOS vs IOS-XE drift)
  ```sql
  SELECT
    CASE WHEN sw LIKE '17.%' THEN 'IOS-XE (new)'
         WHEN sw LIKE '8.10.%' THEN 'AireOS 8.10 (legacy)'
         ELSE 'other' END AS family,
    COUNT(*) AS aps
  FROM (SELECT DISTINCT
          json_extract_string(e.unnest, '$.neighbor_name') AS ap,
          regexp_extract(
            json_extract_string(e.unnest, '$.neighbor_description'),
            'Version: ([0-9.]+)', 1) AS sw
        FROM netops.parsed_outputs,
             UNNEST(json_extract(parsed_data, '$')::JSON[]) AS e
        WHERE command='show cdp neighbors detail'
          AND LOWER(json_extract_string(e.unnest, '$.neighbor_name')) LIKE '%-ap%')
  GROUP BY family;
  ```
  **Severity high if AireOS share > 40%** — security CVE backlog.

  ### WLC coverage gap (managed vs CDP-only)
  ```sql
  SELECT DISTINCT destination_device FROM netops.topology_links
  WHERE LOWER(destination_device) LIKE '%wlc%'
    AND destination_device NOT IN (SELECT hostname FROM netops.devices);
  ```
  Unmanaged WLCs can't receive policy / firmware automation.

  ### AP density imbalance per edge
  ```sql
  SELECT source_device, COUNT(*) AS aps
  FROM netops.topology_links
  WHERE LOWER(destination_device) LIKE '%-ap%'
  GROUP BY source_device HAVING aps >= 28 ORDER BY aps DESC;
  ```
  >28 APs per chassis = single failure cuts service to many users.

  ### CAPWAP DTLS / heartbeat failures
  - WLC mobility-summary should list expected AP count;
    significant delta = AP join issues.

  ## When stating a finding from this playbook

  - Include the actual SQL you ran (not the template above) as
    `evidence_sql`.
  - Pull a couple of result rows as `evidence_rows` for repro.
  - When multiple issues correlate (e.g., CRC + duplex mismatch),
    record both and link via `related_findings`.
