body: |
  Pick the right diagram format, save via ``format_and_export``.

  Decision matrix:

  | User says | Format | Why |
  |---|---|---|
  | "topology" / "diagram" / "draw the network" | mermaid (.mmd) | default; renders in markdown / GitHub |
  | "edit it later" / "open in diagrams.net" | drawio (.xml) | editable XML |
  | "presentation deck" / "Cisco stencils" / "PlantUML" | plantuml (.puml) | vendor stencils |
  | "score card" / "dashboard" / "KPI summary" | infographic (.yaml) | tabular metrics, NOT topology |
  | "BGP path tree" / "routing tree" | mermaid flowchart | most expressive |

  Mermaid example (default, smallest):

      flowchart LR
        R1[R1\nAS 65001] -->|10.0.0.1/30| R2[R2\nAS 65002]
        R2 --> SW1[(SW1)]

  Infographic YAML shape:

      type: scorecard
      title: "Network Health"
      kpis:
        - name: "BGP Convergence"
          value: "98.7%"
          status: "ok"
          target: "≥ 99%"

  Save:
      format_and_export(data="<diagram>", format="mmd",
                        filename="topology")
      # auto-routes: .mmd/.xml/.puml → exports/reports/
      #              .yaml → exports/

  Don't paste the diagram inline — always go to disk via
  ``format_and_export`` (see ``write_class_tool_call`` directive).
