body: |
  format_and_export — argument schema reminder

  This tool takes FLAT keyword arguments at the TOP level. The
  ``data`` parameter is the file CONTENT as a string, NOT a
  configuration dictionary.

  ──────────────────────────────────────────────────────────────
  CORRECT (what the tool actually accepts):

      format_and_export(
          data="<full file content as a single string>",
          format="md",            # md | csv | json | mmd | sh | py | ...
          subdir="reports",       # or None to use the format default
          filename="my_report",   # WITHOUT extension
      )
  ──────────────────────────────────────────────────────────────
  ANTI-PATTERN — common malformation observed in qwen3.6-27b runs.
  This SILENTLY FAILS because ``data`` is expected to be a string:

      format_and_export(
          data={"format": "md",            # ❌ WRONG — nested dict
                "subdir": "reports",
                "filename": "my_report",
                "content": "..."}
      )

      format_and_export(                   # ❌ WRONG — single positional dict
          {"data": "...", "format": "md", ...}
      )
  ──────────────────────────────────────────────────────────────

  When the user asks "save markdown to exports/X.md", they expect:
    1. you build the markdown string yourself (in your reasoning),
    2. you pass that string as the ``data`` keyword argument,
    3. the OTHER fields (format / subdir / filename) are SEPARATE
       keyword arguments, not nested inside data.

  Routing by format (auto-handled by the tool):
    md  / mmd → exports/reports/<filename>.<ext>
    csv / json → exports/queries/<filename>.<ext>
    sh  / py  → exports/scripts/<filename>.<ext>
    yaml      → exports/<filename>.yaml

  Worked example for a 4-router devices report:

      format_and_export(
          data=(
              "# Network Devices Summary\n\n"
              "| Name | IP | Platform |\n"
              "|------|-----|----------|\n"
              "| R1 | 192.168.100.101 | juniper_junos |\n"
              "| R2 | 192.168.100.102 | cisco_ios |\n"
              "| R3 | 192.168.100.103 | cisco_ios |\n"
              "| R4 | 192.168.100.104 | cisco_ios |\n"
          ),
          format="md",
          subdir="reports",
          filename="devices_summary",
      )
      # → writes /<cwd>/exports/reports/devices_summary.md

  Why this guide exists:
    Demo7 Ch8 (2026-04-29) reproduced the args-malformation bug
    on qwen3.6-27b-dense via llama.cpp. Agent emitted the tool_call
    (good — saw the directive), but wrapped all params inside the
    ``data`` field as a dict (bad — schema mismatch). Tool failed
    silently. Agent fell back to deepagents' ``write_file`` which
    bypasses OLAV path routing and audit. This guide pins the
    correct shape so AutoRecall + reranker surface it on
    save/export queries.
