body: |
  ``search_logs`` — live syslog Parquet (UDP 5514 ingest) under
  ``.olav/databases/logs/``.  NOT the same as ``netops.parsed_outputs``
  which holds device ``show logging`` snapshots.

  Reach for it: "any criticals last hour?" / "what happened to R1
  this morning?" / pair with ``execute_sql`` (current state) to
  cross-check "what just happened" vs "what is now".

  Tool shape:
      search_logs(query="BGP", host="R1", hours=24, severity="critical")
      # severity ∈ emergency|alert|critical|error|warning|notice|info|debug
      # host = substring match; query = "" for no keyword filter

  Common patterns:
      search_logs(query="", hours=1, severity="critical")  # alarm sweep
      search_logs(query="BGP", host="R1", hours=24)         # device-scoped
      search_logs(query="duplicate-mac", hours=4)           # fleet pattern
      search_logs(query="", host="SW2", hours=1)            # liveness

  Flow (BGP flap):
    1. ``execute_sql`` → current state from snapshot
    2. ``search_logs(query="BGP", severity="critical", hours=24)`` —
       when neighbour went down
    3. correlate flap timestamps vs snapshot times
    4. optional ``take_snapshot`` for fresh capture

  "No log records found" → window too narrow / host clock skew.  Try
  ``hours=168``.  Verify ``olav service logs`` is Running.  If still
  empty: no devices configured to send syslog yet.
