body: |
  ## draw.io XML — generation rules

  Use this when the user wants an **editable** topology — saved as
  ``.drawio``, openable in https://app.diagrams.net for hand edits
  before presenting / pasting into Confluence / etc.

  For programmatic generation from a Markdown adjacency table, **prefer
  the `render_topology_drawio` Python tool** — it builds valid XML
  deterministically. This guide is the LLM-fallback reference when
  the tool can't handle an edge case.

  ### Minimal XML structure

  ```xml
  <mxfile host="app.diagrams.net">
    <diagram name="Page-1">
      <mxGraphModel>
        <root>
          <mxCell id="0"/>
          <mxCell id="1" parent="0"/>
          <!-- Nodes + edges go here (parent="1") -->
        </root>
      </mxGraphModel>
    </diagram>
  </mxfile>
  ```

  ### Router node (Cisco stencil)

  ```xml
  <mxCell id="R1" value="R1&#xa;AS 65001"
    style="shape=mxgraph.cisco.routers.router;html=1;pointerEvents=1;dashed=0;fillColor=#036897;strokeColor=#ffffff;strokeWidth=2;verticalLabelPosition=bottom;verticalAlign=top;align=center;outlineConnect=0;"
    vertex="1" parent="1">
    <mxGeometry x="80" y="160" width="68" height="48" as="geometry"/>
  </mxCell>
  ```

  ### Switch node

  ```xml
  <mxCell id="SW1" value="SW1"
    style="shape=mxgraph.cisco.switches.workgroup_switch;html=1;pointerEvents=1;dashed=0;fillColor=#036897;strokeColor=#ffffff;strokeWidth=2;verticalLabelPosition=bottom;verticalAlign=top;align=center;outlineConnect=0;"
    vertex="1" parent="1">
    <mxGeometry x="240" y="160" width="68" height="44" as="geometry"/>
  </mxCell>
  ```

  ### Edge (link)

  ```xml
  <mxCell id="e1" value="10.0.0.0/30"
    style="endArrow=none;html=1;"
    edge="1" source="R1" target="R2" parent="1">
    <mxGeometry relative="1" as="geometry"/>
  </mxCell>
  ```

  ### Common style parameters

  | Parameter | Values | Effect |
  |-----------|--------|--------|
  | ``fillColor`` | hex | Node fill colour (``#036897`` = Cisco blue) |
  | ``strokeColor`` | hex | Border colour |
  | ``fontStyle`` | 0/1/2/4 | Normal / Bold / Italic / Underline |
  | ``verticalLabelPosition`` | bottom / top | Label placement |
  | ``dashed`` | 0/1 | Dashed border |
  | ``shape`` | ``mxgraph.cisco.*`` | Cisco stencil shape |

  ### Common Cisco stencil shapes

  ```
  mxgraph.cisco.routers.router
  mxgraph.cisco.switches.workgroup_switch
  mxgraph.cisco.firewalls.firewall
  mxgraph.cisco.servers.standard_server
  mxgraph.cisco.clouds.cloud
  mxgraph.cisco.computers_and_peripherals.pc
  ```

  Stencil choice by hostname prefix (used by ``render_topology_drawio``):

  | Hostname pattern | Stencil | Rationale |
  |---|---|---|
  | ``^R\d``, contains ``-router``, ``-rtr`` | router | L3 device |
  | ``^FW``, contains ``-fw``, ``-firewall``, ``-asa`` | firewall | edge security |
  | default | workgroup_switch | conservative; most network devices are switches |

  ### Layout tips

  - Use an 80 px grid: place nodes at multiples of 80
  - Typical router: width=68, height=48
  - Typical switch: width=68, height=44
  - Group related devices in rectangular containers (swimlanes) for
    readability of >50-node topologies
  - Tree layout: BFS from the highest-fanout node; each BFS level →
    one row, x = column * 120, y = level * 120

  ### Save via OLAV

  ```python
  # Preferred — deterministic Python:
  xml = render_topology_drawio(adjacencies_table_markdown)
  format_and_export(data=xml, format="drawio", filename="topology")
  # → exports/reports/topology.drawio

  # LLM hand-craft path (only when tool can't fit a niche case):
  format_and_export(data=hand_built_xml, format="drawio", filename="custom")
  ```

  ### When to choose drawio over Mermaid

  - User says "edit later" / "open in diagrams.net" / "Confluence editable"
  - Audience uses Confluence / OneNote / .drawio file workflow
  - Topology >50 nodes and needs hand-laid swimlanes / grouping
  - Cisco / Juniper stencils requested by name

  Otherwise default to Mermaid (smaller, inline, GitHub-renderable).
