body: |
  Device-list export — SQL result with device records (hostname,
  ip_address, platform, vendor, role, …).

  Output rule: in chat, render as Markdown table with ALL rows.
  Don't summarize or truncate.  Always end with a record-count line
  (e.g. "12 records total") written in the reply language.

  Save with format_and_export — pass the RAW JSON array from
  execute_sql (NOT the rendered markdown):

      format_and_export(
          data=<json_array_of_objects>,
          format='csv',
          filename='devices'
      )

  Returns ``{"path": "exports/devices.csv", "size": N}``.

  If rows > 50: show first 20 in chat + note total + still save
  the full CSV via format_and_export.  Cite the saved path.
