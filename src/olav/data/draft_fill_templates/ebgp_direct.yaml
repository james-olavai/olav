section: S4_intent_args
intent: ebgp_direct
description: "Compose intent_args for eBGP between two devices in different ASNs, directly connected."
prompt: |
  You are filling section S4 (intent_args) for intent=ebgp_direct.

  CONTEXT:
    user_prompt: {user_prompt}
    devices_in_scope: {devices_in_scope}
    facts (per-device): {facts_summary}

  For ebgp_direct, sim's render layer generates the CLI from facts +
  intent_args. You provide STRUCTURED args, not raw CLI.

  Return JSON with this schema:

  {{
    "peer_as_map": {{
      "<device_A>": <ASN of peer device, i.e. device_B's local_as>,
      "<device_B>": <ASN of peer device, i.e. device_A's local_as>
    }},
    "peer_ip_map": {{
      "<device_A>": "<peer IP on the directly-connected link from device_A's view>",
      "<device_B>": "<peer IP from device_B's view>"
    }},
    "post_checks": [
      {{
        "device": "<one of devices_in_scope>",
        "command": "<show ip bgp summary or show bgp summary>",
        "expected_pattern": "Established",
        "description": "Verify BGP session Established"
      }}
    ]
  }}

  Notes:
    - peer_as_map: from device's perspective, their peer's ASN
    - peer_ip_map: peer IP from the directly-connected interface
    - If facts.topology_edges shows the link interfaces, use the
      peer's interface IP (which sim will allocate from lab_subnet)
      or `<PEER_LINK_IP>` placeholder if real IP not in facts
    - post_checks: at least one per device, expected_pattern from
      vendor catalog (Cisco IOS: "Established", Junos: "Establ")

  Return ONLY the JSON object.

required_keys: [peer_as_map, peer_ip_map, post_checks]
