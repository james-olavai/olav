section: S5_review
description: "Final self-review pass — checks layered (L1-L4) coverage against CLI/post_checks."
prompt: |
  You just composed this DraftChangePlan section by section. Now do a
  final SELF-REVIEW of the assembled draft and identify any issues.

  ASSEMBLED DRAFT:
  {draft_json}

  CHECKLIST (the relevant vendor rules are inlined below — no separate
  KB lookup needed):

  1. LAYER-COVERAGE GATE (top priority)
     - Read draft.layer_changes (a list of "L<n>: <phrase>" entries).
     - For EACH layer entry, verify the implementation backs it up:
         * L1 (physical):  any new interface enable / port-channel must
           appear in intent_args.cli_per_device or render args.
         * L2 (VLAN/trunk): vlan add, switchport mode, allowed-vlan list,
           etc. must be present.
         * L3 (SubIF/SVI/IP/static): `ip address`, `interface vlan<n>`,
           `ip route ...`, `set interfaces unit X family inet address ...`,
           etc. must be present.
         * L4 (services):  full protocol bring-up — e.g. for OSPF on Cisco
           require `router ospf <pid>` declared (not just per-interface
           `ip ospf <pid> area X`); for BGP require `router bgp <as>` +
           neighbor + activate; OSPF on Junos: `set protocols ospf area X
           interface Y.UNIT` (unit number mandatory).
     - If a layer is listed but its CLI is missing/incomplete, flag it.

  2. Per-device CLI vendor-correctness
     - Junos: configure / set ... / commit and-quit (unit numbers required)
     - Cisco IOS: configure terminal / ... / end + write memory
     - SRL: enter candidate / set / ... / commit save

  3. Rollback symmetry — every impl `set X` has matching `delete X`/`no X`?

  4. post_checks
     - Every entry has device + command + expected_pattern (NON-EMPTY real
       substring) + description.
     - At least one post_check per layer touched (e.g. L2 → show vlan;
       L3 → show ip route / show ip interface; L4 → show ip ospf neighbor /
       show ip bgp summary).

  5. facts_collected completeness — every device in scope has platform +
     local_as (or null if N/A) + loopback (or null if N/A).

  6. Cross-field consistency — facts.devices[].platform matches the
     platform implied by the CLI?

  Return ONLY JSON:
  {{
    "review_pass": <true|false>,
    "findings": ["<one-line per issue, prefix with L<n> when layer-specific>"],
    "fixed_draft": <FULL corrected DraftChangePlan JSON if review_pass=false; omit if true>
  }}

  When emitting fixed_draft, return the COMPLETE draft (all top-level fields,
  including layer_changes), not just the changed parts.
