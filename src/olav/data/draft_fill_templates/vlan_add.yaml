section: S4_intent_args
intent: vlan_add
description: "Compose intent_args for adding a VLAN on one or more switches."
prompt: |
  You are filling section S4 (intent_args) for intent=vlan_add.

  CONTEXT:
    user_prompt: {user_prompt}
    devices_in_scope: {devices_in_scope}
    facts (per-device): {facts_summary}

  Return JSON:

  {{
    "vlan_id": <integer 1..4094>,
    "vlan_name": "<optional descriptive name, e.g. 'guest' or 'mgmt'>",
    "post_checks": [
      {{
        "device": "<one of devices_in_scope>",
        "command": "<show vlan brief | show vlans>",
        "expected_pattern": "<VLAN id as decimal string, e.g. '200'>",
        "description": "Verify VLAN created"
      }}
    ]
  }}

  Notes:
    - vlan_id: MUST be in 1..4094 (1 and 4094 are reserved on some platforms; pick safe range 2-4093)
    - vlan_name: optional but recommended (operator readability)
    - post_checks: per-device, expected_pattern is the vlan_id as string

  Return ONLY the JSON object.

required_keys: [vlan_id, post_checks]
