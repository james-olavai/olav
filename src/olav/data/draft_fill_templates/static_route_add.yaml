section: S4_intent_args
intent: static_route_add
description: "Compose intent_args for adding one static route on one device."
prompt: |
  You are filling section S4 (intent_args) for intent=static_route_add.

  CONTEXT:
    user_prompt: {user_prompt}
    devices_in_scope: {devices_in_scope}   (MUST be exactly 1 device)
    facts (per-device): {facts_summary}

  Return JSON:

  {{
    "dst_prefix": "<destination CIDR, e.g. '192.0.2.0/24'>",
    "next_hop_ip": "<next-hop IPv4, e.g. '10.1.13.1'>",
    "admin_distance": <integer 1..255, optional, default 1>,
    "post_checks": [
      {{
        "device": "<the device>",
        "command": "<show ip route <prefix> | show route <prefix>>",
        "expected_pattern": "<the CIDR string itself, e.g. '192.0.2.0/24'>",
        "description": "Verify static route installed"
      }}
    ]
  }}

  Notes:
    - dst_prefix: MUST be valid CIDR (e.g. '10.50.0.0/24', not just '10.50.0.0')
    - next_hop_ip: MUST be valid IPv4 (e.g. '10.1.13.1', not a hostname)
    - admin_distance: usually 1 (default), can be 200+ for floating routes
    - post_checks: at least one, expected_pattern is the prefix itself
      (it appears in `show ip route X.X.X.X/Y` output)

  Return ONLY the JSON object.

required_keys: [dst_prefix, next_hop_ip, post_checks]
