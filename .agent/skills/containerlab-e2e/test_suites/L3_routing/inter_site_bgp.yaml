name: inter_site_bgp
description: >
  eBGP peering between rtr-a (AS 65001) and rtr-b (AS 65002) via Arista
  interconnect switches. Verifies:
    - BGP sessions Established on both routers
    - rtr-a receives 10.2.0.0/16 (Site B prefixes)
    - rtr-b receives 10.1.0.0/16 (Site A prefixes)
    - No MED/AS-path anomalies

queries:
  - agent: olav
    prompt: "从 rtr-a,rtr-b 采集 show bgp summary 和 show route protocol bgp"
    description: "BGP summary and route table from both Juniper routers"
  - agent: olav
    prompt: "从 rtr-a,rtr-b 采集 show bgp neighbor 的详细输出"
    description: "BGP neighbor detail (uptime, prefixes received)"

assertions:
  - type: sql_count
    description: "BGP data collected from both routers"
    query: >
      SELECT COUNT(DISTINCT hostname) FROM netops.parsed_outputs
      WHERE snapshot_id = '{run_id}'
      AND hostname IN ('rtr-a', 'rtr-b')
      AND command LIKE '%bgp%'
    operator: gte
    expected: 2

  - type: sql_count
    description: "BGP neighbor in Established state (NTC parsed)"
    query: >
      SELECT COUNT(*) FROM netops.parsed_outputs
      WHERE snapshot_id = '{run_id}'
      AND hostname IN ('rtr-a', 'rtr-b')
      AND command LIKE '%bgp neighbor%'
      AND parsed_json::json->>'peer_state' = 'Established'
    operator: gte
    expected: 2

query_assertions:
  - agent: quick
    description: "rtr-a BGP neighbor status"
    prompt: "rtr-a 的 BGP 邻居状态如何？对端 AS 号是多少？"
    expect_contains: ["65002", "Established", "rtr-b"]
    expect_not_contains: ["Idle", "Active", "没有数据"]

  - agent: quick
    description: "rtr-b BGP neighbor status"
    prompt: "rtr-b 的 BGP 邻居状态如何？对端 AS 号是多少？"
    expect_contains: ["65001", "Established", "rtr-a"]
    expect_not_contains: ["Idle", "Active", "没有数据"]

  - agent: olav
    description: "Inter-site routing reachability analysis"
    prompt: >
      请分析 rtr-a 和 rtr-b 的路由表，判断站点A（10.1.0.0/16）和
      站点B（10.2.0.0/16）的路由是否互相可达，
      并说明下一跳和 BGP 路径属性
    expect_contains: ["10.1.0.0", "10.2.0.0", "BGP"]
    expect_not_contains: ["unreachable", "error", "exception"]
