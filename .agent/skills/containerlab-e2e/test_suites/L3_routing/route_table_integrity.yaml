name: route_table_integrity
description: >
  Cross-verify routing tables: each router/firewall should have routes to
  both 10.1.0.0/16 (Site A) and 10.2.0.0/16 (Site B), and loopback
  prefixes 10.1.0.1/32 (rtr-a) and 10.2.0.1/32 (rtr-b) should be reachable.

queries:
  - agent: olav
    prompt: "从 rtr-a,rtr-b,fw-a,fw-b 采集完整路由表 (show route / get router info routing-table all)"
    description: "Full routing table from all L3 devices"

assertions:
  - type: sql_count
    description: "Routing data present for both Juniper routers"
    query: >
      SELECT COUNT(DISTINCT hostname) FROM netops.parsed_outputs
      WHERE snapshot_id = '{run_id}'
      AND hostname IN ('rtr-a', 'rtr-b')
      AND command LIKE '%route%'
    operator: gte
    expected: 2

query_assertions:
  - agent: quick
    description: "rtr-a has route to Site B (10.2.0.0/16)"
    prompt: "rtr-a 的路由表里有没有去往 10.2.0.0/16 的路由？通过哪个接口？"
    expect_contains: ["10.2.0.0", "BGP"]
    expect_not_contains: ["没有路由", "not found", "error"]

  - agent: quick
    description: "rtr-b has route to Site A (10.1.0.0/16)"
    prompt: "rtr-b 的路由表里有没有去往 10.1.0.0/16 的路由？通过哪个接口？"
    expect_contains: ["10.1.0.0", "BGP"]
    expect_not_contains: ["没有路由", "not found", "error"]

  - agent: olav
    description: "Loopback reachability check"
    prompt: >
      rtr-a 的 loopback 地址 10.1.0.1/32 是否出现在 rtr-b 的路由表里？
      rtr-b 的 loopback 地址 10.2.0.1/32 是否出现在 rtr-a 的路由表里？
    expect_contains: ["10.1.0.1", "10.2.0.1"]
    expect_not_contains: ["error", "exception"]
