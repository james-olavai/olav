suite: L3_routing
description: >
  L3 routing validation: iBGP/eBGP convergence, inter-site reachability,
  routing table integrity on Juniper routers. Also exercises OLAV's raw LLM
  fallback for PAN-OS (missing BGP NTC template) and FortiOS (missing route table
  NTC template) — these are intentional gaps to validate LLM-based parsing.
depends_on_session: enterprise_dual_site
layer: L3

# L3 routing REQUIRES L2 to be stable first
depends_on_suites:
  - L2_access

precondition_queries:
  - agent: quick
    prompt: "rtr-a 和 rtr-b 的 BGP 邻居是否已经建立（Established 状态）？"
    expect_contains: ["established", "65001", "65002"]
    description: "BGP peers must be established before L3 suite runs"

test_cases:
  - inter_site_bgp.yaml
  - route_table_integrity.yaml
  - firewall_route_check.yaml
