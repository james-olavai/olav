name: bgp_peer_flap
description: >
  FAULT INJECTION: Simulate BGP peer flap by shutting the inter-site link
  (sw-inter-a:eth1 ↔ sw-inter-b:eth1). This forces both rtr-a and rtr-b to
  lose their eBGP session and withdraw inter-site prefixes.

  Test sequence:
    1. Baseline — BGP established, inter-site routes present
    2. INJECT  — shut interface on sw-inter-a (SSH config push via OLAV/Nornir)
    3. DETECT  — BGP goes Idle/Active, routes withdrawn — OLAV should detect
    4. RECOVER — un-shut interface
    5. VERIFY  — BGP re-establishes, inter-site routes restored

  Why this is valuable:
    - Exercises OLAV's ability to correlate L1 link-down → L3 BGP impact
    - Tests the Juniper cRPD NTC template for BGP state parsing
    - Tests the Arista cEOS interface status parsing

fault:
  type: interface_shutdown
  method: ssh_config_push
  target:
    hostname: sw-inter-a
    platform: arista_eos
    interface: Ethernet1
    config_push:
      - "interface Ethernet1"
      - " shutdown"
  wait_after_inject_seconds: 15   # BGP hold-timer is typically 90s, but detection is faster

# ── Pre-fault baseline ────────────────────────────────────────────────────────
pre_fault_queries:
  - agent: olav
    prompt: "从 rtr-a,rtr-b,sw-inter-a,sw-inter-b 采集当前 BGP 状态和接口状态"
    description: "Pre-fault BGP and interface baseline"

pre_fault_assertions:
  - agent: quick
    description: "BGP established before fault injection"
    prompt: "rtr-a 和 rtr-b 的 BGP 连接是否处于 Established 状态？"
    expect_contains: ["Established"]
    expect_not_contains: ["Idle", "Active", "error"]

# ── Post-inject detection ─────────────────────────────────────────────────────
queries:
  - agent: olav
    prompt: >
      从 rtr-a,rtr-b 采集 show bgp summary 和 show bgp neighbor，
      检查 BGP session 状态变化
    description: "BGP state after link shutdown"
  - agent: olav
    prompt: "从 sw-inter-a,sw-inter-b 采集接口状态，确认 eth1 状态"
    description: "Interface state after shutdown"

assertions:
  - type: sql_count
    description: "Post-fault BGP data collected"
    query: >
      SELECT COUNT(DISTINCT hostname) FROM netops.parsed_outputs
      WHERE snapshot_id = '{run_id}'
      AND hostname IN ('rtr-a', 'rtr-b')
      AND command LIKE '%bgp%'
    operator: gte
    expected: 2

query_assertions:
  - agent: olav
    description: "OLAV detects BGP impact from interface shutdown"
    prompt: >
      sw-inter-a 的 Ethernet1 接口被 shutdown 后，rtr-a 和 rtr-b 的 BGP 状态
      发生了什么变化？站点间路由可达性受到了什么影响？
      请给出根因分析
    expect_contains: ["BGP", "shutdown", "impact", "路由"]
    expect_not_contains: ["正常", "exception", "no change"]

  - agent: quick
    description: "BGP session state after fault"
    prompt: "rtr-a 的 BGP 邻居当前状态是什么？"
    expect_contains: ["Idle", "Active", "down", "Connect"]
    expect_not_contains: ["Established"]

# ── Recovery ──────────────────────────────────────────────────────────────────
recover:
  type: interface_no_shutdown
  method: ssh_config_push
  target:
    hostname: sw-inter-a
    platform: arista_eos
    interface: Ethernet1
    config_push:
      - "interface Ethernet1"
      - " no shutdown"
  wait_after_recover_seconds: 30   # Wait for BGP to re-establish

post_fault_queries:
  - agent: olav
    prompt: "从 rtr-a,rtr-b 采集 show bgp summary，确认 BGP 已重新建立"
    description: "Post-recovery BGP validation"

post_fault_assertions:
  - agent: quick
    description: "BGP re-established after fault removal"
    prompt: "恢复接口后，rtr-a 和 rtr-b 的 BGP 邻居是否重新建立连接？"
    expect_contains: ["Established", "恢复"]
    expect_not_contains: ["Idle", "Active", "error"]
