name: bpdu_guard
description: >
  Verify BPDU guard is configured on all host-facing access ports.
  Host ports (e0/1, e0/2 on each access switch) must have:
    spanning-tree portfast
    spanning-tree bpduguard enable
  This prevents users from plugging in unmanaged switches and creating loops.
  The OLAV test queries the running config; it does NOT inject a rogue switch
  (that is covered by fault_injection/access_loop.yaml).

queries:
  - agent: olav
    prompt: >
      从 sw-acc-a1,sw-acc-a2,sw-acc-b1,sw-acc-b2
      采集 show running-config interface 的输出，重点关注 portfast 和 bpduguard 配置
    description: "Access port config snapshot"
  - agent: olav
    prompt: >
      从 sw-acc-a1,sw-acc-a2,sw-acc-b1,sw-acc-b2
      采集 show spanning-tree interface detail 的输出
    description: "Detailed per-port STP state including portfast/edge status"

assertions:
  - type: sql_count
    description: "Running config collected for all 4 access switches"
    query: >
      SELECT COUNT(DISTINCT hostname) FROM netops.parsed_outputs
      WHERE snapshot_id = '{run_id}'
      AND command LIKE '%running-config%'
      AND hostname LIKE 'sw-acc-%'
    operator: gte
    expected: 4

query_assertions:
  - agent: quick
    description: "BPDU guard configured on sw-acc-a1 host ports"
    prompt: "sw-acc-a1 的 e0/1 和 e0/2 端口是否配置了 portfast 和 bpduguard？"
    expect_contains: ["portfast", "bpduguard", "e0/1", "e0/2"]
    expect_not_contains: ["not configured", "未找到"]

  - agent: quick
    description: "BPDU guard configured on sw-acc-b1 host ports"
    prompt: "sw-acc-b1 的 e0/1 和 e0/2 端口是否配置了 portfast 和 bpduguard？"
    expect_contains: ["portfast", "bpduguard"]
    expect_not_contains: ["not configured", "未找到"]

  - agent: olav
    description: "Audit BPDU guard compliance across all access switches"
    prompt: >
      请审计所有接入层交换机（sw-acc-a1, sw-acc-a2, sw-acc-b1, sw-acc-b2）
      的主机端口，检查是否全部配置了 portfast 和 bpduguard，
      列出没有配置的端口（如果有）
    expect_contains: ["bpduguard", "portfast"]
    expect_not_contains: ["exception", "error"]
