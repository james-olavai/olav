name: loop_detection
description: >
  Verify loop detection mechanisms are active before fault injection.
  This test validates the STEADY-STATE: no loops currently present,
  but the protection is in place so that IF a loop is introduced, STP blocks it.

  The actual loop INJECTION test is in fault_injection/access_loop.yaml.
  The sequence for that test is:
    1. [This test]           — verify normal state / loop protection armed
    2. [fault_injection/]   — inject loop, verify STP blocks, then remove loop
    3. [This test again]    — verify normal state restored after loop removal

queries:
  - agent: olav
    prompt: >
      从 sw-dist-a,sw-dist-b,sw-acc-a1,sw-acc-a2,sw-acc-b1,sw-acc-b2
      采集 show spanning-tree blockedports
    description: "Check for any currently blocked STP ports"
  - agent: olav
    prompt: >
      从 sw-acc-a1,sw-acc-a2,sw-acc-b1,sw-acc-b2
      采集 show errdisable recovery
    description: "Errdisable recovery state on access switches"

assertions:
  - type: sql_count
    description: "STP blocked port data collected"
    query: >
      SELECT COUNT(DISTINCT hostname) FROM netops.parsed_outputs
      WHERE snapshot_id = '{run_id}'
      AND command LIKE '%blockedports%'
    operator: gte
    expected: 4

  - type: sql_count
    description: "No interfaces currently in errdisable state"
    query: >
      SELECT COUNT(*) FROM netops.parsed_outputs
      WHERE snapshot_id = '{run_id}'
      AND command LIKE '%errdisable%'
      AND raw_output LIKE '%err-disabled%'
    operator: eq
    expected: 0

query_assertions:
  - agent: quick
    description: "No active STP topology change in progress"
    prompt: "当前所有接入交换机上是否有正在进行的 STP 拓扑变化？"
    expect_contains: ["no topology change", "stable"]
    expect_not_contains: ["topology change detected", "TC flag"]

  - agent: olav
    description: "Loop guard / root guard configured on uplinks"
    prompt: >
      请检查 sw-acc-a1, sw-acc-a2 的上行端口 e0/0 是否配置了 loop-guard 或 root-guard，
      确保不会意外成为 STP root
    expect_contains: ["e0/0", "guard"]
    expect_not_contains: ["error", "exception"]
