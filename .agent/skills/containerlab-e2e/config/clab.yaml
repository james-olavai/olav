# ContainerLab skill configuration
# Auth: kept in CLAB_API_TOKEN env var (never commit credentials here)
#
# To refresh token:
#   export CLAB_API_TOKEN=$(curl -s -X POST http://<host>:8080/login \
#     -H 'Content-Type: application/json' \
#     -d '{"username":"<user>","password":"<pass>"}' | python3 -c \
#     "import sys,json; print(json.load(sys.stdin)['token'])")

api:
  server: "http://192.168.100.12:8080/api/v1"
  login_endpoint: "/login"         # POST — returns {"token": "..."}
  timeout_deploy: 120              # seconds
  timeout_exec: 30                 # seconds per exec call
  timeout_destroy: 30

mgmt_cloud:
  base: "192.168.100"
  start_offset: 110                # r1 → .110, r2 → .111, ...
  max_nodes: 51

timeouts:
  ssh: 180                         # seconds to wait for SSH readiness
  protocol_convergence: 240        # seconds to wait for BGP/OSPF convergence
  poll_interval: 10                # seconds between readiness polls

collection:
  snapshot_id_prefix: "clab"      # snapshot IDs: clab_{test_run_id}
  staging_subdir: "staging"       # relative to evidence_dir
  # Commands run per platform (mapped to parsed_outputs rows)
  # Use "| as json" suffix for SRL to get native JSON output
  commands:
    srl:
      - "show network-instance default protocols bgp neighbor"
      - "show network-instance default route-table"
      - "show system lldp neighbor"
      - "show interface"
    nokia_srl:
      - "show network-instance default protocols bgp neighbor"
      - "show network-instance default route-table"
      - "show system lldp neighbor"
      - "show interface"
    cisco_ios:
      - "show ip bgp summary"
      - "show ip route"
      - "show ip ospf neighbor detail"
      - "show lldp neighbors detail"
      - "show version"
    cisco_iosxe:
      - "show ip bgp summary"
      - "show ip route"
      - "show ip ospf neighbor detail"
      - "show lldp neighbors detail"
      - "show version"
    cisco_iosxr:
      - "show bgp summary"
      - "show route"
      - "show ospf neighbor detail"
      - "show lldp neighbors"
    arista_eos:
      - "show ip bgp summary"
      - "show ip route"
      - "show lldp neighbors detail"
      - "show interfaces"
    arista_ceos:
      - "show ip bgp summary"
      - "show ip route"
      - "show lldp neighbors detail"
      - "show interfaces"
    juniper_junos:
      - "show bgp summary"
      - "show route"
      - "show ospf neighbor detail"
      - "show lldp neighbors"
