hostname ce01
enable secret cisco123
username cisco privilege 15 secret cisco123
!
line vty 0 4
 login local
 transport input ssh telnet
!
! CE router for SP1 Site A — connects to pe01 VRF BLUE (Ethernet2)
! pe01 Ethernet2: 10.255.255.0/31, BGP neighbor expects AS 65101
!
interface Ethernet0/1
 ip address 10.255.255.1 255.255.255.254
 no shutdown
!
interface Loopback0
 ip address 10.255.255.10 255.255.255.255
!
ip routing
!
router bgp 65101
 bgp router-id 10.255.255.1
 neighbor 10.255.255.0 remote-as 65001
 !
 address-family ipv4
  network 10.255.255.10 mask 255.255.255.255
  neighbor 10.255.255.0 activate
 exit-address-family
!
end
