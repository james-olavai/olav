hostname ce02
enable secret <redacted-lab-password>
username cisco privilege 15 secret <redacted-lab-password>
!
line vty 0 4
 login local
 transport input ssh telnet
!
! CE router for SP1 Site B — connects to pe02 VRF BLUE (Ethernet2)
! pe02 Ethernet2: 10.255.255.2/31, BGP neighbor expects AS 65102
!
interface Ethernet0/1
 ip address 10.255.255.3 255.255.255.254
 no shutdown
!
interface Loopback0
 ip address 10.255.255.11 255.255.255.255
!
ip routing
!
router bgp 65102
 bgp router-id 10.255.255.3
 neighbor 10.255.255.2 remote-as 65001
 !
 address-family ipv4
  network 10.255.255.11 mask 255.255.255.255
  neighbor 10.255.255.2 activate
 exit-address-family
!
end
