name: E2E Full

# 仅手动/远程触发 — 避免定时自动消耗 LLM token
# Gitea UI: Actions → E2E Full → Run workflow
# API 触发: POST /api/v1/repos/admin/olav/actions/workflows/e2e-nightly.yml/dispatches
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "指定 agent 测试（留空=全部）"
        required: false
        default: ""
      timeout_factor:
        description: "超时倍数（默认 1.0，慢机器用 2.0）"
        required: false
        default: "1.0"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Layer 3: Full E2E — LLM + demo DB required
  # ─────────────────────────────────────────────────────────────
  e2e-full:
    name: E2E full (LLM)
    runs-on: ubuntu-latest
    env:
      PROBE_E2E_ENABLED: "1"
      DEVOPS_E2E_ENABLED: "1"
      RUNSHEET_E2E_ENABLED: "1"
      OLAV_AUTH_MODE: none
      OLAV_E2E_TIMEOUT_FACTOR: ${{ github.event.inputs.timeout_factor || '1.0' }}
      # ── LLM 연결 ── gitea secrets 에 등록 필요
      OLAV_LLM_API_KEY: ${{ secrets.OLAV_LLM_API_KEY }}
      OLAV_LLM_BASE_URL: ${{ secrets.OLAV_LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
      OLAV_LLM_MODEL: ${{ secrets.OLAV_LLM_MODEL || 'deepseek/deepseek-v4-flash' }}
      OLAV_CLAB_HOST: ${{ secrets.OLAV_CLAB_HOST }}
      # ── Embed 모델 ── memory/KB 기능에 필요
      # secrets.OLAV_EMBED_BASE_URL 미등록 시 내부망 Ollama 기본값 사용
      OLAV_EMBEDDING_MODE: ${{ secrets.OLAV_EMBED_BASE_URL != '' && 'api' || 'api' }}
      OLAV_EMBEDDING_BASE_URL: ${{ secrets.OLAV_EMBED_BASE_URL || 'http://192.168.100.50:11434/v1' }}
      OLAV_EMBEDDING_MODEL: ${{ secrets.OLAV_EMBED_MODEL || 'embeddinggemma:latest' }}
      OLAV_EMBEDDING_API_KEY: ${{ secrets.OLAV_EMBED_API_KEY || 'ollama' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install olav-netops (editable)
        run: uv pip install -e olav-netops/

      - name: Bootstrap workspace
        run: uv run olav init

      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      # Parquet seed (~5s, 38.8MB from git) → bundle fallback if parquet missing
      - name: Seed demo DB from Parquet fixtures
        run: |
          if [ -f tests/fixtures/demo_db/devices.parquet ]; then
            echo "Seeding from Parquet (fast path, ~5s)..."
            uv run python tests/fixtures/demo_db/seed.py && echo "Done" || echo "Seed failed"
          else
            echo "Parquet not found, falling back to bundle import..."
            for bundle in tmp/anon/bundle_2026-01-18 tmp/anon/bundle_2026-02-15; do
              [ -d "$bundle" ] || continue
              echo "{\"path\": \"$bundle\"}" | \
                uv run python .olav/workspace/netops/importer/scripts/ingest_snapshot.py \
                2>/dev/null || true
            done
          fi
        continue-on-error: true

      # nornir/Netmiko 채집 테스트: DIFF_E2E_ENABLED=1 없으면 자동 skip.
      # nornir 미설정 환경에서는 설정하지 말 것.
      # - test_diff_netmiko_e2e:    DIFF_E2E_ENABLED=1 필요
      # - test_ingest_clab_roundtrip: INGEST_E2E_ENABLED=1 + CLAB 필요
      # - test_command_learner_e2e:  LEARNER_E2E_ENABLED=1 필요
      # → 위 변수 미설정 시 해당 테스트 자동 skip (코드 레벨 게이팅)

      - name: Run demo runsheet e2e (CH3-CH15)
        run: |
          uv run pytest tests/e2e/test_demo_runsheet_82.py \
            -q --tb=short --timeout=600
        continue-on-error: true

      - name: Run admin e2e
        run: uv run pytest tests/e2e/test_admin_e2e.py -q --tb=short
        continue-on-error: true

      - name: Run netops e2e
        run: uv run pytest tests/e2e/test_netops_e2e.py -q --tb=short
        continue-on-error: true

      - name: Run devops e2e
        run: uv run pytest tests/e2e/test_devops_e2e.py -q --tb=short
        continue-on-error: true

      - name: Run audit e2e
        run: uv run pytest tests/e2e/test_audit_e2e.py -q --tb=short
        continue-on-error: true

      - name: Run KB + memory e2e
        run: |
          uv run pytest \
            tests/e2e/test_m3_kb_llm_e2e.py \
            tests/e2e/test_uks_e2e_full.py \
            -q --tb=short
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## E2E Nightly Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- LLM: $OLAV_LLM_MODEL" >> $GITHUB_STEP_SUMMARY
