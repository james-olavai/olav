name: CI

# 触发条件：所有分支的 push + PR
# 注：.github/workflows/test.yml 只覆盖 main/dev，本文件覆盖所有分支
on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:

# ── Embed 모델 설정 ──────────────────────────────────────────────
# job 컨테이너에서는 내부망 Ollama(192.168.100.50:11434)에 접근 불가.
# local 모드만 설정하고 모델은 오버라이드하지 않음 → 런타임 기본값
# BAAI/bge-small-zh-v1.5 (512-dim, ~90MB, sentence-transformers)를 그대로 사용.
# 중국어 특화지만 영어도 처리 가능; 영어 중심/국제 배포는 다국어 모델이나
# 로컬 Ollama로 전환 (docs: getting-started/installation, `update_embedding_config`).
# 외부 API embed가 필요한 테스트는 e2e-nightly.yml에서 secrets으로 설정.
env:
  OLAV_AUTH_MODE: none
  OLAV_EMBEDDING_MODE: local

jobs:
  # ─────────────────────────────────────────────────────────────
  # Layer 1a: Unit tests — fast, no external deps (~15s each)
  # ─────────────────────────────────────────────────────────────
  unit:
    name: Unit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [platform, netops, presales]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bootstrap workspace
        run: uv run olav init

      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      - name: Install olav-netops as Python package (platform unit tests also need it)
        if: matrix.suite == 'platform'
        run: uv pip install -e "olav-netops/[sim]"

      - name: Run unit tests — platform
        if: matrix.suite == 'platform'
        run: uv run pytest tests/unit/ -q --tb=short
        continue-on-error: true

      - name: Install olav-netops as Python package (netops unit tests need it)
        if: matrix.suite == 'netops'
        run: uv pip install -e "olav-netops/[sim]"

      - name: Run unit tests — netops
        if: matrix.suite == 'netops'
        run: uv run pytest olav-netops/tests/unit/ -q --tb=short
        continue-on-error: true

      # olav-presales depends on olav-netops (link_id reuse + topology shape).
      - name: Install olav-presales as Python package (presales unit tests need it)
        if: matrix.suite == 'presales'
        run: |
          uv pip install -e "olav-netops/[sim]"
          uv pip install -e olav-presales

      - name: Run unit tests — presales
        if: matrix.suite == 'presales'
        run: uv run pytest olav-presales/tests/ -q --tb=short
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # Layer 1b: Governance — contract tests, no LLM (~10s each)
  # ─────────────────────────────────────────────────────────────
  governance:
    name: Governance (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [platform, netops]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bootstrap workspace
        run: uv run olav init

      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      # presales is the 7th top-level agent (ADR-0017) — test_v018_compliance
      # asserts the runtime .olav/workspace/ dir set, so the presales workspace
      # must be deployed before the platform governance suite runs.
      - name: Install presales skill pack
        run: |
          uv pip install -e olav-presales
          uv run olav skill install olav-presales

      - name: Run governance — platform
        if: matrix.suite == 'platform'
        run: uv run pytest tests/governance/ -q --tb=short -m "not netops"

      - name: Run governance — netops
        if: matrix.suite == 'netops'
        run: uv run pytest tests/governance/ -q --tb=short -m netops

  # ─────────────────────────────────────────────────────────────
  # Layer 2: E2E fast — no LLM required (~65s)
  # 50 tests covering platform integration without LLM/CLAB/Netmiko
  # ─────────────────────────────────────────────────────────────
  e2e-fast:
    name: E2E fast (no-LLM)
    runs-on: ubuntu-latest
    needs: [unit, governance]   # 기본 검증 통과 후 실행
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bootstrap workspace
        run: uv run olav init

      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      # Pre-warm the local embedder so the model download + first load happens
      # ONCE here (no time limit), not inside a test's `olav kb`/`olav refresh`
      # subprocess where it raced the 30s timeout and flaked the gate.
      - name: Pre-warm embedder
        run: uv run python -c "from olav.core.embedder import embed_text; v=embed_text('warmup'); print('embedder warm:', bool(v), len(v) if v else 0)"
        continue-on-error: true

      - name: Run no-LLM e2e tests
        env:
          OLAV_AUTH_MODE: none
        run: |
          # test_phase1-4 are gitignored — only run tracked e2e files
          uv run pytest \
            tests/e2e/test_m1_platform_e2e.py \
            tests/e2e/test_uks_cli.py \
            tests/e2e/test_uks_e2e_full.py \
            tests/e2e/test_uks_recall.py \
            -q --tb=short
