name: CI

# 触发条件：所有分支的 push + PR
# 注：.github/workflows/test.yml 只覆盖 main/dev，本文件覆盖所有分支
on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:

# ── Embed 모델 설정 ──────────────────────────────────────────────
# runner는 내부망(192.168.100.12) Ollama에 접근 가능.
# Ollama embed 모델이 있으면 API 모드, 없으면 local 폴백(bge-base-en-v1.5).
# secrets.OLAV_EMBED_BASE_URL 이 등록되어 있으면 그것을 우선 사용.
env:
  OLAV_AUTH_MODE: none
  OLAV_EMBEDDING_MODE: ${{ secrets.OLAV_EMBED_BASE_URL != '' && 'api' || 'local' }}
  OLAV_EMBEDDING_BASE_URL: ${{ secrets.OLAV_EMBED_BASE_URL || 'http://192.168.100.12:11434/v1' }}
  OLAV_EMBEDDING_MODEL: ${{ secrets.OLAV_EMBED_MODEL || 'nvidia/llama-nemotron-embed-vl-1b-v2' }}
  OLAV_EMBEDDING_API_KEY: ${{ secrets.OLAV_EMBED_API_KEY || 'ollama' }}
      OLAV_EMBEDDING_INPUT_TYPE: ${{ secrets.OLAV_EMBED_INPUT_TYPE || 'query' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Layer 1a: Unit tests — fast, no external deps (~15s each)
  # ─────────────────────────────────────────────────────────────
  unit:
    name: Unit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [platform, netops]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bootstrap workspace
        run: uv run olav init

      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      - name: Run unit tests — platform
        if: matrix.suite == 'platform'
        run: uv run pytest tests/unit/ -q --tb=short

      - name: Run unit tests — netops
        if: matrix.suite == 'netops'
        run: uv run pytest olav-netops/tests/unit/ -q --tb=short
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # Layer 1b: Governance — contract tests, no LLM (~10s each)
  # ─────────────────────────────────────────────────────────────
  governance:
    name: Governance (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [platform, netops]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bootstrap workspace
        run: uv run olav init

      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      - name: Run governance — platform
        if: matrix.suite == 'platform'
        run: uv run pytest tests/governance/ -q --tb=short -m "not netops"

      - name: Run governance — netops
        if: matrix.suite == 'netops'
        run: uv run pytest tests/governance/ -q --tb=short -m netops

  # ─────────────────────────────────────────────────────────────
  # Layer 2: E2E fast — no LLM required (~65s)
  # 50 tests covering platform integration without LLM/CLAB/Netmiko
  # ─────────────────────────────────────────────────────────────
  e2e-fast:
    name: E2E fast (no-LLM)
    runs-on: ubuntu-latest
    needs: [unit, governance]   # 기본 검증 통과 후 실행
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bootstrap workspace
        run: uv run olav init

      - name: Install netops skill pack
        run: uv run olav skill install olav-netops

      - name: Run no-LLM e2e tests
        env:
          OLAV_AUTH_MODE: none
        run: |
          uv run pytest \
            tests/e2e/test_m1_platform_e2e.py \
            tests/e2e/test_phase1_collection.py \
            tests/e2e/test_phase2_normalization.py \
            tests/e2e/test_phase3_topology.py \
            tests/e2e/test_phase4_nl_acceptance.py \
            tests/e2e/test_uks_cli.py \
            tests/e2e/test_uks_e2e_full.py \
            tests/e2e/test_uks_recall.py \
            -q --tb=short
