[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olav-ent"
version = "0.11.0"
description = "OLAV Enterprise Features package (audit dataset export, encrypted dataset control)"
requires-python = ">=3.11"
dependencies = [
    "olav>=0.11",
    "tink>=1.14.1",
    "PyJWT>=2.8.0",
]


[project.entry-points."olav.enterprise_commands"]
log_export = "olav.enterprise.cli_bridge:dispatch_log_export"


[tool.hatch.build.targets.wheel]
packages = ["src/olav/enterprise"]
