# Generated by OLAV Audit Agent
# Intent: Check that all interfaces are up and have descriptions
# Created: 2026-02-20

# AUDIT_HEALTH — Network Health Check
# =====================================
# 内置审计：检查设备 CPU / 内存 / 接口 / BGP / OSPF 健康状态
#
# 如何运行:
#   run_audit("AUDIT_HEALTH")
#   run_audit("AUDIT_HEALTH", devices=["R1", "R2"])
#
# 修改阈值: 直接编辑 rules 下各条目的 warning / critical 值
# 添加检查: 在 rules 中增加新条目，target 必须在 target_map.yaml 中定义

name: "Network Health Check"
version: "1.0.0"
description: "CPU, memory, interface and routing protocol health monitoring"
type: health_check
created_at: "2026-02-20"
created_by: builtin

# ---------------------------------------------------------------------------
# Map 阶段：收集哪些数据
# ---------------------------------------------------------------------------
collect:
  # intents 对应 snapshot.py 的 CATEGORY_KEYWORDS 键
  intents:
    - system          # cpu, memory, version
    - interfaces      # interface status, counters
    - routing         # bgp, ospf, route table
    - neighbors       # cdp, lldp

# ---------------------------------------------------------------------------
# Reduce 阶段：规则列表
# ---------------------------------------------------------------------------
rules:
  - name: cpu_high
    target: cpu_percent
    condition: greater_than
    warning: 70
    critical: 90
    unit: percent
    recommendation: "CPU 利用率过高"
    analysis_hint: |
      High CPU can result from routing protocol convergence storms,
      excessive ACL/policy processing, software bugs, or sudden traffic
      bursts. If multiple devices show high CPU at the same time, suspect
      a control-plane event (topology change, BGP churn, OSPF full SPF).
      Co-occurrence with BGP/OSPF drops on the same device strongly
      suggests control-plane overload rather than a hardware problem.

  - name: memory_high
    target: memory_percent
    condition: greater_than
    warning: 75
    critical: 92
    unit: percent
    recommendation: "内存利用率过高"
    analysis_hint: |
      Memory exhaustion can precede process crashes, interface drops, or
      routing table truncation. Co-occurrence with BGP/OSPF anomalies may
      indicate rapid route-table growth (route leak, full-table peer).
      Sudden spikes without topology changes suggest memory leaks in a
      vendor process — correlate with recent software upgrades.

  - name: interface_down
    target: interface.status
    condition: not_equals
    expected: "up"
    severity: warning
    filter:
      exclude_pattern: "^(Loopback|Management|Mgmt|Vlan|Tunnel).*"
    recommendation: "接口 down"
    analysis_hint: |
      Interface down events are frequent cascade triggers: a physical
      port going down causes routing adjacency loss, then route
      withdrawal, then traffic blackhole on downstream devices.
      Simultaneous multi-interface downs on one device (especially with
      power-related syslog) suggest UPS/PSU failure or line-card reset.
      Always check whether BGP/OSPF findings on this or adjacent devices
      are time-correlated — they are likely downstream symptoms.

  - name: bgp_not_established
    target: bgp.state
    condition: not_equals
    expected: "Established"
    severity: critical
    recommendation: "BGP 邻居 not Established"
    analysis_hint: |
      BGP session loss typically follows an underlay event. If an OSPF
      adjacency to the same peer is also lost, the underlay path is
      broken — the BGP drop is a secondary symptom, not the root cause.
      If only BGP is affected, suspect authentication mismatch, MD5 key
      rotation, TCP RST, or graceful-restart timer expiry.
      Simultaneous loss of multiple BGP sessions on one device (all
      peers) points to local CPU overload or interface-card failure
      rather than per-peer link issues.

  - name: ospf_not_full
    target: ospf.state
    condition: not_in_set
    forbidden:
      - "FULL"
      - "2WAY"
    severity: warning
    recommendation: "OSPF 邻居状态异常"
    analysis_hint: |
      OSPF adjacency degradation causes: hello/dead timer mismatch,
      area-ID or stub-flag mismatch, authentication failure, MTU
      mismatch (stuck in ExStart/Exchange), or lossy underlay.
      INIT state means hellos arrive but replies do not (asymmetric
      reachability or ACL drop in one direction).
      If BGP to the same peer is also affected, the underlay link is
      likely down — OSPF loss is secondary. If only OSPF is degraded,
      suspect timer or MTU misconfiguration on one side.

# ---------------------------------------------------------------------------
# Analyze 阶段：LLM 推理（Reduce 之后、Report 之前）
# analysis_hint 已内联在每条 rule 中；此块控制推理粒度和 LLM instructions
# ---------------------------------------------------------------------------
analysis:
  per_device:
    enabled: true
    instructions: |
      For this single device, analyze ALL findings together holistically.
      Determine whether findings are independent or share a common root
      cause (e.g., one interface flap simultaneously causing OSPF loss
      and BGP session drop to the same peer).
      Use the domain context provided with each finding.
      Identify: (1) the most likely root cause, (2) which findings are
      downstream symptoms of that cause, (3) the single highest-priority
      action to resolve the situation.
      3-5 sentences of plain prose, no markdown headers or bullet lists.

  global_analysis:
    enabled: true
    instructions: |
      Analyze findings across ALL devices for cascade failure patterns
      and shared root causes.
      Look for: simultaneous multi-device events (UPS/power failure,
      upstream link flap), control-plane storms (BGP churn driving CPU
      spikes), shared infrastructure dependencies (same upstream router,
      same UPS domain, same line card type).
      Reconstruct the probable failure chain in likely chronological
      order: identify the original trigger vs downstream symptoms, and
      distinguish isolated device issues from network-wide events.
      If the evidence is insufficient for a firm conclusion, say so and
      list the most likely hypotheses ranked by probability.
      Prioritise: fixing the root trigger eliminates all downstream
      symptoms. 4-6 sentences of plain prose.

# ---------------------------------------------------------------------------
# Output 阶段：报告格式
# ---------------------------------------------------------------------------
output:
  title: "Network Health Audit Report"
  filename_pattern: "audit_health_{timestamp}.md"

  sections:
    - type: header
      fields:
        - date
        - overall_health
        - scope
        - device_summary
        - anomaly_count

    - type: device_health_table
      columns:
        - device
        - status
        - health_score
        - anomaly_count
        - commands_inspected

    - type: anomaly_table
      severity_filter: []        # 显示全部 (warning + critical)
      max_rows: 50

    - type: recommendations
      max_items: 20

    - type: per_device_analysis   # LLM per-device holistic root-cause analysis

    - type: global_analysis       # LLM cross-device cascade & correlation analysis

    - type: footer
