# OLAV Security Policies Configuration
# 
# This file defines security policies for OLAV v0.12.0
# Policies are categorized by risk level and action type.
#
# Categories:
# - destructive: Operations that delete or modify data permanently
# - high_risk: Operations that significantly affect system state
# - medium_risk: Operations that require caution
#
# Actions:
# - BLOCK: Immediately block the operation
# - CONFIRM: Require explicit user confirmation before proceeding
# - WARN: Allow but log a warning

version: "1.0"

categories:
  destructive:
    description: "Operations that permanently delete or modify data"
    action: BLOCK
    patterns:
      # English patterns
      - "delete all"
      - "remove all"
      - "drop database"
      - "truncate table"
      - "delete * from"
      - "rm -rf"
      - "format disk"
      - "wipe all"
      - "reset to factory"
      - "clear all configs"
      # Chinese patterns
      - "清空所有"
      - "删除全部"
      - "删除所有"
      - "删除数据库"
      - "删除配置"
      
  high_risk:
    description: "Operations that significantly affect system state"
    action: CONFIRM
    patterns:
      # English patterns
      - "shutdown"
      - "restart"
      - "reboot"
      - "disable firewall"
      - "change password"
      - "modify config"
      - "deploy config"
      - "apply configuration"
      - "bulk change"
      - "batch update"
      - "mass update"
      - "change routing"
      - "modify ospf"
      - "change bgp"
      # Chinese patterns
      - "批量修改"
      - "推送配置"
      - "应用配置"
      - "重启设备"
      - "关闭防火墙"
      - "修改路由"
      
  medium_risk:
    description: "Operations that require caution"
    action: WARN
    patterns:
      # English patterns
      - "execute command"
      - "run show"
      - "query database"
      - "export data"
      - "download file"
      - "run diagnostic"
      - "clear counters"
      - "reset interface"
      # Chinese patterns
      - "执行命令"
      - "查询数据库"
      - "导出数据"

guardrail:
  enabled: true
  threshold: 0.85
  fallback_to_llm: true
