# Data Retention Policy Configuration
# 
# This file defines how long to keep snapshot data and how to clean up old data.
# The policy uses a tiered approach to balance historical data with storage efficiency.

retention:
  enabled: true
  
  # Retention Tiers
  # Each tier defines how long to keep data and at what frequency
  tiers:
    - name: hot
      duration_days: 7
      keep_frequency: "all"  # Keep all snapshots
      description: "最近 7 天，全部保留 (高频查询)"
      
    - name: warm
      duration_days: 30
      keep_frequency: "daily"  # Keep last snapshot of each day
      description: "8-30 天，每天保留最后一次"
      
    - name: cold
      duration_days: 90
      keep_frequency: "weekly"  # Keep last snapshot of each week
      description: "31-90 天，每周保留最后一次"
  
  # Automatic Cleanup
  cleanup:
    auto_cleanup: true
    run_schedule: "daily"  # Run cleanup daily
    run_time: "02:00"  # Run at 2:00 AM
    dry_run: false  # Set to true to preview without deleting
    
  # Archive (Future Feature)
  archive:
    enabled: false
    destination: "s3://olav-archive/"
    compress: true
    
# Cleanup Rules
rules:
  # Delete snapshots older than cold tier
  delete_after_days: 90
  
  # Minimum snapshots to keep (safety net)
  min_snapshots_to_keep: 3
  
  # Keep snapshots with specific tags (future)
  keep_tagged:
    - "baseline"
    - "incident"
    - "audit"
