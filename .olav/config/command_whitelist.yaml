# OLAV Snapshot Command Whitelist
# This file defines which commands are executed when sync.command_mode is "whitelist"

cisco_ios:
  - "show version"
  - "show ip interface brief"
  - "show ip route"
  - "show ip ospf neighbor"
  - "show ip bgp summary"
  - "show interfaces status"
  - "show vlan brief"
  - "show processes cpu"
  - "show logging"
  - "show arp"
  - "show mac address-table"
  - "show cdp neighbors detail"

cisco_xr:
  - "show version"
  - "show install active"
  - "show ip interface brief"
  - "show route ipv4"
  - "show bgp sessions"
  - "show ospf neighbor"

huawei_vrp:
  - "display version"
  - "display ip interface brief"
  - "display ip routing-table"
  - "display bgp peer"
  - "display ospf peer"

juniper_junos:
  - "show version"
  - "show interfaces terse"
  - "show route"
  - "show bgp summary"
  - "show ospf neighbor"
