body: |
  Generic SQL result export.  Default format: CSV (one row per record).

  Pass the RAW JSON array from execute_sql — NOT a markdown table or
  prose summary — so format_and_export's pandas path produces proper
  multi-column CSV.

      format_and_export(
          data=<json_array_of_objects>,
          format='csv',
          filename='<descriptive_name>'  # e.g. 'devices', 'bgp_neighbors'
      )

  Variants:
  - ``format='json'`` — pretty-printed JSON file
  - ``format='md'`` — markdown table (rare; CSV is the default)

  Returns ``{"path": "exports/<name>.csv", "size": N}``.  Cite path
  verbatim.
