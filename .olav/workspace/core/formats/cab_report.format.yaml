body: |
  CAB (Change Advisory Board) validation report — captures
  show-command evidence with PASS/FAIL on a fixed 4-row table.

  Required structure (Markdown):
  - ``## CAB Validation Report: <change_id>``
  - ``### Evidence Table`` — exactly 4 columns:
    Check | Result | Detail | Evidence
    Required rows: Interface UP, L3 Reachability, BGP Convergence,
    Route Installed.
  - ``### Design Commentary`` — classify findings with emoji:
    🔴 BLOCKER · 🟡 PREREQ · 🟠 SYNTAX · 🔵 SUGGEST
  - ``### CAB Decision`` — PASS or FAIL + recommendation

  Save:
      format_and_export(
          data=<markdown_text>,
          format='md',
          subdir='cab',
          filename='cab_<change_id>'
      )

  Returns ``{"path": "exports/cab/cab_<id>.md", ...}``.
