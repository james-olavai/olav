# 📋 Network Device Normalization Strategy
# Defines device types and their baseline "Gold Standard" platforms.
# Used by fuzzy_map_schema for multi-vendor alignment.

device_categories:
  routing_switching:
    standard_platform: cisco_ios
    platforms:
      - cisco_ios
      - cisco_xe
      - cisco_nxos
      - juniper_junos
      - arista_eos
      - huawei_vrp
      - hp_comware
      - hp_procurve
      - dell_os9
      - dell_os10
      - dell_force10
      - mikrotik_routeros
      - ubiquiti_edgeos
      - vyos_vyos
      - alcatel_aos
      - mellanox_onyx
      - brocade_vdx
      - brocade_nos
      - nokia_sros

  firewall:
    standard_platform: cisco_asa
    platforms:
      - cisco_asa
      - cisco_ftd
      - paloalto_panos
      - fortinet_fortios
      - checkpoint_gaia
      - juniper_srx
      - sophos_sfos

  wireless:
    standard_platform: cisco_wlc
    platforms:
      - cisco_wlc
      - aruba_os
      - extreme_exos
      - ruckus_fastiron

  load_balancer:
    standard_platform: f5_bigip
    platforms:
      - f5_bigip
      - citrix_netscaler
      - a10_acos
      - radware_alteon
      - haproxy
