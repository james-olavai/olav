# 📋 Vendor CLI Command Strategy
# Maps standard "intents" to vendor-specific CLI commands.

platforms:
  cisco_ios:
    intents:
      configs: ["show running-config"]
      routes: ["show ip route", "show ipv6 route"]
      bgp_neighbors: ["show ip bgp summary", "show bgp ipv4 unicast summary"]
      ospf_neighbors: ["show ip ospf neighbor", "show ospf neighbor"]
      interfaces: ["show ip interface brief", "show interfaces description"]
      cdp_neighbors: ["show cdp neighbors detail"]
      lldp_neighbors: ["show lldp neighbors detail"]
      inventory: ["show inventory"]
      version: ["show version"]
    scrapli_platform: "cisco_iosxe"

  cisco_nxos:
    intents:
      configs: ["show running-config"]
      routes: ["show ip route", "show ipv6 route"]
      bgp_neighbors: ["show bgp sessions", "show bgp ipv4 unicast summary"]
      ospf_neighbors: ["show ip ospf neighbors"]
      interfaces: ["show interface brief"]
      cdp_neighbors: ["show cdp neighbors detail"]
      lldp_neighbors: ["show lldp neighbors detail"]
      inventory: ["show inventory"]
      version: ["show version"]
    scrapli_platform: "cisco_nxos"

  huawei_vrp:
    intents:
      configs: ["display current-configuration"]
      routes: ["display ip routing-table"]
      bgp_neighbors: ["display bgp peer"]
      ospf_neighbors: ["display ospf peer"]
      interfaces: ["display ip interface brief"]
      cdp_neighbors: []
      lldp_neighbors: ["display lldp neighbor brief"]
      inventory: ["display device"]
      version: ["display version"]
    scrapli_platform: "huawei_vrp"

  juniper_junos:
    intents:
      configs: ["show configuration"]
      routes: ["show route"]
      bgp_neighbors: ["show bgp summary"]
      ospf_neighbors: ["show ospf neighbor"]
      interfaces: ["show interfaces terse"]
      cdp_neighbors: []
      lldp_neighbors: ["show lldp neighbors"]
      inventory: ["show chassis hardware"]
      version: ["show version"]
    scrapli_platform: "juniper_junos"
