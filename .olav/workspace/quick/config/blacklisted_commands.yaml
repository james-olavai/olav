# blacklisted_commands.yaml
# Commands that are PERMANENTLY BLOCKED from execution.
# blacklisted=true overrides allowed=true in the commands table.
#
# These commands are never executed by take_snapshot() or quick-Query
# regardless of what appears in allowed_commands.yaml.
#
# Format: list of command strings or {command: ...} objects.

# Sensitive configuration — contains passwords, secrets, access keys (allowed for now)
# - command: show running-config
# - command: show startup-config

# Potentially destructive / write operations
- command: write memory
- command: copy running-config startup-config

# Verbose outputs that overwhelm parsing / storage
- command: show tech-support
- command: show logging

# Debug commands — risk of high CPU usage on device
- command: debug ip ospf
- command: debug ip bgp
