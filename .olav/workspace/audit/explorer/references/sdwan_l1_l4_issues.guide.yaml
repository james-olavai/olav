body: |
  ## SD-WAN L1-L4 playbook

  Distributed branch-to-hub overlay networks.  Issues here are
  user-perceived (app SLA breaches).

  ## L1 — WAN link quality

  ### Loss / jitter / RTT outliers
  ```sql
  SELECT device_name,
         json_extract_string(parsed_data, '$[0].loss')   AS loss_pct,
         json_extract_string(parsed_data, '$[0].jitter') AS jitter_ms,
         json_extract_string(parsed_data, '$[0].latency') AS rtt_ms
  FROM netops.parsed_outputs
  WHERE command IN ('show sdwan tunnel statistics',
                    'show sdwan app-route stats');
  ```
  Thresholds (typical):
  - Voice: jitter > 30ms OR loss > 1% = unusable
  - Video: RTT > 150ms OR loss > 2% = degraded

  ### Carrier failover thrashing
  - Same site flapping between MPLS / Internet path in <5 min cycles
  - Usually = aggressive BFD timer + ISP micro-flap; tune detection
    multiplier.

  ## L3 — overlay routing

  ### IPSec tunnel / BFD up rate
  ```sql
  SELECT device_name,
         json_extract_string(parsed_data, '$[0].state') AS sa_state,
         json_extract_string(parsed_data, '$[0].peer')  AS peer
  FROM netops.parsed_outputs
  WHERE command='show crypto ipsec sa'
    AND json_extract_string(parsed_data, '$[0].state') != 'active';
  ```
  Down tunnel = site offline OR routed through hub backup = SLA hit.

  ### Hub-spoke routing asymmetry
  - Spoke can reach hub but return-path uses different hub
  - Common with dual-hub designs + uneven route preference

  ### OMP / Overlay routing health
  - vEdge missing routes from another spoke = signalling problem
  - vManage / vSmart controller reachability from each edge

  ## L4 — application SLA

  ### App-route policy drift
  - SLA class assigned to a critical app missing from some sites
  - DPI mis-classification → wrong queue / wrong tunnel

  ### Cloud on-ramp / SIG failures
  - DNS resolution drift between sites
  - Direct-internet-access policy mis-applied

  ## When recording
  - SD-WAN findings are usually site-scoped — include `site` in detail
  - Co-occurring tunnel down + app SLA breach = related findings
  - Prefer `severity=high` for any voice/video-affecting issue
