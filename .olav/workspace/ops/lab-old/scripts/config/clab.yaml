# ContainerLab skill configuration
# Auth: kept in CLAB_API_TOKEN env var (never commit credentials here)
#
# To refresh token:
#   export CLAB_API_TOKEN=$(curl -s -X POST http://192.168.100.12:8080/login \
#     -H 'Content-Type: application/json' \
#     -d '{"username":"admin","password":"admin"}' | python3 -c \
#     "import sys,json; print(json.load(sys.stdin)['token'])")

# ContainerLab REST API
api:
  server: "http://192.168.100.12:8080"
  timeout_deploy: 120     # seconds
  timeout_exec:   30
  timeout_destroy: 30

# gNMI — used to push OC config to SRL nodes (per-path, structured errors)
gnmi:
  port: 57400              # SRL default gNMI port
  encoding: "json_ietf"
  credentials:
    username: "admin"
    password: "NokiaSrl1!"   # SRL container default

# Network routing
# Agent host (192.168.100.50) reaches lab nodes via static route:
#   172.20.20.0/24 via 192.168.100.12 dev enxc84d44233ec9  ← already configured
network:
  clab_server_ip:        "192.168.100.12"
  docker_bridge_subnet:  "172.20.20.0/24"
  agent_outbound_iface:  "enxc84d44233ec9"

# Lab node management IP allocation (within docker_bridge_subnet)
mgmt:
  network_name:  "olav-mgmt"        # Docker bridge pre-created on CLAB server
  subnet:        "172.20.20.0/24"
  gateway:       "172.20.20.1"
  start_offset:  2                  # r1 → .2, r2 → .3, ...
  max_nodes:     50

# Post-change state collection commands per platform
collection:
  snapshot_id_prefix: "clab"
  commands:
    srl:
      - "show network-instance default protocols bgp neighbor"
      - "show network-instance default route-table"
      - "show system lldp neighbor"
      - "show interface"
    nokia_srl:
      - "show network-instance default protocols bgp neighbor"
      - "show network-instance default route-table"
      - "show system lldp neighbor"
      - "show interface"
    cisco_ios:
      - "show ip bgp summary"
      - "show ip route"
      - "show ip ospf neighbor detail"
      - "show lldp neighbors detail"
    cisco_iosxe:
      - "show ip bgp summary"
      - "show ip route"
      - "show ip ospf neighbor detail"
      - "show lldp neighbors detail"
    cisco_iosxr:
      - "show bgp summary"
      - "show route"
      - "show ospf neighbor detail"
      - "show lldp neighbors"
    arista_eos:
      - "show ip bgp summary"
      - "show ip route"
      - "show lldp neighbors detail"
      - "show interfaces"
    arista_ceos:
      - "show ip bgp summary"
      - "show ip route"
      - "show lldp neighbors detail"
      - "show interfaces"
    juniper_junos:
      - "show bgp summary"
