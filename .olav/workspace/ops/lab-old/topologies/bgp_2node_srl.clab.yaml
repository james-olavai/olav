name: bgp-2node-srl

# Minimal 2-node SR Linux topology for CAB digital twin OC pipeline testing.
# Both nodes are SRL (ghcr.io/nokia/srlinux) — the universal CAB simulation substrate.
# BGP eBGP peering: r1 (AS 65001) ↔ r2 (AS 65002) on ethernet-1/1.
#
# Config is injected by CABConfigExtractor (config_source: oc_agent),
# NOT by Jinja2 templates. This tests the full OC→SRL rendering pipeline.

mgmt:
  network: mgmt-srl-2node
  ipv4-subnet: 192.168.100.0/24

prefix: ""

topology:
  defaults:
    kind: nokia_srlinux
    image: ghcr.io/nokia/srlinux:latest

  nodes:
    r1:
      mgmt-ipv4: 192.168.100.110

    r2:
      mgmt-ipv4: 192.168.100.111

  links:
    - endpoints: [r1:ethernet-1/1, r2:ethernet-1/1]
