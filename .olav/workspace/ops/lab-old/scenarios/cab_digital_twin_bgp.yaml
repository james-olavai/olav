scenario: cab_digital_twin_bgp_oc
topology: topologies/bgp_2node_srl.clab.yaml

# --- OC Agent config source ---
# When config_source is oc_agent, configure_device skips Jinja2 templates and
# instead calls CABConfigExtractor.render_all_devices(change_intent, nodes).
# The extractor reads from the OLAV DuckDB (semantic views + schema_catalog),
# renders SRL set/... commands, and pushes via exec API.
config_source: oc_agent
change_intent: "Verify BGP session baseline between r1 and r2"

addressing:
  p2p_pool_v4: 10.0.0.0/24
  p2p_prefixlen_v4: 30
  loopback_pool_v4: 10.255.0.0/24

defaults:
  username: admin
  password: admin

nodes:
  r1:
    platform: nokia_srl
    configs: []  # No template configs — OC agent provides config

  r2:
    platform: nokia_srl
    configs: []

links:
  - endpoints: [r1:ethernet-1/1, r2:ethernet-1/1]

readiness:
  strategy: ssh_probe
  timeout_seconds: 120
  retry_interval_seconds: 10

# NL collection prompts — run after config is applied
queries:
  - agent: ops
    description: "Collect BGP neighbor state from both nodes"
    prompt: "从 r1,r2 采集 BGP 邻居状态和接口 IP"

  - agent: ops
    description: "Collect interface status"
    prompt: "从 r1,r2 采集所有接口的 IP 地址和状态"

# SQL count assertions — structural verification that data was collected
assertions:
  - type: sql_count
    query: >
      SELECT COUNT(DISTINCT device_name) FROM parsed_outputs
      WHERE device_name IN ('r1', 'r2')
      AND command LIKE '%bgp%'
    operator: gte
    expected: 2

  - type: sql_count
    query: >
      SELECT COUNT(*) FROM parsed_outputs
      WHERE device_name IN ('r1', 'r2')
      AND command LIKE '%interface%'
    operator: gte
    expected: 2

# NL query assertions — full agent chain test (THE core digital twin validation)
query_assertions:
  - agent: quick
    description: "BGP session Established between r1 and r2"
    prompt: "r1 和 r2 之间的 BGP session 是否 Established？"
    expect_contains: ["Established", "r1", "r2"]
    expect_not_contains: ["Idle", "Active", "没有数据", "not found"]

  - agent: quick
    description: "r1 BGP neighbor peer-as 65002"
    prompt: "r1 的 BGP 邻居 AS 号是多少？"
    expect_contains: ["65002"]
    expect_not_contains: ["没有数据", "error"]

  - agent: quick
    description: "r2 BGP neighbor peer-as 65001"
    prompt: "r2 的 BGP 邻居 AS 号是多少？"
    expect_contains: ["65001"]
    expect_not_contains: ["没有数据", "error"]

  - agent: quick
    description: "Interface IPs configured correctly"
    prompt: "r1 和 r2 的 ethernet-1/1 接口 IP 地址各是多少？"
    expect_contains: ["10.0.0"]
    expect_not_contains: ["没有配置", "not configured", "error"]

metadata:
  description: "1:1 digital twin validation: OC-derived config from DuckDB → SRL → BGP assertion"
  layers:
    - L3_routing
    - OC_config_push
  features:
    - bgp_neighbor_session
    - interface_ip_config
    - oc_agent_config_source
    - digital_twin_1_to_1
  commands_expected:
    - "show bgp summary"
    - "show interfaces"
