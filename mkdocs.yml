site_name: OLAV Platform
site_url: https://docs.olavplatform.com
site_description: AI-native platform for autonomous operations — connect any API, deploy skills, orchestrate agents.
site_author: OLAV Team
docs_dir: docs
repo_url: https://github.com/olav-ai/olav
repo_name: olav-ai/olav

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - First Query: getting-started/first-query.md
    - How It Works: getting-started/how-it-works.md
  - Guides:
    - Connect a Service: guides/connect-a-service.md
    - Creator Agent: guides/creator-agent.md
    - Build a Skill: guides/build-a-skill.md
    - Using Agents: guides/using-agents.md
    - Audit & Logs: guides/audit-and-logs.md
    - Knowledge Base: guides/knowledge-base.md
    - Core Agent Tools: guides/core-agent.md
    - Background Services: guides/services.md
    - Manage Workspace: guides/manage-workspace.md
  - Concepts:
    - Agents & Skills: concepts/agents-and-skills.md
    - Enterprise Agentic Platform: concepts/enterprise-agentic.md
    - Agent Harness: concepts/agent-harness.md
    - Security Model: concepts/security-model.md
    - Self-Improving Loop: concepts/self-improving-loop.md
  - Reference:
    - CLI: reference/cli.md
    - Configuration: reference/configuration.md
    - HTTP API: reference/http-api.md
    - Users & Roles: reference/users-and-roles.md
    - Claim Registry: reference/claim-registry.md
