[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olav"]
exclude = [
    "src/olav/enterprise/",
    "src/olav/core/schema_cache.py",
    "src/olav/platform/services/lifecycle.py",
    "src/olav/platform/services/permission_generator.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/olav/**/*.py",
    "/src/olav/data/**/*.txt",
    "/src/olav/data/**/*.md",
    "/src/olav/data/**/*.yaml",
    "/src/olav/data/**/*.json",
    "/src/olav/api/static/**",
    "/src/olav/py.typed",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/src/olav/enterprise/",
]

[project]
name = "olav"
version = "0.19.0"
description = "OLAV — AI-native platform for autonomous operations with domain-aware agents, API-as-Tool, and Agent Harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "OLAV Team"}
]
license = {text = "BSL-1.1"}
keywords = ["aiops", "agent", "langgraph", "deepagents", "agentic-platform", "api-as-tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    # LLM & Agents
    # Ceiling at langchain<1.3 / langchain-core<1.4 keeps us on the 1.2.x
    # branch — langchain 1.3.x (released 2026-05-15) is brand-new and would
    # transitively force langgraph 1.2.x.  Floor raised to >=1.2.17 because
    # deepagents 0.5.9 (our new floor) requires that.  Re-evaluate after
    # langchain 1.3.x settles upstream.
    "langchain>=1.2.17,<1.3",
    "langchain-openai>=0.0.1",
    "langchain-ollama>=0.1.0",
    "langchain-core>=1.3.2,<1.4",
    "langchain-huggingface>=0.1.0",
    # Data Processing
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # Database
    "duckdb>=0.8.0",
    "pytz>=2024.1",
    "sqlalchemy>=2.0",
    # API & HTTP
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # CLI
    "typer>=0.9.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0.0",
    "nest-asyncio>=1.5.0",
    # Utilities
    "python-dateutil>=2.8.0",
    "python-crontab>=3.0.0",
    "tenacity>=8.0",
    # DeepAgents CLI — exact pin because olav.cli.tui_overlay monkey-patches
    # private deepagents-cli internals (WelcomeBanner constants, DeepAgentsApp
    # TITLE/_handle_command, command_registry.COMMANDS).  A version mismatch
    # logs a warning and falls back to vanilla deepagents branding, but keep
    # the pin tight to minimise surprises.  Update overlay._SUPPORTED_VERSIONS
    # in the same commit as any version bump.
    "deepagents-cli==0.0.41",
    # OS keyring for CLI bearer tokens (olav.core.auth.keyring_store).  Plain
    # ~/.olav/token remains the fallback when no keyring backend is usable,
    # so headless / CI environments still work without a daemon.
    "keyring>=24",
    "langchain-community>=0.4.1",
    # Pin to 1.1.x — langgraph 1.2.0 (2026-05-12) is too new; defer until
    # langchain 1.3.x is also pinned (they evolve together).
    "langgraph>=1.1.10,<1.2",
    "duckdb-engine>=0.17.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "python-frontmatter>=1.1.0",
    # Knowledge Base & Embedding
    "lancedb>=0.29.2",
    "sentence-transformers>=5.2.3",
    # Web search (required by web_search tool via langchain DuckDuckGoSearchRun).
    # langchain-community 0.4+ migrated from `duckduckgo-search` → `ddgs`;
    # both names refer to the same library, ddgs is current.
    "ddgs>=9.0",
    # Data export (CSV/JSON formatting)
    "numpy>=2.4.1",
    "pandas>=3.0.1",
]

[project.scripts]
olav = "olav.cli.main:cli_main"

[project.urls]
Homepage = "https://github.com/olav-ai/olav"
Repository = "https://github.com/olav-ai/olav"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0",
]
# TUI optional — kept for backward compatibility; deepagents-cli is now a core dep.
tui = [
    "pyjwt>=2.12.1",
]
# Knowledge-graph backed memory (currently only guarded import in
# core/memory/knowledge_graph.py; declared optional so install-without-graph
# deployments skip this dep).
graph = [
    "networkx>=3.6.1",
]
# ``[enterprise]`` extra removed v0.21.0-rc5 (gitea #13).
#
# The extras' three deps (tink / PyJWT / netutils) were only imported by
# ``src/olav/enterprise/*.py``, which is **excluded from the wheel**
# (see ``[tool.hatch.build.targets.wheel].exclude`` and
# ``[tool.hatch.build.targets.sdist].exclude`` above).  Installing
# ``olav[enterprise]`` therefore pulled three packages that never got a
# chance to load because the modules using them were not shipped.
#
# The authoritative home for enterprise features is the ``olav-ent``
# package, whose ``pyproject.toml`` declares the same deps against the
# real consumer at ``olav-ent/src/olav/enterprise/``.  Users who want
# encryption / LDAP / dataset export should ``pip install olav-ent``;
# the platform ``olav`` package does not vendor anything enterprise.
ldap = [
    "ldap3>=2.9",
]
# Collection-time credential redaction (network-config aware).  netconan
# is ~50KB pure Python from the Batfish/Intentionet team — knows IOS /
# IOS-XR / NX-OS / Junos / EOS config syntax for passwords / SNMP
# communities / RADIUS / TACACS / IPSec PSK / BGP MD5 etc.  Scrubs
# credentials but preserves IP / hostname / ASN / topology relationships
# so diff and diagnostic analysis still work on the redacted output.
# See ``src/olav/core/redaction.py`` + ADR-0008 (forthcoming).
redaction = [
    "netconan>=0.13",
]
# R66f cleanup: removed vestigial extras that had zero usage in ``src/olav/``
# and were also declared as hard deps in the ``olav-netops`` package:
#   pdf    — PyPDF2/pdfplumber: 0 importers in platform code.
#   netops — textfsm/ntc-templates: 0 importers; networkx moved to [graph].
#   audit  — scikit-learn/scipy/ruptures: 0 importers; olav-netops owns these.
#   gnmi   — pygnmi: 0 importers.
# If your deployment needs these, install ``olav-netops`` which declares
# them as required dependencies.

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-awesome-pages-plugin>=2.9",
    "mkdocs-static-i18n>=1.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-timeout>=2.4.0",
    "pyright>=1.1.408",
    # Enterprise optional deps needed for unit tests
    "tink>=1.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "archive",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "ASYNC", "S", "B"]
ignore = ["E402", "E501", "ANN", "ASYNC", "S", "F401"]  # E402: Module level import not at top of file, E501: line length in docstrings

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S608"]
"src/olav/cli/main.py" = ["F401", "W291"]
"src/olav/core/memory/__init__.py" = ["F401"]  # S608: SQL injection false positive in tests
"src/olav/cli/cli_main.py" = ["E402", "ANN401", "S602", "S112"]
"src/olav/core/settings.py" = ["ANN401"]
"config/settings.py" = ["ANN401"]
"src/olav/core/llm.py" = ["ANN401"]
"src/olav/agents/query_agent.py" = ["ANN401"]
"src/olav/cli/display.py" = ["ANN401"]
"src/olav/cli/input_parser.py" = ["S602"]
"src/olav/services/gnmi_collector.py" = ["N816"]
"src/olav/core/database.py" = ["W291", "W293"]
".olav/workspace/**/*.py" = ["ANN201", "ANN001"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pyright]
typeCheckingMode = "standard"
exclude = [
    "_legacy_archived",
    "archive",
    ".venv",
    ".agent",
    ".olav",
    "tmp",
    "olav-ent",
    "olav-netops",
    "demo_watermark.py",
]
reportMissingImports = "warning"  # Downgrade missing imports to warnings (external deps)
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportOptionalCall = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportAttributeAccessIssue = "warning"
# Additional downgrades for less critical issues
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportIndexIssue = "warning"
reportCallIssue = "warning"
reportPossiblyUnboundVariable = "warning"
# Downgrade more errors to warnings for legacy code
reportArgumentType = "warning"
reportUndefinedVariable = "warning"
reportUnboundVariable = "warning"
reportIncompatibleMethodOverride = "warning"
# Ignore specific error patterns
reportGeneralTypeIssues = "warning"
reportRedeclaration = "warning"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "olav-netops/src"]
# Run notes:
#   Default: pytest tests/                     (all tests, no LLM/network needed)
#   E2E CLI:  pytest tests/e2e/test_cli.py     (subprocess, no LLM)
#   LLM:      pytest tests/ -m llm             (requires LLM_API_KEY)
#   Network:  pytest tests/ -m e2e             (requires real devices)
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "e2e: End-to-end tests (requires real devices)",
    "llm: Tests requiring real LLM API calls",
    "network: Tests requiring network device access",
    "slow: Slow-running tests",
    "integration: Integration tests (requires live CLAB/network services)",
]
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/olav"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.uv]
# deepagents-cli==0.0.41 is a core dependency (see pyproject.toml [project.dependencies]).
# We override the deepagents library independently so we can pick up library-side
# fixes without touching the cli (the cli is monkey-patched in
# src/olav/cli/tui_overlay.py and is therefore exact-pinned).
#
# Floor at 0.5.9 (2026-05-10) brings in:
#   * FilesystemPermission (0.5.2) — activates the virtual-FS write guard in
#                                    src/olav/agents/agent.py:576-612 (currently
#                                    falls back silently on 0.5.1).
#   * Harness Profiles    (0.5.4) — per-provider prompt/middleware overrides.
#   * Auto-GP-subagent permission inheritance (0.5.7).
#   * CompiledSubAgent name propagation to lc_agent_name (0.5.6).
# Ceiling <0.6 skips the experimental CodeInterpreterMiddleware + v3 stream_events
# (0.6.0, 2026-05-12) — re-evaluate after upstream stabilises.
override-dependencies = [
    "deepagents>=0.5.9,<0.6",
]
