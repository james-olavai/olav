[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olav"]
exclude = [
    # Enterprise units (olav.enterprise.*, incl. the web API + daemon) ship
    # from olav-ent, never the OSS wheel — dev_docs/111 tiered model.
    "src/olav/enterprise/",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/olav/**/*.py",
    "/src/olav/data/**/*.txt",
    "/src/olav/data/**/*.md",
    "/src/olav/data/**/*.yaml",
    "/src/olav/data/**/*.json",
    "/src/olav/py.typed",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/src/olav/enterprise/",
]

[project]
name = "olav"
version = "0.25.1"
description = "OLAV — AI-native platform for autonomous operations with domain-aware agents, API-as-Tool, and Agent Harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "OLAV Team"}
]
license = {text = "BSL-1.1"}
keywords = ["aiops", "agent", "langgraph", "deepagents", "agentic-platform", "api-as-tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    # LLM & Agents
    # v0.20 (2026-06-01): upgraded to langchain 1.3.x / langchain-core 1.4.x
    # to satisfy deepagents 0.6.7's langchain-core>=1.4.0 requirement.
    # TodoListMiddleware moved from deepagents → langchain.agents.middleware in 0.6.x.
    "langchain>=1.3.0,<1.4",
    "langchain-openai>=0.0.1",
    # Required by the first-run provider selector's "Anthropic (Claude)" option
    # (cli/llm_setup.py writes model_provider="anthropic", which langchain's
    # init_chat_model backs with this package).  All other selector providers
    # are OpenAI-compatible and covered by langchain-openai above.
    "langchain-anthropic>=0.1.0",
    # Required by core/llm.py's Google AI Studio branch, which imports
    # ChatGoogleGenerativeAI directly (init_chat_model loses thinking_level).
    # Declared because that import previously relied on a THIRD-ORDER
    # transitive — deepagents-code -> deepagents-acp -> deepagents — of a
    # package we already upper-bound (<0.1.17); the day it stops carrying
    # langchain-google-genai, the Google provider path ImportErrors. It brings
    # the raw `google-genai` SDK itself, which is why that is no longer listed
    # here (nothing in src/olav imports `google.genai` directly).
    "langchain-google-genai>=4.2",
    "langchain-ollama>=0.1.0",
    # ── Per-provider drivers (2026-08-04) ─────────────────────────────────────
    # First-class provider selection rather than "everything is OpenAI-compatible
    # + base_url". That shim is a spectrum, not a binary: DeepSeek's strict schema
    # validation only works against its **beta** endpoint, which ChatDeepSeek
    # switches to (`model_copy(update={"api_base": ".../beta"})`) and a plain
    # ChatOpenAI cannot reach. Since strict schema enforcement is the protocol-layer
    # fix for malformed tool-call args — exactly what CLAUDE.md says must be solved
    # at the coercion layer rather than with prompt imperatives — losing it is not
    # a cosmetic loss.
    #
    # llm.py already *inferred* these providers from base_url without the packages
    # being declared, so `api.deepseek.com` in api.json raised ImportError inside
    # init_chat_model. Same defect class as langchain-google-genai above.
    #
    # Cost measured on an isolated venv over a langchain-openai baseline:
    #   deepseek +0MB  together +0MB  groq +1MB  perplexity +1MB
    #   openrouter +6MB  xai +10MB (aiohttp, already present here)
    # deepseek/xai/together are thin BaseChatOpenAI subclasses — they reuse
    # langchain-openai, which is why they are free.
    #
    # langchain-mistralai is NOT here: +28MB, because it pulls `tokenizers` back
    # in — the same 11MB this release just moved behind `[local-embed]`. It lives
    # in the `[mistral]` extra instead; see the wizard's handling.
    "langchain-deepseek>=1.1",
    "langchain-xai>=1.3",
    "langchain-together>=0.4",
    "langchain-groq>=1.1",
    "langchain-perplexity>=1.4",
    "langchain-openrouter>=0.2.7",
    "langchain-core>=1.4.0,<2.0",
    # NOTE: langchain-huggingface moved to `[local-embed]` (2026-08-04) — it is
    # the sole parent of tokenizers + huggingface-hub + hf-xet (26 MB measured)
    # and its only consumer is core/router.py's `mode == "local"` branch.
    # Data Processing
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Database
    "duckdb>=0.8.0",
    # DO NOT REMOVE because "nothing imports pytz" — duckdb imports it
    # **dynamically from its C extension** for timezone handling, and duckdb
    # declares no dependencies of its own (`Requires:` is empty), so nobody
    # else will pull it. Dropping it in the 2026-08-04 audit produced
    # `_duckdb.InvalidInputException: Required module 'pytz' failed to import`
    # in the auth expiry tests — a static grep for `import pytz` cannot see
    # this, only the test suite can.
    "pytz>=2024.1",
    # API & HTTP
    "httpx>=0.24.0",
    # NOTE: fastapi was removed here — the only direct importer (the web API's
    # custom_router) moved to olav-ent (olav.enterprise.api). langgraph dev uses
    # starlette via langgraph-api, not fastapi. uvicorn stays: langgraph-api
    # pulls it and langgraph dev serves through it.
    "uvicorn[standard]>=0.27.0",
    # CLI — the CLI is argparse-based (cli/main.py); `typer` was declared but
    # never imported anywhere in the repo, so it is gone (2026-08-04 audit).
    "rich>=13.0",
    "prompt-toolkit>=3.0.0",
    # Utilities
    "python-crontab>=3.0.0",
    "tenacity>=8.0",
    # DeepAgents interactive REPL/TUI — 2026-06-03: migrated from the old
    # `deepagents-cli==0.0.41` to `deepagents-code`.  The deepagents ecosystem
    # split: `deepagents-cli` (now 0.2.x) is deploy/init/agents-only and HARD-
    # PINS `deepagents==0.5.3` (incompatible with our deepagents>=0.6.7 → made
    # `pip install olav` ResolutionImpossible for non-uv users).  The
    # interactive REPL/TUI that olav.cli.{main,tui_overlay} integrate with moved
    # to `deepagents-code`, which requires `deepagents==0.6.7` (matches us) and
    # still exposes the internals we monkey-patch (config.SessionState,
    # app.run_textual_app/DeepAgentsApp, command_registry.COMMANDS, banners,
    # server_manager, server.generate_langgraph_json).  olav.cli.tui_overlay
    # monkey-patches these private internals; on a version mismatch it logs a
    # warning and falls back to vanilla branding.  Update
    # overlay._SUPPORTED_VERSIONS in the same commit as any bump.
    #
    # UPPER BOUND (2026-07-17): deepagents-code 0.1.17 DELETED
    # `config.SessionState` (we import it in cli/main.py for interactive mode).
    # It survives only through 0.1.16.  Without this cap a fresh `pip install
    # olav` resolves to the latest (0.1.41) and dies with `cannot import name
    # 'SessionState'` at first interactive run — masked by editable installs
    # that already had an older wheel.  Do NOT widen the upper bound until
    # cli/main.py is ported to the post-0.1.17 session API (Settings dataclass).
    "deepagents-code>=0.1.8,<0.1.17",
    # OS keyring for CLI bearer tokens (olav.core.auth.keyring_store).  Plain
    # ~/.olav/token remains the fallback when no keyring backend is usable,
    # so headless / CI environments still work without a daemon.
    "keyring>=24",
    "langchain-community>=0.4.1",
    # v0.20 (2026-06-01): upgraded to langgraph 1.2.x alongside langchain 1.3.x +
    # langchain-core 1.4.x to satisfy deepagents 0.6.7 requirements.
    "langgraph>=1.2.0,<1.3",
    # Native langgraph_api server (replaces custom server.py, v0.11.0+).
    # inmem runtime used; no Postgres/Redis required.
    "langgraph-api>=0.7.100",
    "langgraph-runtime-inmem>=0.27.3",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "python-frontmatter>=1.1.0",
    # Knowledge Base & Embedding.
    # 2026-06-03: use the `[pylance]` extra — lancedb >=0.30 no longer auto-installs
    # the standalone `lance` (pylance) lib, but KB/UKS dataset ops (compaction,
    # merge_insert, to_lance) need it ("the lance library is required … pip install
    # pylance").  The extra lets lancedb pin the pylance build matching its own
    # version, instead of us hard-coding a floor that drifts.  Caught by demo
    # fresh-wheel e2e (dev_docs/104 cat C); editable dev had pylance transitively.
    "lancedb[pylance]>=0.29.2",
    # NOTE: sentence-transformers moved to the `[local-embed]` extra (2026-08-04).
    # It is the ONLY consumer of torch/triton/transformers in the core wheel, and
    # on linux-x86_64 PyPI's default torch is the CUDA build — it drags in the
    # whole nvidia-* runtime for what is a fallback path most installs never use.
    # (`EmbeddingConfig.mode` had defaulted to "local" while every doc claimed
    # "api" — flipped to "api" in the same change; see core/config.py.)
    # The single import site is
    # a function-local `from sentence_transformers import SentenceTransformer`
    # inside `core/embedder.py:get_embedder()`, reached only when
    # `embedding.mode == "local"`, so removing it from the default install costs
    # nothing until someone actually selects local mode — at which point the
    # import raises with an actionable message pointing at the extra.
    #
    # Precedent: `core/memory/reranker.py` already refuses the LanceDB-native
    # CrossEncoderReranker for exactly this reason ("adds 600+ MB of optional ML
    # deps to OLAV's wheel") and talks to the reranker model over HTTP instead.
    # This change applies that same decision to the embedder.
    #
    # Offline / air-gapped deployments: `pip install olav[local-embed]`.
    # Web search (required by web_search tool via langchain DuckDuckGoSearchRun).
    # langchain-community 0.4+ migrated from `duckduckgo-search` → `ddgs`;
    # both names refer to the same library, ddgs is current.
    "ddgs>=9.0",
    # numpy: imported by core/memory/reranker.py, and required by lancedb +
    # langchain-community regardless.
    "numpy>=2.4.1",
    # pandas STAYS core (42 MB) despite only three `import pandas` statements,
    # all of them behind ImportError fallbacks. The audit's first pass proposed
    # an `[export]` extra and was wrong: the real dependency is the
    # **`to_pandas()` API surface** of lancedb/pyarrow, used in
    # cli/commands/kb.py, core/memory/migrate.py, core/auditor/query_preview.py
    # and audit-author/scripts/test_map_query.py. Those sites sit in
    # `except Exception` blocks, so nothing crashes — they just fail with a
    # misleading message ("Failed to read knowledge store"), which is the silent
    # degradation this codebase keeps paying for. Moving pandas out requires
    # porting those reads to pyarrow-native first.
    "pandas>=3.0.1",
    # ── Removed by the 2026-08-04 dependency audit ────────────────────────────
    # Each had ZERO references anywhere in the repo (all file types, all
    # sub-packages, tests included) — verified with `uv pip tree --invert` for
    # whether removal actually uninstalls the package or it merely stops being
    # declared twice:
    #   typer, pydantic-settings, nest-asyncio, python-dateutil,
    #   requests, sqlalchemy, duckdb-engine
    # Only nest-asyncio / duckdb-engine actually leave the install (~0.5 MB);
    # the rest arrive via langchain-community / deepagents-code / croniter
    # anyway, so dropping them is declaration hygiene, not size.
    # (pytz was on this list and had to be put back — see its comment above.
    #  "no import statement" is not evidence of "unused" when a C extension
    #  can import it at runtime.)
    # Specifically checked before removing sqlalchemy + duckdb-engine: there is
    # no `SQLDatabase`, no `create_engine`, and no `duckdb:///` URL anywhere —
    # they were not powering `execute_sql`, which uses the duckdb driver
    # directly.
    #
    # textfsm -> [dependency-groups] dev (only tests/unit/
    # test_textfsm_gap_templates.py imports it; olav-netops declares its own).
    # ntc-templates -> dropped (4.2 MB; only olav-netops' workspace uses it,
    # and olav-netops declares it).
    # pandas -> `[export]` extra (42 MB; both consumers already degrade on
    # ImportError — see the extra's comment below).
]

[project.scripts]
olav = "olav.cli.main:cli_main"

[project.urls]
Homepage = "https://olavai.com"
Documentation = "https://docs.olavai.com"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0",
]
# TUI optional — kept for backward compatibility; deepagents-cli is now a core dep.
tui = []
# On-CPU embedding via SentenceTransformer (`embedding.mode = "local"`).
# Needed only for offline / air-gapped installs and for CI jobs that cannot
# reach an embedding endpoint.  Kept OUT of the default install because it is
# the sole reason torch/triton/transformers (+ the nvidia CUDA runtime on
# linux-x86_64) land in the wheel — see the note beside `lancedb` above.
# Mistral: kept out of the default install because langchain-mistralai pulls
# `tokenizers` (+28MB total), undoing part of the same release's slimming. The
# first-run wizard offers Mistral and reports this exact install command when the
# driver is absent — the pattern that fixed the on-CPU-embed trap, rather than
# offering a choice the install cannot honour.
mistral = [
    "langchain-mistralai>=1.1",
]
local-embed = [
    "sentence-transformers>=5.2.3",
    # core/router.py's `mode == "local"` branch builds HuggingFaceEmbeddings
    # from this package. Sole parent of tokenizers + huggingface-hub + hf-xet
    # (26 MB measured), and useless without sentence-transformers anyway, so it
    # belongs here rather than in the default install. router.py falls back to
    # langchain_community.embeddings if it is absent, and imports it INSIDE the
    # local branch so api mode never touches it.
    "langchain-huggingface>=0.1.0",
]
# NOTE: an `[export]` extra for pandas was proposed and rejected in the
# 2026-08-04 audit — pandas is load-bearing via lancedb/pyarrow's `to_pandas()`,
# not just the three `import pandas` statements. See its comment in
# [project.dependencies].
# Knowledge-graph backed memory (currently only guarded import in
# core/memory/knowledge_graph.py; declared optional so install-without-graph
# deployments skip this dep).
graph = [
    "networkx>=3.6.1",
]
# ``[enterprise]`` extra removed v0.21.0-rc5 (gitea #13).
#
# The extras' three deps (tink / PyJWT / netutils) were only imported by
# ``src/olav/enterprise/*.py``, which is **excluded from the wheel**
# (see ``[tool.hatch.build.targets.wheel].exclude`` and
# ``[tool.hatch.build.targets.sdist].exclude`` above).  Installing
# ``olav[enterprise]`` therefore pulled three packages that never got a
# chance to load because the modules using them were not shipped.
#
# The authoritative home for enterprise features is the ``olav-ent``
# package, whose ``pyproject.toml`` declares the same deps against the
# real consumer at ``olav-ent/src/olav/enterprise/``.  Users who want
# encryption / LDAP / dataset export should ``pip install olav-ent``;
# the platform ``olav`` package does not vendor anything enterprise.
# (The [ldap] extra was removed alongside ldap3 — the ldap_provider moved to
# olav-ent/olav.enterprise.auth, which owns the ldap3 dependency now.)
# Collection-time credential redaction (network-config aware).  netconan
# is ~50KB pure Python from the Batfish/Intentionet team — knows IOS /
# IOS-XR / NX-OS / Junos / EOS config syntax for passwords / SNMP
# communities / RADIUS / TACACS / IPSec PSK / BGP MD5 etc.  Scrubs
# credentials but preserves IP / hostname / ASN / topology relationships
# so diff and diagnostic analysis still work on the redacted output.
# See ``src/olav/core/redaction.py`` + ADR-0008 (forthcoming).
redaction = [
    "netconan>=0.13",
]
# R66f cleanup: removed vestigial extras that had zero usage in ``src/olav/``
# and were also declared as hard deps in the ``olav-netops`` package:
#   pdf    — PyPDF2/pdfplumber: 0 importers in platform code.
#   netops — textfsm/ntc-templates: 0 importers; networkx moved to [graph].
#   audit  — scikit-learn/scipy/ruptures: 0 importers; olav-netops owns these.
#   gnmi   — pygnmi: 0 importers.
# If your deployment needs these, install ``olav-netops`` which declares
# them as required dependencies.

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-awesome-pages-plugin>=2.9",
    "mkdocs-static-i18n>=1.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-timeout>=2.4.0",
    "pyright>=1.1.408",
    # Enterprise optional deps needed for unit tests
    "tink>=1.14.1",
    "playwright>=1.59.0",
    # Test-only: tests/unit/test_textfsm_gap_templates.py imports textfsm
    # directly. It was a core runtime dep despite zero importers in src/olav —
    # olav-netops, the only production consumer, declares its own.
    "textfsm>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "archive",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "ASYNC", "S", "B"]
ignore = ["E402", "E501", "ANN", "ASYNC", "S"]  # E402: module-level import not at top; E501: line length in docstrings

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S608"]
"src/olav/cli/main.py" = ["F401", "W291"]
"src/olav/core/memory/__init__.py" = ["F401"]  # S608: SQL injection false positive in tests
"src/olav/cli/cli_main.py" = ["E402", "ANN401", "S602", "S112"]
"src/olav/core/settings.py" = ["ANN401"]
"config/settings.py" = ["ANN401"]
"src/olav/core/llm.py" = ["ANN401"]
"src/olav/agents/query_agent.py" = ["ANN401"]
"src/olav/cli/display.py" = ["ANN401"]
"src/olav/cli/input_parser.py" = ["S602"]
"src/olav/services/gnmi_collector.py" = ["N816"]
"src/olav/core/database.py" = ["W291", "W293"]
".olav/workspace/**/*.py" = ["ANN201", "ANN001"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pyright]
typeCheckingMode = "standard"
exclude = [
    "_legacy_archived",
    "archive",
    ".venv",
    ".agent",
    ".olav",
    "tmp",
    "olav-ent",
    "olav-netops",
    "demo_watermark.py",
]
reportMissingImports = "warning"  # Downgrade missing imports to warnings (external deps)
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportOptionalCall = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportAttributeAccessIssue = "warning"
# Additional downgrades for less critical issues
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportIndexIssue = "warning"
reportCallIssue = "warning"
reportPossiblyUnboundVariable = "warning"
# Downgrade more errors to warnings for legacy code
reportArgumentType = "warning"
reportUndefinedVariable = "warning"
reportUnboundVariable = "warning"
reportIncompatibleMethodOverride = "warning"
# Ignore specific error patterns
reportGeneralTypeIssues = "warning"
reportRedeclaration = "warning"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "src", "olav-netops/src"]
# Run notes:
#   Default: pytest tests/                     (all tests, no LLM/network needed)
#   E2E CLI:  pytest tests/e2e/test_cli.py     (subprocess, no LLM)
#   LLM:      pytest tests/ -m llm             (requires LLM_API_KEY)
#   Network:  pytest tests/ -m e2e             (requires real devices)
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "e2e: End-to-end tests (requires real devices)",
    "llm: Tests requiring real LLM API calls",
    "network: Tests requiring network device access",
    "slow: Slow-running tests",
    "integration: Integration tests (requires live CLAB/network services)",
]
timeout = 360
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/olav"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.uv]
# deepagents-cli==0.0.41 is a core dependency (see pyproject.toml [project.dependencies]).
# We override the deepagents library independently so we can pick up library-side
# fixes without touching the cli (the cli is monkey-patched in
# src/olav/cli/tui_overlay.py and is therefore exact-pinned).
#
# v0.20 (2026-06-01): upgraded to 0.6.7. Key additions over 0.5.9:
#   * RubricMiddleware (0.6.5) — self-eval + auto-retry for coverage contracts
#   * DeepAgentState / state_schema (0.6.6) — typed cross-call state
#   * ContextHubBackend (0.6.6) — Git-versioned memory backend
#   * DeltaChannel via langgraph (referenced in graph.py)
#   * TodoListMiddleware moved from deepagents → langchain.agents.middleware
# Ceiling <0.7 to isolate from future major-version breaking changes.
override-dependencies = [
    "deepagents>=0.6.7,<0.7",
]
