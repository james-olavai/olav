[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olav", "config"]

[project]
name = "olav"
version = "0.11.0"
description = "OLAV - Network Operations AI Assistant with DeepAgents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "OLAV Team"}
]
license = {text = "MIT"}

dependencies = [
    # LLM & Agents
    "langchain>=0.1.0",
    "langchain-openai>=0.0.1",
    "langchain-ollama>=0.1.0",
    "langchain-core>=0.1.0",
    # DeepAgents Framework
    # Note: Will be added from archive/deepagents/
    # Data Processing
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # Database
    "duckdb>=0.8.0",
    "pytz>=2024.1",
    "sqlalchemy>=2.0",
    # API & HTTP
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # CLI
    "typer>=0.9.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0.0",
    "nest-asyncio>=1.5.0",
    # Utilities
    "python-dateutil>=2.8.0",
    "python-crontab>=3.0.0",
    "tenacity>=8.0",
    "deepagents",
    "deepagents-cli",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.8",
    "duckdb-engine>=0.17.0",
    "langgraph-checkpoint-duckdb>=2.0.2",
    "python-frontmatter>=1.1.0",
    "pytest-timeout>=2.4.0",
    # Knowledge Base & Document Processing
    "PyPDF2>=3.0.0",
    "duckduckgo-search>=3.0.0",
    "lancedb>=0.29.2",
    "netutils>=1.17.1",
    "networkx>=3.6.1",
    "pdfplumber>=0.11.9",
    "sentence-transformers>=5.2.3",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "ruptures>=1.1.10",
    "numpy>=2.4.1",
    "pandas>=3.0.1",
    "ddgs>=9.11.4",
    # Enterprise - Dataset Encryption
    "tink>=1.14.1",
    # Enterprise - One-Time Token Control
    "PyJWT>=2.8.0",
]

[project.scripts]
olav = "olav.cli.main:cli_main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0",
]
# netops optional is intentionally empty — nornir/netmiko moved to olav-netops package.
# Install olav-netops to get full network operations support:
#   pip install olav-netops  (includes nornir, nornir-netmiko, netutils, networkx)
netops = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-timeout>=2.4.0",
    "pyright>=1.1.408",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "archive",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "ASYNC", "S", "B"]
ignore = ["E402", "E501", "ANN", "ASYNC", "S", "F401"]  # E402: Module level import not at top of file, E501: line length in docstrings

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S608"]
"src/olav/cli/main.py" = ["F401", "W291"]
"src/olav/core/memory/__init__.py" = ["F401"]  # S608: SQL injection false positive in tests
"src/olav/cli/cli_main.py" = ["E402", "ANN401", "S602", "S112"]
"src/olav/core/settings.py" = ["ANN401"]
"config/settings.py" = ["ANN401"]
"src/olav/core/llm.py" = ["ANN401"]
"src/olav/agents/query_agent.py" = ["ANN401"]
"src/olav/cli/display.py" = ["ANN401"]
"src/olav/cli/input_parser.py" = ["S602"]
"src/olav/core/database.py" = ["W291", "W293"]
".olav/workspace/**/*.py" = ["ANN201", "ANN001"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pyright]
typeCheckingMode = "standard"
reportMissingImports = "warning"  # Downgrade missing imports to warnings (external deps)
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportOptionalCall = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportAttributeAccessIssue = "warning"
# Additional downgrades for less critical issues
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportIndexIssue = "warning"
reportCallIssue = "warning"
reportPossiblyUnboundVariable = "warning"
# Downgrade more errors to warnings for legacy code
reportArgumentType = "warning"
reportUndefinedVariable = "warning"
reportUnboundVariable = "warning"
reportIncompatibleMethodOverride = "warning"
# Ignore specific error patterns
reportGeneralTypeIssues = "warning"
reportRedeclaration = "warning"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Run notes:
#   Default: pytest tests/                     (all tests, no LLM/network needed)
#   E2E CLI:  pytest tests/e2e/test_cli.py     (subprocess, no LLM)
#   LLM:      pytest tests/ -m llm             (requires LLM_API_KEY)
#   Network:  pytest tests/ -m e2e             (requires real devices)
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "e2e: End-to-end tests (requires real devices)",
    "llm: Tests requiring real LLM API calls",
    "network: Tests requiring network device access",
    "slow: Slow-running tests",
]
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/olav"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.uv.workspace]
members = [
    "_legacy_archived/archive_v0_to_v0.11/deepagents/libs/deepagents",
    "_legacy_archived/archive_v0_to_v0.11/deepagents/libs/deepagents-cli",
]

[tool.uv.sources]
deepagents = { workspace = true }
deepagents-cli = { workspace = true }
