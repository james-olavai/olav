[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olav", "config"]

[project]
name = "olav"
version = "0.9.8"
description = "OLAV - Network Operations AI Assistant with DeepAgents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "OLAV Team"}
]
license = {text = "MIT"}

dependencies = [
    # LLM & Agents
    "langchain>=0.1.0",
    "langchain-openai>=0.0.1",
    "langchain-ollama>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-text-splitters>=0.2.0", # Phase 4: Knowledge base text chunking
    # DeepAgents Framework
    # Note: Will be added from archive/deepagents/
    # Data Processing
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # Database
    "duckdb>=0.8.0",
    "sqlalchemy>=2.0",
    # Network Tools
    "nornir>=3.3.0",
    "nornir-netmiko>=0.1.1",
    # API & HTTP
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "fastapi>=0.109.0",  # Phase 5: Health check & metrics API
    "uvicorn[standard]>=0.27.0",  # Phase 5: ASGI server
    # CLI
    "typer>=0.9.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0.0", # Phase 6: Enhanced CLI input
    "nest-asyncio>=1.5.0", # Async context support for prompt-toolkit
    # Utilities
    "python-dotenv>=1.0",
    "python-dateutil>=2.8.0",
    "python-crontab>=3.0.0",  # Cron management for inspection scheduling
    "tenacity>=8.0",  # Retry logic with exponential backoff
    "deepagents",
    "langchain-community>=0.4.1",
    "ddgs>=9.10.0",  # DuckDuckGo web search for Expert Agent
    # Topology visualization
    "networkx>=3.0",
    "pyvis>=0.3.0",
    "nornir-scrapli>=2025.1.30",
    "scrapli>=2025.1.30",
    "scrapli-community>=2025.1.30",
    "langgraph>=1.0.5",
    "duckdb-engine>=0.17.0",
    "langgraph-checkpoint-duckdb>=2.0.2",
]

[project.scripts]
olav = "olav.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-timeout>=2.4.0",
    "pyright>=1.1.408",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "archive",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "ASYNC", "S", "B"]
ignore = ["E402", "E501"]  # E402: dotenv loading, E501: line length in docstrings

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S608"]  # S608: SQL injection false positive in tests
"src/olav/__main__.py" = ["E402"]
"src/olav/main.py" = ["E402"]
"src/olav/cli/cli_main.py" = ["E402", "ANN401", "S602", "S112"]
"src/olav/core/settings.py" = ["ANN401"]
"config/settings.py" = ["ANN401"]
"src/olav/core/llm.py" = ["ANN401"]
"src/olav/agents/intent_agent.py" = ["ANN401"]  # Dynamic typing in agent functions
"src/olav/agents/orchestrator.py" = ["ANN401"]  # Agent wrapper dynamic types
"src/olav/agents/query_agent_v2.py" = ["ANN401"]  # Dynamic result types
"src/olav/agents/query_agent.py" = ["ANN401"]  # Dynamic data synthesis
"src/olav/agents/subagent_pool.py" = ["ANN401"]  # Agent factory returns Any
"src/olav/agents/agent_enhancements.py" = ["ANN401"]  # Dynamic tool execution types
"src/olav/agents/analyzer.py" = ["ANN401"]  # Dynamic tool execution types
"src/olav/cli/display.py" = ["ANN401"]  # Dynamic JSON data
"src/olav/tools/react_agent.py" = ["ANN401"]  # **kwargs dynamic types
"src/olav/cli/input_parser.py" = ["S602"]
"src/olav/tools/task_tools.py" = ["ANN401"]  # Middleware returns dynamic type
"src/olav/tools/network_executor.py" = ["E501"]  # Docstring line length
".olav/commands/*.py" = ["ANN201", "ANN001"]
# Topology modules
"src/olav/tools/topology_graph.py" = ["E501"]  # Docstring line length
"src/olav/tools/topology_tools.py" = ["E501", "ANN401"]  # Docstring line length, Any type
"src/olav/tools/topology_viz.py" = ["E501"]  # Docstring line length
"tests/unit/test_topology*.py" = ["S101", "ANN"]  # Test files
"tests/integration/test_topology*.py" = ["S101", "ANN"]  # Integration tests
"tests/e2e/test_topology*.py" = ["S101", "ANN"]  # E2E tests
# New Map-Reduce modules
"src/olav/tools/sync_tools.py" = ["E501", "E402", "S603", "S607", "S110"]  # Exception handling
"src/olav/tools/event_tools.py" = ["E501"]
"src/olav/tools/map_tools.py" = ["E501"]
"src/olav/core/llm_interface.py" = ["E501"]
"src/olav/core/map_scheduler.py" = ["E501", "E741"]
# Database and analysis modules - SQL trailing whitespace is intentional for readability
"src/olav/analysis/macro_analyzer.py" = ["W291", "ANN"]  # SQL formatting, context manager types
"src/olav/core/unified_database.py" = ["W291", "ANN", "S110", "S608"]  # SQL formatting
"src/olav/core/database.py" = ["W291", "W293"]  # SQL formatting
"src/olav/core/field_mappings.py" = ["W293", "S110"]  # Docstring formatting
"src/olav/core/normalized_models.py" = ["W293"]  # Docstring formatting
"src/olav/tools/data_importer.py" = ["W291"]  # SQL formatting

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pyright]
typeCheckingMode = "standard"
reportMissingImports = "warning"  # Downgrade missing imports to warnings (external deps)
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportOptionalCall = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportAttributeAccessIssue = "warning"
# Additional downgrades for less critical issues
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportIndexIssue = "warning"
reportCallIssue = "warning"
reportPossiblyUnboundVariable = "warning"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/unit", "tests/e2e"]  # Enable E2E tests by default
# Note: E2E tests require real API/device access. Run explicitly:
#   pytest tests/e2e/ --timeout=120  
# Integration tests:
#   pytest tests/integration/ -m integration
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/olav",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=70",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "e2e: End-to-end tests (slow, requires real devices/LLM)",
    "integration: Integration tests (requires external services)",
    "llm: Tests requiring real LLM API calls",
    "network: Tests requiring network device access",
    "slow: Slow-running tests",
    "manual: Manual tests requiring interactive setup",
]
asyncio_mode = "auto"
timeout = 300  # 300 second timeout for complex E2E tests
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/olav"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
