[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olav"]
include = [
    "src/olav/data/**/*.txt",
    "src/olav/data/**/*.md",
    "src/olav/data/**/*.yaml",
    "src/olav/data/**/*.py",
]
exclude = [
    "src/olav/enterprise/",
    "src/olav/core/schema_cache.py",
    "src/olav/platform/services/lifecycle.py",
    "src/olav/platform/services/permission_generator.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/olav/**/*.py",
    "/src/olav/data/**/*.txt",
    "/src/olav/api/static/**",
    "/src/olav/py.typed",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/src/olav/enterprise/",
]

[project]
name = "olav"
version = "0.13.1"
description = "OLAV — AI-native platform for autonomous operations with domain-aware agents, API-as-Tool, and Agent Harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "OLAV Team"}
]
license = {text = "BSL-1.1"}
keywords = ["aiops", "agent", "langgraph", "deepagents", "agentic-platform", "api-as-tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    # LLM & Agents
    "langchain>=0.1.0",
    "langchain-openai>=0.0.1",
    "langchain-ollama>=0.1.0",
    "langchain-core>=0.1.0",
    # DeepAgents Framework
    # Note: deepagents-cli has a dep conflict with langgraph-checkpoint-duckdb
    # (langgraph-checkpoint version requirements are mutually exclusive for >=0.0.15).
    # Install separately after uv sync:
    #   uv pip install deepagents-cli --no-deps && uv pip install markdownify
    # olav-ent is a Milestone 3 private package — NOT installed here.
    # Data Processing
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # Database
    "duckdb>=0.8.0",
    "pytz>=2024.1",
    "sqlalchemy>=2.0",
    # API & HTTP
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # CLI
    "typer>=0.9.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0.0",
    "nest-asyncio>=1.5.0",
    # Utilities
    "python-dateutil>=2.8.0",
    "python-crontab>=3.0.0",
    "tenacity>=8.0",
    "deepagents>=0.5.0,<1.0",
    # deepagents-cli: install manually after uv sync (see below comment).
    # deepagents-cli>=0.0.15 requires langgraph-checkpoint-sqlite>=3.0.0 (already a dep).
    # Install with:
    #   uv pip install deepagents-cli --no-deps && uv pip install markdownify
    "langchain-community>=0.4.1",
    "langgraph>=1.0.8",
    "duckdb-engine>=0.17.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "python-frontmatter>=1.1.0",
    # Knowledge Base & Document Processing
    "PyPDF2>=3.0.0",
    "duckduckgo-search>=3.0.0",
    "lancedb>=0.29.2",
    "netutils>=1.17.1",
    "networkx>=3.6.1",
    "pdfplumber>=0.11.9",
    "sentence-transformers>=5.2.3",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "ruptures>=1.1.9",
    "numpy>=2.4.1",
    "pandas>=3.0.1",
    "ddgs>=9.11.4",
    "pygnmi>=0.8.15",

    "xmltodict>=1.0.4",
    "pyang>=2.7.1",
    "yangson>=1.6.7",
    "textfsm>=1.1.3",
    "ntc-templates>=9.0.0",
    # Required by deepagents-cli 0.0.10 at import time (installed --no-deps to avoid
    # deepagents==0.2.8 pin conflict; these transitive deps must be declared explicitly)
    "tavily-python>=0.3.0",
    "markdownify>=0.13.0",
    "pyjwt>=2.12.1",
]

[project.scripts]
olav = "olav.cli.main:cli_main"

[project.urls]
Homepage = "https://github.com/olav-ai/olav"
Repository = "https://github.com/olav-ai/olav"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "black>=23.0",
]
# netops optional is intentionally empty — nornir/netmiko moved to olav-netops package.
# Install olav-netops to get full network operations support:
#   pip install olav-netops  (includes nornir, nornir-netmiko, netutils, networkx)
netops = []
gnmi = [
    "pygnmi>=0.8.0",
]
enterprise = [
    "tink>=1.14.1",
    "PyJWT>=2.8.0",
]
ldap = [
    "ldap3>=2.9",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-awesome-pages-plugin>=2.9",
    "mkdocs-static-i18n>=1.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-timeout>=2.4.0",
    "pyright>=1.1.408",
    # Enterprise optional deps needed for unit tests
    "tink>=1.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "archive",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "ASYNC", "S", "B"]
ignore = ["E402", "E501", "ANN", "ASYNC", "S", "F401"]  # E402: Module level import not at top of file, E501: line length in docstrings

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S608"]
"src/olav/cli/main.py" = ["F401", "W291"]
"src/olav/core/memory/__init__.py" = ["F401"]  # S608: SQL injection false positive in tests
"src/olav/cli/cli_main.py" = ["E402", "ANN401", "S602", "S112"]
"src/olav/core/settings.py" = ["ANN401"]
"config/settings.py" = ["ANN401"]
"src/olav/core/llm.py" = ["ANN401"]
"src/olav/agents/query_agent.py" = ["ANN401"]
"src/olav/cli/display.py" = ["ANN401"]
"src/olav/cli/input_parser.py" = ["S602"]
"src/olav/services/gnmi_collector.py" = ["N816"]
"src/olav/core/database.py" = ["W291", "W293"]
".olav/workspace/**/*.py" = ["ANN201", "ANN001"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pyright]
typeCheckingMode = "standard"
exclude = [
    "_legacy_archived",
    "archive",
    ".venv",
    ".agent",
    ".olav",
    "tmp",
    "olav-ent",
    "olav-netops",
    "demo_watermark.py",
]
reportMissingImports = "warning"  # Downgrade missing imports to warnings (external deps)
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportOptionalCall = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportAttributeAccessIssue = "warning"
# Additional downgrades for less critical issues
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportIndexIssue = "warning"
reportCallIssue = "warning"
reportPossiblyUnboundVariable = "warning"
# Downgrade more errors to warnings for legacy code
reportArgumentType = "warning"
reportUndefinedVariable = "warning"
reportUnboundVariable = "warning"
reportIncompatibleMethodOverride = "warning"
# Ignore specific error patterns
reportGeneralTypeIssues = "warning"
reportRedeclaration = "warning"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "olav-netops/src"]
# Run notes:
#   Default: pytest tests/                     (all tests, no LLM/network needed)
#   E2E CLI:  pytest tests/e2e/test_cli.py     (subprocess, no LLM)
#   LLM:      pytest tests/ -m llm             (requires LLM_API_KEY)
#   Network:  pytest tests/ -m e2e             (requires real devices)
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "e2e: End-to-end tests (requires real devices)",
    "llm: Tests requiring real LLM API calls",
    "network: Tests requiring network device access",
    "slow: Slow-running tests",
    "integration: Integration tests (requires live CLAB/network services)",
]
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/olav"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

